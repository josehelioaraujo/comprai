services:

  comprai-api:
    build:
      context: .
      dockerfile: src/UcpAgent.Api/Dockerfile
    container_name: comprai-api
    ports:
      - '5020:5020'
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: 'http://+:5020'
      Features__UsarMockDados: 'false'
      Features__UsarRedis:     'true'
      Features__UsarKafka:     'true'
      Features__UsarRabbitMQ:  'true'
      Features__UsarPostgres:  'true'
      Redis__ConnectionString: redis:6379
      Kafka__BootstrapServers: comprai-kafka:9094
      RabbitMQ__Host:          rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: http://comprai-jaeger:4317
      OTEL_SERVICE_NAME: comprai-api
      Otel__Endpoint:    http://comprai-jaeger:4317
      Otel__ServiceName: comprai-api
      Shopify__AccessToken: ${SHOPIFY_ACCESS_TOKEN}
      Shopify__StoreUrl:    ${SHOPIFY_STORE_URL:-comprai-dev.myshopify.com}
      ConnectionStrings__Default: "Host=comprai-postgres;Port=5432;Database=comprai;Username=comprai;Password=${POSTGRES_PASSWORD};Timezone=UTC"
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      Jwt__ExpirationMinutes: '480'
      Brevo__ApiKey: ${BREVO_SMTP_KEY:-}
      Brevo__Login: ${BREVO_SMTP_LOGIN:-}
      Brevo__From: ${BREVO_FROM_EMAIL:-helioandrade@hotmail.com}
      App__WebUrl:   ${APP_WEB_URL:-http://2.25.122.11:3005}
      App__AdminUrl: ${APP_ADMIN_URL:-http://2.25.122.11:3004}
    depends_on:
      - redis
      - comprai-postgres
      - rabbitmq
    networks:
      - comprai-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: '{{.Name}}'

  comprai-mcp:
    build:
      context: .
      dockerfile: src/UcpAgent.McpServer/Dockerfile
    container_name: comprai-mcp
    ports:
      - '5030:5030'
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: 'http://+:5030'
      CompraApi__BaseUrl: http://comprai-api:5020
      OTEL_EXPORTER_OTLP_ENDPOINT: http://comprai-jaeger:4317
      OTEL_SERVICE_NAME: comprai-mcp
      Otel__Endpoint:    http://comprai-jaeger:4317
      Otel__ServiceName: comprai-mcp
    depends_on:
      - comprai-api
    networks:
      - comprai-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: '{{.Name}}'

  comprai-postgres:
    image: postgres:16-alpine
    container_name: comprai-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB:       comprai
      POSTGRES_USER:     comprai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ:                UTC
      PGTZ:              UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - comprai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comprai -d comprai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: comprai-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - comprai-network
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: comprai-kafka
    hostname: comprai-kafka
    ports:
      - '9094:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://comprai-kafka:9094,CONTROLLER://comprai-kafka:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://comprai-kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@comprai-kafka:9095
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: Q29tcHJhaUthZmthQ2x1c3Rl
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - comprai-network
    profiles:
      - kafka
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: comprai-kafka-ui
    ports:
      - '8083:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: comprai
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: comprai-kafka:9094
    depends_on:
      - kafka
    networks:
      - comprai-network
    profiles:
      - kafka

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: comprai-rabbitmq
    ports:
      - '5673:5672'
      - '15673:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - comprai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: comprai-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16687:16686'
      - '4319:4317'
      - '4320:4318'
    networks:
      - comprai-network
    profiles:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: comprai-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9091:9090'
    networks:
      - comprai-network
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: comprai-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    networks:
      - comprai-network
    profiles:
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: comprai-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - '3101:3100'
    networks:
      - comprai-network
    profiles:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: comprai-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - comprai-network
    profiles:
      - monitoring
    restart: unless-stopped

  comprai-mobile-v2:
    image: ghcr.io/josehelioaraujo/comprai-mobile-v2:latest
    container_name: comprai-mobile-v2
    ports:
      - '3005:3005'
    environment:
      NODE_ENV: production
      PORT: '3005'
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL:    ${NEXTAUTH_URL_MOBILE_V2:-http://localhost:3005}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${API_URL:-http://comprai-api:5020}
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      - comprai-api
    networks:
      - comprai-network
    restart: unless-stopped
    profiles:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: '{{.Name}}'

  comprai-admin:
    image: ghcr.io/josehelioaraujo/comprai-admin:latest
    container_name: comprai-admin
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: production
      # API_BASE_URL Ã© lida em runtime pelo proxy (nÃ£o NEXT_PUBLIC_, para nÃ£o ser baked no build)
      API_BASE_URL: ${ADMIN_API_URL:-http://comprai-api:5020}
      COOKIE_SECURE: 'false'
    depends_on:
      - comprai-api
    networks:
      - comprai-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: '{{.Name}}'

volumes:
  redis_data:
  kafka_data:
  rabbitmq_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  comprai-network:
    driver: bridge
