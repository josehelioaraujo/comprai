<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K6 Stress Test Dashboard — Comprai</title>
  <style>
    :root { --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3e; --accent: #7c3aed; --accent2: #06b6d4; --text: #e2e8f0; --muted: #94a3b8; --pass: #10b981; --fail: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
    .header-logo { font-size: 22px; font-weight: 700; color: var(--accent); }
    .header-controls { margin-left: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    select { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
    .scenario-tabs { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; border-bottom: 2px solid var(--border); }
    .scenario-tab { padding: 12px 16px; background: none; border: none; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; text-transform: uppercase; }
    .scenario-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
    .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; margin-top: 28px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: rgba(255, 255, 255, 0.04); padding: 12px 16px; text-align: left; }
    td { padding: 12px 16px; border-top: 1px solid var(--border); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .badge-pass { background: rgba(16, 185, 129, 0.15); color: var(--pass); padding: 4px 10px; border-radius: 20px; }
    .badge-fail { background: rgba(239, 68, 68, 0.15); color: var(--fail); padding: 4px 10px; border-radius: 20px; }
  </style>
</head>
<body>
<header>
  <div class="header-logo">⚡ Comprai — K6 Dashboard</div>
  <div class="header-controls">
    <label>Resultado:</label>
    <select id="resultSelect" onchange="changeResult()"><option>Carregando...</option></select>
    <div><span>Test Type: <span id="hdr-type">—</span></span></div>
  </div>
</header>
<main>
  <div class="section-title">Configuração do Teste</div>
  <table><thead><tr><th>Tipo</th><th>URL Alvo</th><th>VUs</th><th>Duração</th><th>Status</th></tr></thead>
  <tbody id="configTableBody"><tr><td colspan="5">Carregando...</td></tr></tbody></table>
  <div class="section-title">Resumo de Resultados</div>
  <table><thead><tr><th>Tipo</th><th>p50</th><th>p95</th><th>p99</th><th>Req/s</th><th>Total</th><th>Erro %</th><th>Status</th></tr></thead>
  <tbody id="resultsTableBody"><tr><td colspan="8">Carregando...</td></tr></tbody></table>
  <div class="section-title">Detalhes por Cenário</div>
  <div class="scenario-tabs" id="scenarioTabs"></div>
  <div id="scenarioContent"></div>
</main>
<script>
const API_BASE = 'https://comprai.2.25.122.11.nip.io';
let dashboardData = null;
async function loadIndex() {
  try {
    const r = await fetch(API_BASE + '/k6/results/index.json');
    if (r.ok) {
      const data = await r.json();
      const files = data.files || [];
      const select = document.getElementById('resultSelect');
      select.innerHTML = files.map((f, i) => `<option value="${f}" ${i === 0 ? 'selected' : ''}>${f}</option>`).join('');
      if (files.length > 0) await loadResult(files[0]);
    }
  } catch(e) { console.error(e); }
}
async function changeResult() {
  const file = document.getElementById('resultSelect').value;
  await loadResult(file);
}
async function loadResult(filename) {
  try {
    const r = await fetch(API_BASE + `/k6/results/${filename}`);
    if (r.ok) {
      dashboardData = await r.json();
      initDashboard();
    }
  } catch(e) { console.error(e); }
}
function initDashboard() {
  if (!dashboardData) return;
  const meta = dashboardData.meta || {};
  const scenarios = dashboardData.scenarios || [];
  document.getElementById('hdr-type').textContent = meta.test_type || '—';
  document.getElementById('configTableBody').innerHTML = `<tr><td>${meta.test_type}</td><td>${meta.target_url}</td><td>${meta.vus}</td><td>${meta.duration}</td><td><span class="badge-pass">OK</span></td></tr>`;
  document.getElementById('resultsTableBody').innerHTML = scenarios.map(sc => `<tr><td>${sc.sc}</td><td>${sc.p50}</td><td>${sc.p95}</td><td>${sc.p99}</td><td>${sc.rps}</td><td>${sc.total}</td><td>${(sc.err*100).toFixed(2)}</td><td><span class="${sc.ok ? 'badge-pass' : 'badge-fail'}">${sc.ok ? 'OK' : 'FAIL'}</span></td></tr>`).join('');
  document.getElementById('scenarioTabs').innerHTML = scenarios.map((sc, i) => `<button class="scenario-tab ${i === 0 ? 'active' : ''}">${sc.sc.toUpperCase()}</button>`).join('');
}
window.addEventListener('DOMContentLoaded', loadIndex);
</script>
</body>
</html>
