name: NR Rate Debug
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test rate queries
        env:
          NR_USER_KEY: ${{ secrets.NEW_RELIC_USER_KEY }}
          NR_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, urllib.request, os, base64
          key = os.environ['NR_USER_KEY']
          account_id = os.environ['NR_ACCOUNT_ID']
          gh_token = os.environ['GH_TOKEN']
          repo = os.environ.get('GITHUB_REPOSITORY','')

          def nrql(q):
              payload = json.dumps({"query":"query($nrql: Nrql!) { actor { account(id: "+account_id+") { nrql(query: $nrql) { results } } } }","variables":{"nrql":q}}).encode()
              req = urllib.request.Request("https://api.newrelic.com/graphql",data=payload,headers={"Content-Type":"application/json","API-Key":key},method="POST")
              with urllib.request.urlopen(req) as r: return json.loads(r.read())

          results = {}
          # rate com alias simples
          q1 = nrql("SELECT rate(count(*), 1 minute) as rpm FROM Span WHERE service.name = 'comprai-api' SINCE 1 hour ago")
          results['rate_alias'] = q1.get('data',{}).get('actor',{}).get('account',{}).get('nrql',{}).get('results',[])
          # max(rate) e average(rate) com alias
          q2 = nrql("SELECT max(rate(count(*), 1 minute)) as peak, average(rate(count(*), 1 minute)) as avg FROM Span WHERE service.name = 'comprai-api' SINCE 1 hour ago")
          results['max_avg_rate'] = q2.get('data',{}).get('actor',{}).get('account',{}).get('nrql',{}).get('results',[])
          # p95 com alias
          q3 = nrql("SELECT percentile(duration.ms, 50, 75, 95, 99) FROM Span WHERE service.name = 'comprai-api' SINCE 1 hour ago")
          results['p95_multival'] = q3.get('data',{}).get('actor',{}).get('account',{}).get('nrql',{}).get('results',[])

          content = json.dumps(results, indent=2)
          print(content)
          b64 = base64.b64encode(content.encode()).decode()
          api_url = f"https://api.github.com/repos/{repo}/contents/nr-rate-debug.json"
          try:
              with urllib.request.urlopen(urllib.request.Request(api_url,headers={"Authorization":f"Bearer {gh_token}","Accept":"application/vnd.github+json"})) as r:
                  sha = json.loads(r.read()).get('sha','')
          except: sha = ''
          payload = {"message":"debug: NR rate/p95 keys","content":b64}
          if sha: payload["sha"] = sha
          req = urllib.request.Request(api_url,data=json.dumps(payload).encode(),headers={"Authorization":f"Bearer {gh_token}","Content-Type":"application/json","Accept":"application/vnd.github+json"},method="PUT")
          with urllib.request.urlopen(req) as r: print("Salvo:", r.status)
          EOF
