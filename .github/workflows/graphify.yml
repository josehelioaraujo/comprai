name: Knowledge Graph

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'frontend/**'
      - '.github/workflows/graphify.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-graph:
    name: Generate & Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graphify
        run: pip install graphifyy --quiet

      - name: Generate knowledge graph
        run: |
          graphify extract . --code-only
          graphify cluster-only .

      - name: Prepare Pages output
        run: |
          mkdir -p pages-out
          cp graphify-out/graph.html pages-out/index.html
          cp graphify-out/graph.json pages-out/graph.json
          cp graphify-out/GRAPH_REPORT.md pages-out/GRAPH_REPORT.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
