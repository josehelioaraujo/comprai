name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      broker:
        description: 'Message broker'
        required: false
        default: 'nenhum'
        type: choice
        options: [nenhum, kafka, rabbitmq]
      usar_banco:
        description: 'Usar banco real (Redis)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  BUILD_VERSION: "1.0.${{ github.run_number }}"
  DOTNET_VERSION: '10.0.x'
  VPS_HOST: '2.25.122.11'
  VPS_USER: 'root'
  VPS_PATH: '/home/projetos/comprai'
  API_PORT: '5020'
  MCP_PORT: '5030'
  COVERAGE_THRESHOLD: '90'

jobs:

  # ── 1. BUILD ────────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore — Solution
        run: dotnet restore comprai.sln

      - name: Restore — Projetos de Teste
        run: |
          dotnet restore tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj
          dotnet restore tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj
          dotnet restore tests/UcpAgent.Catalog.MercadoLivre.Tests/UcpAgent.Catalog.MercadoLivre.Tests.csproj

      - name: Build Solution
        run: |
          dotnet build src/UcpAgent.SharedKernel/UcpAgent.SharedKernel.csproj --configuration Release --no-restore
          dotnet build src/UcpAgent.Domain/UcpAgent.Domain.csproj --configuration Release --no-restore
          dotnet build src/UcpAgent.Application/UcpAgent.Application.csproj --configuration Release --no-restore
          dotnet build src/UcpAgent.Infrastructure/UcpAgent.Infrastructure.csproj --configuration Release --no-restore
          dotnet build src/UcpAgent.Api/UcpAgent.Api.csproj --configuration Release --no-restore
          dotnet build src/plugins/UcpAgent.FakeCatalog/UcpAgent.FakeCatalog.csproj --configuration Release --no-restore

      - name: Build Projetos de Teste
        run: |
          dotnet build tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj --configuration Release --no-restore
          dotnet build tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj --configuration Release --no-restore
          dotnet build tests/UcpAgent.Catalog.MercadoLivre.Tests/UcpAgent.Catalog.MercadoLivre.Tests.csproj --configuration Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/**/bin/Release/
            src/**/obj/Release/
          retention-days: 1

  # ── 2. TESTES UNITÁRIOS + QUALITY GATE ─────────────────────────────────────
  unit-tests:
    name: 🧪 Testes Unitários
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore comprai.sln

      - name: Instalar ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore projetos de teste
        run: |
          dotnet restore tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj
          dotnet restore tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj
          dotnet restore tests/UcpAgent.Catalog.MercadoLivre.Tests/UcpAgent.Catalog.MercadoLivre.Tests.csproj

      - name: Run Unit Tests com cobertura
        run: |
          mkdir -p ./test-results/unit

          dotnet test tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=unit-domain.trx" \
            --results-directory ./test-results/unit \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage"

          dotnet test tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=unit-app.trx" \
            --results-directory ./test-results/unit \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage"

          dotnet test tests/UcpAgent.Catalog.MercadoLivre.Tests/UcpAgent.Catalog.MercadoLivre.Tests.csproj \
            --configuration Release \
            --settings coverlet.runsettings \
            --logger "trx;LogFileName=unit-ml.trx" \
            --results-directory ./test-results/unit \
            --collect:"XPlat Code Coverage"

      - name: Gerar relatório de cobertura
        run: |
          COVERAGE_FILES=$(find ./test-results/unit -name "coverage.cobertura.xml" | paste -sd ';' -)
          echo "Arquivos encontrados: $COVERAGE_FILES"
          reportgenerator \
            -reports:"$COVERAGE_FILES" \
            -targetdir:"./coverage-report" \
            -reporttypes:"Cobertura;TextSummary"

      - name: Quality Gate — cobertura mínima ${{ env.COVERAGE_THRESHOLD }}%
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET, sys

          tree = ET.parse('./coverage-report/Cobertura.xml')
          root = tree.getroot()

          # atributo pode ser line-rate ou lineRate dependendo da versão
          rate = root.attrib.get('line-rate') or root.attrib.get('lineRate') or '0'
          coverage = float(rate) * 100
          threshold = float('${{ env.COVERAGE_THRESHOLD }}')

          print(f'📊 Cobertura atual: {coverage:.1f}%')
          print(f'🎯 Threshold: {threshold}%')

          if coverage < threshold:
              print(f'❌ Quality Gate FALHOU: {coverage:.1f}% < {threshold}%')
              sys.exit(1)
          else:
              print(f'✅ Quality Gate OK: {coverage:.1f}% >= {threshold}%')
          EOF

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/unit/*.trx
          if-no-files-found: ignore

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage-report/
          if-no-files-found: ignore

  # ── 3. TESTES DE INTEGRAÇÃO ─────────────────────────────────────────────────
  integration-tests:
    name: 🔗 Testes de Integração
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/UcpAgent.Integration.Tests/UcpAgent.Integration.Tests.csproj

      - name: Build
        run: dotnet build tests/UcpAgent.Integration.Tests/UcpAgent.Integration.Tests.csproj --configuration Release --no-restore

      - name: Run Integration Tests
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_SKIP_TOKEN_TEST: 'true'
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE_URL: 'comprai-dev.myshopify.com'
          Features__UsarMockDados: 'false'
          Features__UsarRedis: 'false'
          Features__UsarKafka: 'false'
          Features__UsarRabbitMQ: 'false'
          MercadoLivre__AccessToken: ${{ secrets.ML_ACCESS_TOKEN }}
          Shopify__AccessToken: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          Shopify__StoreUrl: 'comprai-dev.myshopify.com'
        run: |
          dotnet test tests/UcpAgent.Integration.Tests/UcpAgent.Integration.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results/integration

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/integration/*.trx
          if-no-files-found: ignore


  # ── SONAR ───────────────────────────────────────────────────────────────────
  sonar:
    name: 🔍 SonarCloud
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java (requerido pelo SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restaurar dependências
        run: |
          dotnet restore comprai.sln
          dotnet restore tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj
          dotnet restore tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj
          dotnet restore tests/UcpAgent.Catalog.MercadoLivre.Tests/UcpAgent.Catalog.MercadoLivre.Tests.csproj

      - name: Iniciar análise SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"josehelioaraujo_comprai" \
            /o:"josehelioaraujo" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.projectBaseDir="${{ github.workspace }}" \
            "/d:sonar.cs.opencover.reportsPaths=${{ github.workspace }}/coverage/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/Program.cs,src/UcpAgent.Infrastructure/**,src/plugins/**,src/UcpAgent.McpServer/**,src/UcpAgent.Api/Mocks/**,src/UcpAgent.Api/Endpoints/**,src/UcpAgent.Api/Adapters/**,tests/**,**/*.html,**/wwwroot/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**,src/UcpAgent.Infrastructure/**,src/plugins/**,src/UcpAgent.McpServer/**,src/UcpAgent.Api/Mocks/**,src/UcpAgent.Api/Endpoints/**,src/UcpAgent.Api/Adapters/**,tests/**,**/*.html,**/wwwroot/**"

      - name: Build para análise
        run: dotnet build comprai.sln --no-restore --configuration Release

      - name: Testes com cobertura (OpenCover para Sonar)
        run: |
          mkdir -p ${{ github.workspace }}/coverage/domain
          mkdir -p ${{ github.workspace }}/coverage/application

          dotnet test tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj \
            --configuration Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ${{ github.workspace }}/coverage/domain \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          dotnet test tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj \
            --configuration Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ${{ github.workspace }}/coverage/application \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Finalizar análise SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # ── 4. DEPLOY VPS ───────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy VPS Hostinger
    runs-on: ubuntu-latest
    needs: [integration-tests, sonar]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.VPS_PATH }}
            git checkout -- . && git pull origin main
            BROKER="${{ github.event.inputs.broker || 'nenhum' }}"
            USAR_BANCO="${{ github.event.inputs.usar_banco || 'false' }}"
            sed -i "s/UsarRedis=.*/UsarRedis=${USAR_BANCO}/" .env
            sed -i "s/BUILD_VERSION=.*/BUILD_VERSION=${{ env.BUILD_VERSION }}/" .env
            mkdir -p wwwroot
            cp docs/price-watcher-test.html wwwroot/
            docker compose -f deploy/docker-compose.yml down --remove-orphans --volumes || true
            docker rm -f comprai-api comprai-redis comprai-mcp || true
            docker compose -f deploy/docker-compose.yml build --no-cache
            docker compose -f deploy/docker-compose.yml up -d --force-recreate
            sleep 20
            curl -f http://localhost:${{ env.API_PORT }}/health/live || exit 1

  # ── 5. SMOKE TESTS ──────────────────────────────────────────────────────────
  smoke-tests:
    name: 💨 Smoke Tests Newman
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Smoke Tests
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_SKIP_TOKEN_TEST: 'true'
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          newman run newman/comprai-smoke.json \
            --env-var "baseUrl=http://${{ env.VPS_HOST }}:${{ env.API_PORT }}" \
            --env-var "mcpUrl=http://${{ env.VPS_HOST }}:${{ env.MCP_PORT }}" \
            --env-var "ML_ACCESS_TOKEN=${ML_ACCESS_TOKEN}" \
            --env-var "SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export ./newman-report/smoke-report.html

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: ./newman-report/smoke-report.html
          if-no-files-found: ignore





