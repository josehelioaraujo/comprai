name: Comprai — CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      broker:
        description: 'Message broker'
        required: false
        default: 'nenhum'
        type: choice
        options: [nenhum, kafka, rabbitmq]
      usar_banco:
        description: 'Usar banco real (Redis)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  BUILD_VERSION: "1.0.${{ github.run_number }}"
  DOTNET_VERSION: '10.0.x'
  VPS_HOST: '2.25.122.11'
  VPS_USER: 'root'
  VPS_PATH: '/home/projetos/comprai'
  API_PORT: '5020'
  MCP_PORT: '5030'

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Unit Tests
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: 🧪 Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore comprai.sln

      - name: Build
        run: dotnet build comprai.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: |
          dotnet test comprai.sln \
            --configuration Release \
            --no-build \
            --filter "Category=Unit|FullyQualifiedName~CartTests" \
            --logger "trx;LogFileName=unit-results.trx" \
            --results-directory ./test-results/unit

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/unit/*.trx

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Integration Tests
  # ─────────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: 🔗 Testes de Integração
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore comprai.sln

      - name: Build
        run: dotnet build comprai.sln --configuration Release --no-restore

      - name: Run Integration Tests
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          UsarMockDados: 'false'
          UsarRedis: 'false'
          UsarKafka: 'false'
          UsarRabbitMQ: 'false'
          MercadoLivre__AccessToken: ${{ secrets.ML_ACCESS_TOKEN }}
        run: |
          dotnet test UcpAgent.Tests/UcpAgent.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName~Integration" \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results/integration

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/integration/*.trx

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy VPS
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy VPS Hostinger
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.VPS_PATH }}
            git pull origin main

            # Feature flags via env
            BROKER="${{ github.event.inputs.broker || 'nenhum' }}"
            USAR_BANCO="${{ github.event.inputs.usar_banco || 'false' }}"

            sed -i "s/UsarRedis=.*/UsarRedis=${USAR_BANCO}/" .env
            sed -i "s/UsarKafka=.*/UsarKafka=$([ \"$BROKER\" = 'kafka' ] && echo true || echo false)/" .env
            sed -i "s/UsarRabbitMQ=.*/UsarRabbitMQ=$([ \"$BROKER\" = 'rabbitmq' ] && echo true || echo false)/" .env
            sed -i "s/BUILD_VERSION=.*/BUILD_VERSION=${{ env.BUILD_VERSION }}/" .env

            docker compose build --no-cache
            docker compose up -d

            echo "Aguardando API subir..."
            sleep 15

            # Health check pós-deploy
            curl -f http://localhost:${{ env.API_PORT }}/health/live || exit 1
            echo "✅ Deploy OK — v${{ env.BUILD_VERSION }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Smoke Tests Newman
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: 💨 Smoke Tests Newman
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Smoke Tests
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
        run: |
          newman run newman/comprai-smoke.json \
            --env-var "baseUrl=http://${{ env.VPS_HOST }}:${{ env.API_PORT }}" \
            --env-var "mcpUrl=http://${{ env.VPS_HOST }}:${{ env.MCP_PORT }}" \
            --env-var "ML_ACCESS_TOKEN=${ML_ACCESS_TOKEN}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export ./newman-report/smoke-report.html \
            --reporter-htmlextra-title "Comprai Smoke Tests — v${{ env.BUILD_VERSION }}" \
            --bail

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: ./newman-report/smoke-report.html

      - name: Publish to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./newman-report
          destination_dir: smoke/${{ env.BUILD_VERSION }}

      - name: Notify Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "### 💨 Smoke Tests — v${{ env.BUILD_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: **${STATUS}**" >> $GITHUB_STEP_SUMMARY
          echo "Report: https://${{ github.repository_owner }}.github.io/comprai/smoke/${{ env.BUILD_VERSION }}/smoke-report.html" >> $GITHUB_STEP_SUMMARY
