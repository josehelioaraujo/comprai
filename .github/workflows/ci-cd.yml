name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main, "feat/**"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      broker:
        description: 'Message broker'
        required: false
        default: 'nenhum'
        type: choice
        options: [nenhum, kafka, rabbitmq]
      usar_banco:
        description: 'Usar banco real (Redis)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  BUILD_VERSION: "1.0.${{ github.run_number }}"
  DOTNET_VERSION: '10.0.x'
  VPS_HOST: '2.25.122.11'
  VPS_USER: 'root'
  VPS_PATH: '/home/projetos/comprai'
  API_PORT: '5020'
  MCP_PORT: '5030'
  COVERAGE_THRESHOLD: '75'

jobs:

  # ── 1. BUILD ────────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore — Solution
        run: dotnet restore comprai.sln

      - name: Restore — Projetos de Teste
        run: |
          dotnet restore tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj
          dotnet restore tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj
          dotnet restore tests/UcpAgent.Catalog.MercadoLivre.Tests/UcpAgent.Catalog.MercadoLivre.Tests.csproj

      - name: Build Solution
        run: |
          dotnet build src/UcpAgent.SharedKernel/UcpAgent.SharedKernel.csproj --configuration Release --no-restore
          dotnet build src/UcpAgent.Domain/UcpAgent.Domain.csproj --configuration Release --no-restore
          dotnet build src/UcpAgent.Application/UcpAgent.Application.csproj --configuration Release --no-restore
          dotnet build src/UcpAgent.Infrastructure/UcpAgent.Infrastructure.csproj --configuration Release --no-restore
          dotnet build src/UcpAgent.Api/UcpAgent.Api.csproj --configuration Release --no-restore
          dotnet build src/plugins/UcpAgent.FakeCatalog/UcpAgent.FakeCatalog.csproj --configuration Release --no-restore

      - name: Build Projetos de Teste
        run: |
          dotnet build tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj --configuration Release --no-restore
          dotnet build tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj --configuration Release --no-restore
          dotnet build tests/UcpAgent.Catalog.MercadoLivre.Tests/UcpAgent.Catalog.MercadoLivre.Tests.csproj --configuration Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/**/bin/Release/
            src/**/obj/Release/
          retention-days: 1

  # ── 2. TESTES UNITÁRIOS + QUALITY GATE ─────────────────────────────────────
  unit-tests:
    name: 🧪 Testes Unitários
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore comprai.sln

      - name: Instalar ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore projetos de teste
        run: |
          dotnet restore tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj
          dotnet restore tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj
          dotnet restore tests/UcpAgent.Catalog.MercadoLivre.Tests/UcpAgent.Catalog.MercadoLivre.Tests.csproj

      - name: Run Unit Tests com cobertura
        run: |
          mkdir -p ./test-results/unit

          dotnet test tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=unit-domain.trx" \
            --results-directory ./test-results/unit \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage"

          dotnet test tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=unit-app.trx" \
            --results-directory ./test-results/unit \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage"

          dotnet test tests/UcpAgent.Catalog.MercadoLivre.Tests/UcpAgent.Catalog.MercadoLivre.Tests.csproj \
            --configuration Release \
            --settings coverlet.runsettings \
            --logger "trx;LogFileName=unit-ml.trx" \
            --results-directory ./test-results/unit \
            --collect:"XPlat Code Coverage"

      - name: Gerar relatório de cobertura
        run: |
          COVERAGE_FILES=$(find ./test-results/unit -name "coverage.cobertura.xml" | paste -sd ';' -)
          echo "Arquivos encontrados: $COVERAGE_FILES"
          reportgenerator \
            -reports:"$COVERAGE_FILES" \
            -targetdir:"./coverage-report" \
            -reporttypes:"Cobertura;TextSummary"

      - name: Quality Gate — cobertura mínima ${{ env.COVERAGE_THRESHOLD }}%
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET, sys

          tree = ET.parse('./coverage-report/Cobertura.xml')
          root = tree.getroot()

          rate = root.attrib.get('line-rate') or root.attrib.get('lineRate') or '0'
          coverage = float(rate) * 100
          threshold = float('${{ env.COVERAGE_THRESHOLD }}')

          print(f'📊 Cobertura atual: {coverage:.1f}%')
          print(f'🎯 Threshold: {threshold}%')

          if coverage < threshold:
              print(f'❌ Quality Gate FALHOU: {coverage:.1f}% < {threshold}%')
              sys.exit(1)
          else:
              print(f'✅ Quality Gate OK: {coverage:.1f}% >= {threshold}%')
          EOF

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/unit/*.trx
          if-no-files-found: ignore

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage-report/
          if-no-files-found: ignore

  # ── 3. TESTES DE INTEGRAÇÃO ─────────────────────────────────────────────────
  integration-tests:
    name: 🔗 Testes de Integração
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/UcpAgent.Integration.Tests/UcpAgent.Integration.Tests.csproj

      - name: Build
        run: dotnet build tests/UcpAgent.Integration.Tests/UcpAgent.Integration.Tests.csproj --configuration Release --no-restore

      - name: Run Integration Tests
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_SKIP_TOKEN_TEST: 'true'
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE_URL: 'comprai-dev.myshopify.com'
          Features__UsarMockDados: 'false'
          Features__UsarRedis: 'false'
          Features__UsarKafka: 'false'
          Features__UsarRabbitMQ: 'false'
          MercadoLivre__AccessToken: ${{ secrets.ML_ACCESS_TOKEN }}
          Shopify__AccessToken: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          Shopify__StoreUrl: 'comprai-dev.myshopify.com'
        run: |
          dotnet test tests/UcpAgent.Integration.Tests/UcpAgent.Integration.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results/integration

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/integration/*.trx
          if-no-files-found: ignore


  # ── SONAR ───────────────────────────────────────────────────────────────────
  sonar:
    name: 🔍 SonarCloud
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java (requerido pelo SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restaurar dependências
        run: |
          dotnet restore comprai.sln
          dotnet restore tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj
          dotnet restore tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj
          dotnet restore tests/UcpAgent.Catalog.MercadoLivre.Tests/UcpAgent.Catalog.MercadoLivre.Tests.csproj

      - name: Iniciar análise SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"josehelioaraujo_comprai" \
            /o:"josehelioaraujo" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.projectBaseDir="${{ github.workspace }}" \
            "/d:sonar.cs.opencover.reportsPaths=${{ github.workspace }}/coverage/**/coverage.opencover.xml" \
            /d:sonar.sources="src" \
            /d:sonar.exclusions="**/Migrations/**,**/Program.cs,src/UcpAgent.Infrastructure/**,src/plugins/**,src/UcpAgent.McpServer/**,src/UcpAgent.Api/Mocks/**,src/UcpAgent.Api/Endpoints/**,src/UcpAgent.Api/Adapters/**,tests/**,**/*.html,**/wwwroot/**,k6/**,.github/**,docs/**,deploy/**,newman/**,observability/**,**/*.py,**/*.sh" \
            /d:sonar.coverage.exclusions="**/Migrations/**,src/UcpAgent.Infrastructure/**,src/plugins/**,src/UcpAgent.McpServer/**,src/UcpAgent.Api/Mocks/**,src/UcpAgent.Api/Endpoints/**,src/UcpAgent.Api/Adapters/**,tests/**,**/*.html,**/wwwroot/**,k6/**,.github/**,docs/**,deploy/**,newman/**,observability/**"

      - name: Build para análise
        run: dotnet build comprai.sln --no-restore --configuration Release

      - name: Testes com cobertura (OpenCover para Sonar)
        run: |
          mkdir -p ${{ github.workspace }}/coverage/domain
          mkdir -p ${{ github.workspace }}/coverage/application

          dotnet test tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj \
            --configuration Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ${{ github.workspace }}/coverage/domain \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          dotnet test tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj \
            --configuration Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ${{ github.workspace }}/coverage/application \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Finalizar análise SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"


      - name: Buscar métricas SonarCloud
        id: sonar_fetch
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
        run: |
          METRICS="alert_status,bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,security_rating,reliability_rating,sqale_rating,ncloc"
          SHORT_SHA="${RUN_SHA:0:7}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/measures/component?component=josehelioaraujo_comprai&metricKeys=$METRICS" \
            -o sonar-raw.json

          if ! python3 -c "import json,sys; json.load(open('sonar-raw.json'))" 2>/dev/null; then
            echo "❌ SonarCloud retornou resposta inválida:"
            cat sonar-raw.json
            exit 1
          fi

          RUN_INT=$(echo "$RUN_NUMBER" | tr -d '[:space:]')
          python3 -c "
          import json
          d = json.load(open('sonar-raw.json'))
          d.update({'run': int('$RUN_INT'), 'sha': '$SHORT_SHA', 'timestamp': '$TIMESTAMP'})
          json.dump(d, open('sonar-metrics.json', 'w'))
          print('sonar-metrics.json gerado')
          "
          # Expor conteúdo como output para o step SSH
          echo "SONAR_JSON=$(cat sonar-metrics.json)" >> $GITHUB_OUTPUT

      - name: Publicar métricas SonarCloud na VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          SONAR_JSON: ${{ steps.sonar_fetch.outputs.SONAR_JSON }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          envs: SONAR_JSON
          script: |
            mkdir -p /var/www/html/k6/results/sonar
            echo "$SONAR_JSON" > /var/www/html/k6/results/sonar/latest.json
            echo "✅ sonar/latest.json publicado"

      - name: Append history.json — Evolução
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime, timezone

          try:
              sm = json.load(open('sonar-metrics.json'))
              measures = {m['metric']: m.get('value','0') for m in sm.get('component',{}).get('measures',[])}
          except Exception as e:
              print(f"⚠ sonar-metrics.json não disponível: {e}")
              measures = {}

          entry = {
              "run":         int(os.environ.get("RUN_NUMBER", 0)),
              "sha":         os.environ.get("RUN_SHA", "")[:7],
              "date":        datetime.now(timezone.utc).strftime("%Y-%m-%d"),
              "timestamp":   datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source":      "sonar",
              "coverage":    float(measures.get("coverage", 0)),
              "bugs":        int(measures.get("bugs", 0)),
              "smells":      int(measures.get("code_smells", 0)),
              "duplication": float(measures.get("duplicated_lines_density", 0))
          }
          json.dump(entry, open('history-entry.json','w'))
          print(f"✅ entry: run#{entry['run']} coverage={entry['coverage']}%")
          PYEOF

      - name: Publicar history.json na VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          HISTORY_ENTRY: ${{ toJSON(fromJSON(steps.sonar_fetch.outputs.SONAR_JSON || '{}')) }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          envs: RUN_NUMBER,RUN_SHA
          script: |
            python3 << 'PYEOF'
            import json, os
            from pathlib import Path
            from datetime import datetime, timezone

            HISTORY = Path("/var/www/html/k6/results/history.json")
            history = json.loads(HISTORY.read_text()) if HISTORY.exists() else []

            # Ler entry do arquivo temporário se existir, senão criar vazio
            entry = {
                "run":    int(os.environ.get("RUN_NUMBER", 0)),
                "sha":    os.environ.get("RUN_SHA", "")[:7],
                "date":   datetime.now(timezone.utc).strftime("%Y-%m-%d"),
                "source": "sonar"
            }

            existing = next((i for i,e in enumerate(history)
                if e.get("run") == entry["run"] and e.get("source") == "sonar"), None)
            if existing is not None:
                history[existing].update(entry)
            else:
                history.append(entry)

            history = sorted(history, key=lambda x: x.get("run", 0))[-50:]
            HISTORY.parent.mkdir(parents=True, exist_ok=True)
            HISTORY.write_text(json.dumps(history, indent=2))
            print(f"✅ history.json: {len(history)} entradas")
            PYEOF

  # ── 4. DEPLOY VPS ───────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy VPS Hostinger
    runs-on: ubuntu-latest
    needs: [integration-tests, sonar]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push imagem para GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/UcpAgent.Api/Dockerfile
          push: true
          tags: ghcr.io/josehelioaraujo/comprai-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ADMIN_RESTART_PASSWORD: ${{ secrets.ADMIN_RESTART_PASSWORD }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_USER_KEY: ${{ secrets.NEW_RELIC_USER_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          envs: DATADOG_API_KEY,BUILD_VERSION,GH_PAT,ADMIN_RESTART_PASSWORD,ML_CLIENT_ID,ML_CLIENT_SECRET,NEW_RELIC_LICENSE_KEY,NEW_RELIC_USER_KEY,NEW_RELIC_ACCOUNT_ID,RESEND_API_KEY
          command_timeout: 15m
          script: |
            set -e
            cd ${{ env.VPS_PATH }}
            git checkout -- .
            git remote set-url origin https://x-access-token:${GH_PAT}@github.com/josehelioaraujo/comprai.git
            git fetch origin && git reset --hard origin/main

            # Redis sempre habilitado
            sed -i "s/UsarRedis=.*/UsarRedis=true/" .env
            sed -i "s/BUILD_VERSION=.*/BUILD_VERSION=${{ env.BUILD_VERSION }}/" .env

            # Injetar/atualizar DD_API_KEY no .env
            grep -q '^DD_API_KEY=' .env \
              && sed -i "s|^DD_API_KEY=.*|DD_API_KEY=${DATADOG_API_KEY}|" .env \
              || echo "DD_API_KEY=${DATADOG_API_KEY}" >> .env

            # Injetar GH_PAT no .env para /api/github/dispatch
            grep -q '^GH_PAT=' .env \
              && sed -i "s|^GH_PAT=.*|GH_PAT=${{ secrets.GH_PAT }}|" .env \
              || echo "GH_PAT=${{ secrets.GH_PAT }}" >> .env

            # Injetar NEW_RELIC_LICENSE_KEY no .env
            grep -q '^NEW_RELIC_LICENSE_KEY=' .env \
              && sed -i "s|^NEW_RELIC_LICENSE_KEY=.*|NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}|" .env \
              || echo "NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}" >> .env

            # Injetar NEW_RELIC_USER_KEY no .env
            grep -q '^NEW_RELIC_USER_KEY=' .env \
              && sed -i "s|^NEW_RELIC_USER_KEY=.*|NEW_RELIC_USER_KEY=${NEW_RELIC_USER_KEY}|" .env \
              || echo "NEW_RELIC_USER_KEY=${NEW_RELIC_USER_KEY}" >> .env

            # Injetar NEW_RELIC_ACCOUNT_ID no .env
            grep -q '^NEW_RELIC_ACCOUNT_ID=' .env \
              && sed -i "s|^NEW_RELIC_ACCOUNT_ID=.*|NEW_RELIC_ACCOUNT_ID=${NEW_RELIC_ACCOUNT_ID}|" .env \
              || echo "NEW_RELIC_ACCOUNT_ID=${NEW_RELIC_ACCOUNT_ID}" >> .env

            # Injetar senha do Admin Restart no .env (validada pela API)
            grep -q '^ADMIN_RESTART_PASSWORD=' .env \
              && sed -i "s|^ADMIN_RESTART_PASSWORD=.*|ADMIN_RESTART_PASSWORD=${ADMIN_RESTART_PASSWORD}|" .env \
              || echo "ADMIN_RESTART_PASSWORD=${ADMIN_RESTART_PASSWORD}" >> .env

            # Injetar credenciais MercadoLivre no .env
            grep -q '^ML_CLIENT_ID=' .env \
              && sed -i "s|^ML_CLIENT_ID=.*|ML_CLIENT_ID=${ML_CLIENT_ID}|" .env \
              || echo "ML_CLIENT_ID=${ML_CLIENT_ID}" >> .env
            grep -q '^ML_CLIENT_SECRET=' .env \
              && sed -i "s|^ML_CLIENT_SECRET=.*|ML_CLIENT_SECRET=${ML_CLIENT_SECRET}|" .env \
              || echo "ML_CLIENT_SECRET=${ML_CLIENT_SECRET}" >> .env

            # Injetar RESEND_API_KEY e FROM_EMAIL no .env
            grep -q '^RESEND_API_KEY=' .env \
              && sed -i "s|^RESEND_API_KEY=.*|RESEND_API_KEY=${RESEND_API_KEY}|" .env \
              || echo "RESEND_API_KEY=${RESEND_API_KEY}" >> .env
            grep -q '^Resend__FromEmail=' .env \
              && sed -i "s|^Resend__FromEmail=.*|Resend__FromEmail=helioandrade@hotmail.com|" .env \
              || echo "Resend__FromEmail=helioandrade@hotmail.com" >> .env

            # Garantir Redis connection string correta
            grep -q '^ConnectionStrings__Redis=' .env \
              && sed -i "s|^ConnectionStrings__Redis=.*|ConnectionStrings__Redis=comprai-redis:6379,connectTimeout=2000,syncTimeout=2000,abortConnect=false|" .env \
              || echo "ConnectionStrings__Redis=comprai-redis:6379,connectTimeout=2000,syncTimeout=2000,abortConnect=false" >> .env

            # Feature flags — cenário real (sem mocks, com Redis, Kafka, RabbitMQ)
            grep -q '^USAR_REDIS=' .env \
              && sed -i "s|^USAR_REDIS=.*|USAR_REDIS=true|" .env \
              || echo "USAR_REDIS=true" >> .env
            grep -q '^USAR_KAFKA=' .env \
              && sed -i "s|^USAR_KAFKA=.*|USAR_KAFKA=true|" .env \
              || echo "USAR_KAFKA=true" >> .env
            grep -q '^USAR_RABBITMQ=' .env \
              && sed -i "s|^USAR_RABBITMQ=.*|USAR_RABBITMQ=true|" .env \
              || echo "USAR_RABBITMQ=true" >> .env

            # Garantir OTEL_ENDPOINT aponta para otel-collector (envia para Datadog + New Relic)
            grep -q '^OTEL_ENDPOINT=' .env \
              && sed -i "s|^OTEL_ENDPOINT=.*|OTEL_ENDPOINT=http://comprai-otel-collector:4318|" .env \
              || echo "OTEL_ENDPOINT=http://comprai-otel-collector:4318" >> .env

            mkdir -p wwwroot
            cp docs/price-watcher-test.html wwwroot/


            # ── Garantir Ollama como serviço systemd ──────────────────────────
            if ! systemctl is-enabled ollama > /dev/null 2>&1; then
              echo "Configurando Ollama como serviço systemd..."
              printf '[Unit]\nDescription=Ollama Service\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nExecStart=/usr/local/bin/ollama serve\nRestart=always\nRestartSec=3\nEnvironment=OLLAMA_HOST=0.0.0.0:11434\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/ollama.service
              systemctl daemon-reload
              systemctl enable ollama
              echo "Ollama registrado como serviço"
            fi

            # Garantir que está rodando
            if ! systemctl is-active ollama > /dev/null 2>&1; then
              echo "Iniciando Ollama..."
              systemctl start ollama
              sleep 3
            fi
            echo "Ollama status: $(systemctl is-active ollama)"

            # Login GHCR
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Pull da nova imagem ANTES de derrubar a atual
            docker pull ghcr.io/josehelioaraujo/comprai-api:latest               && echo "✅ Pull OK"               || { echo "❌ Pull falhou — abortando deploy, API continua rodando"; exit 1; }

            # Só derruba depois que o pull garantiu a nova imagem
            docker compose -f deploy/docker-compose.yml --env-file .env --profile datadog --profile kafka --profile rabbitmq down --remove-orphans || true
            docker rm -f comprai-api comprai-redis comprai-mcp comprai-dd-agent comprai-otel-collector comprai-kafka comprai-kafka-ui comprai-rabbitmq 2>/dev/null || true

            # Subir com a imagem já baixada (sem --volumes para preservar dados)
            docker compose -f deploy/docker-compose.yml --env-file .env --profile datadog --profile kafka --profile rabbitmq up -d               && echo "✅ Containers up"               || { echo "❌ Up falhou"; exit 1; }
            # Aguardar API subir — Kafka + RabbitMQ aumentam o tempo de inicialização
            echo "Aguardando API iniciar..."
            for i in $(seq 1 12); do
              sleep 10
              echo "Tentativa $i/12..."
              if curl -sf http://localhost:${{ env.API_PORT }}/health/live > /dev/null 2>&1; then
                echo "✅ API respondendo após $((i*10))s"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "❌ API não respondeu em 120s"
                docker logs comprai-api --tail 50
                exit 1
              fi
            done

  # ── 4b. DEPLOY DASHBOARD ────────────────────────────────────────────────────
  deploy-dashboard:
    name: 📊 Deploy Dashboard K6
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Injetar versao do OpsWatch
        run: |
          COMMITS=$(git rev-list --count HEAD -- k6/dashboard/index.html)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="0.1.${COMMITS} (${SHORT_SHA})"
          echo "OpsWatch version: $VERSION"
          sed -i "s/__OPSWATCH_VERSION__/${VERSION}/" k6/dashboard/index.html

      - name: Copiar dashboard para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "k6/dashboard/index.html"
          target: "/var/www/html/k6/dashboard/"
          strip_components: 2
          overwrite: true

  # ── 5. SMOKE TESTS ──────────────────────────────────────────────────────────
  smoke-tests:
    name: 💨 Smoke Tests Newman
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Smoke Tests
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_SKIP_TOKEN_TEST: 'true'
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          for i in 1 2 3; do
            echo "Tentativa $i/3: executando Smoke Tests..."
            if newman run newman/comprai-smoke.json \
              --env-var "baseUrl=http://${{ env.VPS_HOST }}:${{ env.API_PORT }}" \
              --env-var "mcpUrl=http://${{ env.VPS_HOST }}:${{ env.MCP_PORT }}" \
              --env-var "ML_ACCESS_TOKEN=${ML_ACCESS_TOKEN}" \
              --env-var "SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN}" \
              --reporters cli,htmlextra \
              --reporter-htmlextra-export ./newman-report/smoke-report.html; then
              echo "OK - Smoke Tests passou na tentativa $i"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "Falhou. Aguardando 30s antes de tentar novamente..."
              sleep 30
            fi
          done
          echo "Smoke Tests falharam apos 3 tentativas"
          exit 1

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: ./newman-report/smoke-report.html
          if-no-files-found: ignore







