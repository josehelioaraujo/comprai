name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'observability/**'
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      broker:
        description: 'Broker de mensageria'
        required: true
        default: 'nenhum'
        type: choice
        options:
          - kafka
          - rabbitmq
          - nenhum
      usar_mock:
        description: 'Usar dados mock'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      usar_redis:
        description: 'Usar Redis'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:

  test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore comprai.sln

      - name: Build
        run: dotnet build comprai.sln --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test comprai.sln --no-build --configuration Release --verbosity normal

  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 2.25.122.11
          username: root
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            cd /home/projetos/comprai
            git pull origin main

            BUILD_VERSION="1.0.${{ github.run_number }}"
            BUILD_COMMIT=$(git rev-parse --short HEAD)
            BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            docker compose build \
              --build-arg BUILD_VERSION=$BUILD_VERSION \
              --build-arg BUILD_COMMIT=$BUILD_COMMIT \
              --build-arg BUILD_DATE=$BUILD_DATE

            docker compose up -d
            docker compose --profile monitoring up -d

            BROKER="${{ github.event.inputs.broker }}"
            USAR_MOCK="${{ github.event.inputs.usar_mock }}"
            USAR_REDIS="${{ github.event.inputs.usar_redis }}"

            if [ -z "$BROKER" ]; then
              BROKER="nenhum"
              USAR_MOCK="true"
              USAR_REDIS="false"
              echo "Push normal - defaults aplicados"
            fi

            if [ "$BROKER" = "kafka" ]; then
              sed -i "s/Features__UsarKafka:.*/Features__UsarKafka:     \'true\'/" docker-compose.yml
              sed -i "s/Features__UsarRabbitMQ:.*/Features__UsarRabbitMQ:  \'false\'/" docker-compose.yml
            elif [ "$BROKER" = "rabbitmq" ]; then
              sed -i "s/Features__UsarKafka:.*/Features__UsarKafka:     \'false\'/" docker-compose.yml
              sed -i "s/Features__UsarRabbitMQ:.*/Features__UsarRabbitMQ:  \'true\'/" docker-compose.yml
            else
              sed -i "s/Features__UsarKafka:.*/Features__UsarKafka:     \'false\'/" docker-compose.yml
              sed -i "s/Features__UsarRabbitMQ:.*/Features__UsarRabbitMQ:  \'false\'/" docker-compose.yml
            fi

            sed -i "s/Features__UsarMockDados:.*/Features__UsarMockDados: \'$USAR_MOCK\'/" docker-compose.yml
            sed -i "s/Features__UsarRedis:.*/Features__UsarRedis:     \'$USAR_REDIS\'/" docker-compose.yml

            docker compose restart comprai-api comprai-mcp
            echo "Deploy concluido - versao $BUILD_VERSION commit $BUILD_COMMIT"

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Aguardar VPS estabilizar
        run: |
          echo "Aguardando containers..."
          sleep 20
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://2.25.122.11:5020/health/live || echo "000")
            echo "Tentativa $i - status: $STATUS"
            if [ "$STATUS" = "200" ]; then echo "API pronta!"; break; fi
            sleep 10
          done

      - name: Health check API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://2.25.122.11:5020/health/live)
          echo "API: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Health check MCP
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://2.25.122.11:5030/health)
          echo "MCP: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Smoke test busca (apenas modo real)
        if: github.event.inputs.usar_mock == 'false'
        run: |
          echo "Modo real ativo - testando busca..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://2.25.122.11:5020/api/search?q=notebook&page=1&pageSize=3")
          echo "Search: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Resumo
        run: |
          echo "Smoke tests concluidos!"
          echo "API    : http://2.25.122.11:5020"
          echo "MCP    : http://2.25.122.11:5030"
          echo "Jaeger : http://2.25.122.11:16687"
          echo "Grafana: http://2.25.122.11:3001"

