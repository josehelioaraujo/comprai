name: CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'deploy/**'
      - 'observability/**'
  workflow_dispatch:
    inputs:
      broker:
        description: 'Broker de mensageria'
        required: true
        default: 'kafka'
        type: choice
        options:
          - kafka
          - rabbitmq
          - nenhum
      usar_redis:
        description: 'Usar Redis como cache'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:

  test:
    name: Testes de Unidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore comprai.sln
      - run: dotnet build comprai.sln --no-restore --configuration Release
      - run: dotnet test comprai.sln --no-build --configuration Release --verbosity normal

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: dotnet tool install --global dotnet-sonarscanner
      - run: dotnet restore comprai.sln
      - run: |
          dotnet sonarscanner begin \
            /k:"josehelioaraujo_comprai" \
            /o:"josehelioaraujo" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage/comprai.opencover.xml"
      - run: dotnet build comprai.sln --no-restore --configuration Release
      - run: |
          mkdir -p ${{ github.workspace }}/coverage
          dotnet test tests/UcpAgent.Domain.Tests/UcpAgent.Domain.Tests.csproj \
            --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            "/p:CoverletOutput=${{ github.workspace }}/coverage/comprai.opencover.xml"
      - run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs: [ test, sonar ]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 2.25.122.11
          username: root
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            cd /home/projetos/comprai
            git pull origin main

            BUILD_VERSION="1.0.${{ github.run_number }}"
            BUILD_COMMIT=$(git rev-parse --short HEAD)
            BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            BROKER="${{ github.event.inputs.broker }}"
            USAR_REDIS="${{ github.event.inputs.usar_redis }}"

            if [ -z "$BROKER" ]; then
              BROKER="kafka"; USAR_REDIS="true"
              echo "Push normal — defaults: Kafka + Redis"
            fi

            if [ "$BROKER" = "kafka" ]; then
              sed -i "s/USAR_KAFKA=.*/USAR_KAFKA=true/" .env
              sed -i "s/USAR_RABBITMQ=.*/USAR_RABBITMQ=false/" .env
            elif [ "$BROKER" = "rabbitmq" ]; then
              sed -i "s/USAR_KAFKA=.*/USAR_KAFKA=false/" .env
              sed -i "s/USAR_RABBITMQ=.*/USAR_RABBITMQ=true/" .env
            else
              sed -i "s/USAR_KAFKA=.*/USAR_KAFKA=false/" .env
              sed -i "s/USAR_RABBITMQ=.*/USAR_RABBITMQ=false/" .env
            fi
            sed -i "s/USAR_REDIS=.*/USAR_REDIS=$USAR_REDIS/" .env

            cd deploy
            docker compose --profile monitoring --profile kafka build \
              --build-arg BUILD_VERSION=$BUILD_VERSION \
              --build-arg BUILD_COMMIT=$BUILD_COMMIT \
              --build-arg BUILD_DATE=$BUILD_DATE
            docker compose --profile monitoring --profile kafka up -d
            docker compose restart comprai-api

            echo "Deploy concluido — $BUILD_VERSION $BUILD_COMMIT $BUILD_DATE"

  newman:
    name: Smoke Tests E2E
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Aguardar VPS estabilizar
        run: |
          sleep 30
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://2.25.122.11:5020/health/live || echo "000")
            echo "Tentativa $i — $STATUS"
            [ "$STATUS" = "200" ] && echo "Pronta!" && break
            sleep 10
          done
      - run: npm install -g newman newman-reporter-htmlextra
      - run: |
          newman run docs/postman/comprai.postman_collection.json \
            -e docs/postman/env-vps.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report/index.html \
            --reporter-htmlextra-title "Comprai — Evidências E2E" \
            --reporter-htmlextra-darkTheme \
            --suppress-exit-code
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./newman-report
          publish_branch: gh-pages
          commit_message: "ci: atualiza relatorio de testes E2E"
