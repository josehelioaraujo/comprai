name: NR Debug Query v3
on:
  workflow_dispatch:

jobs:
  test-nr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Test NerdGraph and save result
        env:
          NR_USER_KEY: ${{ secrets.NEW_RELIC_USER_KEY }}
          NR_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, urllib.request, os, base64

          key        = os.environ['NR_USER_KEY']
          account_id = os.environ['NR_ACCOUNT_ID']
          gh_token   = os.environ['GH_TOKEN']
          repo       = os.environ.get('GITHUB_REPOSITORY','')

          def nrql(query):
              payload = json.dumps({
                  "query": "query($nrql: Nrql!) { actor { account(id: " + account_id + ") { nrql(query: $nrql) { results } } } }",
                  "variables": {"nrql": query}
              }).encode()
              req = urllib.request.Request("https://api.newrelic.com/graphql",
                  data=payload,
                  headers={"Content-Type":"application/json","API-Key":key},
                  method="POST")
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          results = {}

          q1 = nrql("SELECT count(*) as calls, average(duration.ms) as avgMs, percentile(duration.ms, 50) as p50, percentile(duration.ms, 90) as p90, percentile(duration.ms, 99) as p99 FROM Span WHERE service.name = 'comprai-api' SINCE 2 hours ago FACET http.route LIMIT 2")
          results['alias_facet'] = q1.get('data',{}).get('actor',{}).get('account',{}).get('nrql',{}).get('results',[])

          q2 = nrql("SELECT count(*) as calls, percentile(duration.ms, 50, 90, 99) FROM Span WHERE service.name = 'comprai-api' SINCE 2 hours ago FACET http.route LIMIT 2")
          results['multival_facet'] = q2.get('data',{}).get('actor',{}).get('account',{}).get('nrql',{}).get('results',[])

          content = json.dumps(results, indent=2)
          print(content)

          # Salvar via GitHub API
          b64 = base64.b64encode(content.encode()).decode()
          api_url = f"https://api.github.com/repos/{repo}/contents/nr-debug-result.json"
          
          # Verificar se arquivo já existe
          req_get = urllib.request.Request(api_url,
              headers={"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(req_get) as r:
                  existing = json.loads(r.read())
                  sha = existing.get('sha','')
          except:
              sha = ''

          payload = {"message": "debug: NR percentile keys result", "content": b64}
          if sha: payload["sha"] = sha
          
          req_put = urllib.request.Request(api_url,
              data=json.dumps(payload).encode(),
              headers={"Authorization": f"Bearer {gh_token}", "Content-Type": "application/json", "Accept": "application/vnd.github+json"},
              method="PUT")
          with urllib.request.urlopen(req_put) as r:
              print("Salvo:", r.status)
          EOF
