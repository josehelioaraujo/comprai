name: 🛡️ Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   # todo domingo 03h UTC

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  VPS_HOST: '2.25.122.11'
  VPS_USER: 'root'

jobs:
  security-scan:
    name: 🔍 Full Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 1. Gitleaks — secrets expostos ─────────────────────────────────────
      - name: Scan — Gitleaks (secrets)
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            zricethezav/gitleaks:latest detect \
              --source /repo \
              --report-format json \
              --report-path /repo/gitleaks-report.json \
              --redact \
              --no-git \
              2>&1 | tail -5 || true
          echo "done=true" >> $GITHUB_OUTPUT

      # ── 2. dotnet --vulnerable — pacotes NuGet ──────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Solution
        run: dotnet restore comprai.sln

      - name: Scan — NuGet vulnerabilities
        id: nuget
        continue-on-error: true
        run: |
          dotnet list comprai.sln package --vulnerable --include-transitive 2>&1 | tee /tmp/nuget-raw.txt || true
          echo "done=true" >> $GITHUB_OUTPUT

      # ── 3. Trivy — imagem Docker ────────────────────────────────────────────
      - name: Scan — Trivy (Docker image)
        id: trivy
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker run --rm \
            -e TRIVY_USERNAME=${{ github.actor }} \
            -e TRIVY_PASSWORD=${{ secrets.GITHUB_TOKEN }} \
            aquasec/trivy:latest image \
              --format json \
              --output /dev/stdout \
              --severity CRITICAL,HIGH,MEDIUM,LOW \
              ghcr.io/josehelioaraujo/comprai-api:latest > trivy-report.json 2>/dev/null || echo '{"Results":[]}' > trivy-report.json
          echo "done=true" >> $GITHUB_OUTPUT

      # ── 4. Consolidar JSON ──────────────────────────────────────────────────
      - name: Consolidar security.json
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
        run: |
          python3 -c "
          import re, json, os
          from datetime import datetime, timezone

          run_number = int(os.environ.get('RUN_NUMBER', 0))
          sha = os.environ.get('RUN_SHA', '')[:7]
          ts = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          # ── Gitleaks ──
          secrets = []
          try:
              raw = open('gitleaks-report.json').read()
              leaks = json.loads(raw) if raw.strip() and raw.strip() != 'null' else []
              if isinstance(leaks, list):
                  for l in leaks:
                      secrets.append({
                          'rule': l.get('RuleID', l.get('ruleId', 'unknown')),
                          'file': l.get('File', l.get('file', '')),
                          'line': l.get('StartLine', l.get('startLine', 0)),
                          'secret': '[REDACTED]'
                      })
          except Exception as e:
              print(f'Gitleaks: {e}')

          # ── NuGet ──
          nuget_packages = []
          try:
              raw = open('/tmp/nuget-raw.txt').read()
              current_project = None
              current_framework = None
              for line in raw.splitlines():
                  pm = re.match(r\"Project [\`'](.+?)[\`'] has the following vulnerable\", line)
                  if pm:
                      proj_raw = pm.group(1)
                      current_project = re.sub(r'^.*[/\\\\]', '', proj_raw).replace('.csproj', '')
                      continue
                  fm = re.match(r'\s+\[(net[\d.]+)\]', line)
                  if fm:
                      current_framework = fm.group(1)
                      continue
                  lm = re.match(r'\s*>\s+(\S+)\s+(?:(\S+)\s+)?(\S+)\s+(Critical|High|Moderate|Low|critical|high|moderate|low)\s+(\S+)', line)
                  if lm:
                      nuget_packages.append({
                          'project': current_project or 'unknown',
                          'framework': current_framework or '',
                          'package': lm.group(1),
                          'resolved': lm.group(3),
                          'severity': lm.group(4).capitalize(),
                          'advisory': lm.group(5)
                      })
          except Exception as e:
              print(f'NuGet: {e}')

          nuget_counts = {'Critical': 0, 'High': 0, 'Moderate': 0, 'Low': 0}
          for p in nuget_packages:
              s = p['severity']
              if s in nuget_counts:
                  nuget_counts[s] += 1

          # ── Trivy ──
          trivy_vulns = []
          trivy_counts = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0}
          try:
              data = json.load(open('trivy-report.json'))
              results = data.get('Results', [])
              for r in results:
                  for v in r.get('Vulnerabilities', []):
                      sev = v.get('Severity', 'UNKNOWN').upper()
                      trivy_vulns.append({
                          'pkg': v.get('PkgName', ''),
                          'version': v.get('InstalledVersion', ''),
                          'fixed': v.get('FixedVersion', ''),
                          'cve': v.get('VulnerabilityID', ''),
                          'severity': sev,
                          'title': v.get('Title', '')[:80]
                      })
                      if sev in trivy_counts:
                          trivy_counts[sev] += 1
          except Exception as e:
              print(f'Trivy: {e}')

          # ── Score ──
          secrets_score   = max(0, 100 - len(secrets) * 25)
          nuget_score     = max(0, 100 - nuget_counts['Critical']*30 - nuget_counts['High']*15 - nuget_counts['Moderate']*5)
          trivy_score     = max(0, 100 - trivy_counts['CRITICAL']*20 - trivy_counts['HIGH']*10 - trivy_counts['MEDIUM']*3)
          overall_score   = round((secrets_score + nuget_score + trivy_score) / 3)

          if overall_score >= 90:
              badge = 'secure'
          elif overall_score >= 70:
              badge = 'warning'
          else:
              badge = 'critical'

          result = {
              'run': run_number,
              'sha': sha,
              'timestamp': ts,
              'badge': badge,
              'overall_score': overall_score,
              'secrets': {
                  'total': len(secrets),
                  'items': secrets
              },
              'nuget': {
                  'total': len(nuget_packages),
                  'counts': nuget_counts,
                  'packages': nuget_packages
              },
              'trivy': {
                  'total': len(trivy_vulns),
                  'counts': trivy_counts,
                  'vulns': trivy_vulns[:50]
              }
          }

          json.dump(result, open('security.json', 'w'), indent=2)
          print(f'✅ security.json — badge={badge} score={overall_score}')
          print(f'   Secrets: {len(secrets)} | NuGet: {len(nuget_packages)} | Trivy: {len(trivy_vulns)}')
          "

      # ── 5. Publicar na VPS ──────────────────────────────────────────────────
      - name: Publicar na VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "mkdir -p /var/www/html/k6/results/security"

          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            security.json \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/var/www/html/k6/results/security/latest.json

          echo "✅ security.json publicado em /var/www/html/k6/results/security/latest.json"

      # ── 6. Append history.json ───────────────────────────────────────────────
      - name: Append history.json
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
        run: |
          python3 -c "
          import json, os
          from datetime import datetime, timezone

          try:
              data = json.load(open('security.json'))
          except:
              data = {}

          entry = {
              'run': int(os.environ.get('RUN_NUMBER', 0)),
              'sha': os.environ.get('RUN_SHA', '')[:7],
              'date': datetime.now(timezone.utc).strftime('%Y-%m-%d'),
              'timestamp': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'source': 'security',
              'security_score': data.get('overall_score', 0),
              'security_badge': data.get('badge', 'unknown'),
              'secrets_total': data.get('secrets', {}).get('total', 0),
              'nuget_total': data.get('nuget', {}).get('total', 0),
              'trivy_total': data.get('trivy', {}).get('total', 0)
          }
          json.dump(entry, open('history-entry-security.json', 'w'))
          print(f'✅ history entry security: run#{entry[\"run\"]} score={entry[\"security_score\"]}')
          "

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            history-entry-security.json root@${{ env.VPS_HOST }}:/tmp/history-entry-security.json

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@${{ env.VPS_HOST }} << 'SSHEOF'
          python3 -c "
          import json
          from pathlib import Path

          HISTORY = Path('/var/www/html/k6/results/history.json')
          ENTRY   = Path('/tmp/history-entry-security.json')

          history = json.loads(HISTORY.read_text()) if HISTORY.exists() else []
          entry   = json.loads(ENTRY.read_text())

          run_entry = next((i for i,e in enumerate(history) if e.get('run') == entry['run']), None)
          if run_entry is not None:
              history[run_entry].update({
                  'security_score': entry['security_score'],
                  'security_badge': entry['security_badge'],
                  'secrets_total': entry['secrets_total'],
                  'nuget_total': entry['nuget_total'],
                  'trivy_total': entry['trivy_total']
              })
          else:
              history.append(entry)

          history = sorted(history, key=lambda x: x.get('run', 0))[-50:]
          HISTORY.parent.mkdir(parents=True, exist_ok=True)
          HISTORY.write_text(json.dumps(history, indent=2))
          print(f'✅ history.json: {len(history)} entradas')
          "
          SSHEOF

      # ── 7. Upload artifact ───────────────────────────────────────────────────
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security.json
          if-no-files-found: ignore
