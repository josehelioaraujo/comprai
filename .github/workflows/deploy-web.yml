name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: comprai-web

jobs:
  build-and-deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://2.25.122.11:5020
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image tar
        run: |
          docker save ${{ env.IMAGE_NAME }}:latest | gzip > ${{ github.workspace }}/comprai-web.tar.gz
          ls -lh ${{ github.workspace }}/comprai-web.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 2.25.122.11
          username: root
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: comprai-web.tar.gz
          target: /tmp/

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.25.122.11
          username: root
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            set -e
            docker load < /tmp/comprai-web.tar.gz
            docker stop comprai-web 2>/dev/null || true
            docker rm   comprai-web 2>/dev/null || true
            docker run -d \
              --name comprai-web \
              --restart unless-stopped \
              --network comprai-network \
              -p 3002:3002 \
              -e NODE_ENV=production \
              ${{ env.IMAGE_NAME }}:latest
            sleep 8
            curl -sf http://localhost:3002/ || exit 1
            echo "✅ comprai-web deployed on :3002"
            rm -f /tmp/comprai-web.tar.gz

      - name: Summary
        run: |
          echo "## 🚀 Deploy Web" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** http://2.25.122.11:3002" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
