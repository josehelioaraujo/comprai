name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/josehelioaraujo/comprai-web
  VPS_HOST: 2.25.122.11
  VPS_USER: root
  WEB_PORT: 3002
  API_URL: http://2.25.122.11:5020

jobs:
  deploy:
    name: 🚀 Build & Deploy Web
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Bump patch version
        id: version
        run: |
          cd apps/web
          OLD=$(node -p "require('./package.json').version")
          NEW=$(node -e "
            const [major,minor,patch] = '$OLD'.split('.').map(Number);
            console.log(major + '.' + minor + '.' + (patch+1));
          ")
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(web): bump version $OLD → $NEW [skip ci]"
          git pull --rebase origin main
          git push
          echo "version=$NEW" >> $GITHUB_OUTPUT
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Versão: $NEW ($SHORT_SHA)"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push imagem para GHCR
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.version }}
            NEXT_PUBLIC_GIT_SHA=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u josehelioaraujo --password-stdin
            docker pull ${{ env.IMAGE }}:latest && echo "✅ Pull OK" || { echo "❌ Pull falhou"; exit 1; }
            docker stop comprai-web 2>/dev/null || true
            docker rm   comprai-web 2>/dev/null || true
            docker run -d \
              --name comprai-web \
              --restart unless-stopped \
              --network comprai-network \
              -p ${{ env.WEB_PORT }}:${{ env.WEB_PORT }} \
              --env NODE_ENV=production \
              --env "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL_WEB }}" \
              --env "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" \
              --env "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
              --env "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              --env "GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}" \
              --env "GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}" \
              --env "MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}" \
              --env "MICROSOFT_CLIENT_SECRET=${{ secrets.MICROSOFT_CLIENT_SECRET }}" \
              --env "MICROSOFT_TENANT_ID=${{ secrets.MICROSOFT_TENANT_ID }}" \
              --env "AUTH_TRUST_HOST=true" \
              ${{ env.IMAGE }}:latest
            sleep 8
            curl -sf http://localhost:${{ env.WEB_PORT }}/ && echo "✅ ${{ steps.version.outputs.version }} OK" || { docker logs comprai-web --tail 20; exit 1; }

      - name: Summary
        run: |
          echo "## 🚀 Deploy Web ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** http://${{ env.VPS_HOST }}:${{ env.WEB_PORT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }})" >> $GITHUB_STEP_SUMMARY
