name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/josehelioaraujo/comprai-web
  VPS_HOST: 2.25.122.11
  VPS_USER: root
  WEB_PORT: 3002
  API_URL: http://2.25.122.11:5020

jobs:
  deploy:
    name: 🚀 Build & Deploy Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push imagem para GHCR
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            set -e

            # login GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u josehelioaraujo --password-stdin

            # pull nova imagem antes de derrubar
            docker pull ${{ env.IMAGE }}:latest && echo "✅ Pull OK" || { echo "❌ Pull falhou"; exit 1; }

            # para e remove container anterior
            docker stop comprai-web 2>/dev/null || true
            docker rm   comprai-web 2>/dev/null || true

            # sobe novo container
            docker run -d \
              --name comprai-web \
              --restart unless-stopped \
              --network comprai-network \
              -p ${{ env.WEB_PORT }}:${{ env.WEB_PORT }} \
              -e NODE_ENV=production \
              ${{ env.IMAGE }}:latest

            # smoke test
            sleep 8
            curl -sf http://localhost:${{ env.WEB_PORT }}/ && echo "✅ comprai-web OK" || { echo "❌ Smoke test falhou"; docker logs comprai-web --tail 30; exit 1; }

      - name: Summary
        run: |
          echo "## 🚀 Deploy Web" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** http://${{ env.VPS_HOST }}:${{ env.WEB_PORT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ env.IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
