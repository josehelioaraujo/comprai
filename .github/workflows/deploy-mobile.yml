name: Deploy Mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE:    ghcr.io/josehelioaraujo/comprai-mobile
  VPS_HOST: 2.25.122.11
  VPS_USER: root
  PORT:     3003
  API_URL:  http://2.25.122.11:5020

jobs:
  deploy:
    name: 📱 Build & Deploy Mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Bump patch version
        id: version
        run: |
          cd apps/mobile
          OLD=$(node -p "require('./package.json').version")
          NEW=$(node -e "
            const [major,minor,patch] = '$OLD'.split('.').map(Number);
            console.log(major + '.' + minor + '.' + (patch+1));
          ")
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(mobile): bump version $OLD → $NEW [skip ci]"
          git pull --rebase origin main
          git push
          echo "version=$NEW"   >> $GITHUB_OUTPUT
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push imagem
        uses: docker/build-push-action@v6
        with:
          context: apps/mobile
          file:    apps/mobile/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.version }}
            NEXT_PUBLIC_GIT_SHA=${{ steps.version.outputs.sha }}
            NEXT_PUBLIC_FULFILLMENT_SIMULATION=true
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key:      ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u josehelioaraujo --password-stdin
            docker pull ${{ env.IMAGE }}:latest && echo "✅ Pull OK" || { echo "❌ Pull falhou"; exit 1; }
            docker stop comprai-mobile 2>/dev/null || true
            docker rm   comprai-mobile 2>/dev/null || true
            docker run -d \
              --name comprai-mobile \
              --restart unless-stopped \
              --network comprai-network \
              -p ${{ env.PORT }}:${{ env.PORT }} \
              -e NODE_ENV=production \
              -e "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL_MOBILE }}" \
              -e "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" \
              -e "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e "GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}" \
              -e "GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}" \
              -e "MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}" \
              -e "MICROSOFT_CLIENT_SECRET=${{ secrets.MICROSOFT_CLIENT_SECRET }}" \
              -e "MICROSOFT_TENANT_ID=${{ secrets.MICROSOFT_TENANT_ID }}" \
              ${{ env.IMAGE }}:latest
            sleep 8
            curl -sf http://localhost:${{ env.PORT }}/ && echo "✅ OK" \
              || { docker logs comprai-mobile --tail 20; exit 1; }

      - name: Summary
        run: |
          echo "## 📱 Deploy Mobile ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** http://${{ env.VPS_HOST }}:${{ env.PORT }}"   >> $GITHUB_STEP_SUMMARY
          echo "- **Container:** comprai-mobile"                          >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ steps.version.outputs.sha }}"             >> $GITHUB_STEP_SUMMARY
