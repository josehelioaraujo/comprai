name: Mutation Tests (Stryker.NET)

on:
  workflow_dispatch:
    inputs:
      break_threshold:
        description: "Score minimo para falhar o workflow (0 = nunca falha)"
        required: false
        default: "0"
  schedule:
    - cron: "0 4 * * 1"

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  mutation:
    name: Stryker.NET
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore tests/UcpAgent.Application.Tests/UcpAgent.Application.Tests.csproj

      - name: Instalar dotnet-stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Executar Stryker.NET
        id: stryker
        continue-on-error: true
        working-directory: tests/UcpAgent.Application.Tests
        run: |
          dotnet stryker \
            --config-file ../../stryker-config.json \
            --project "UcpAgent.Application.csproj" \
            --output ../../StrykerOutput \
            --reporter json \
            --reporter progress \
            --break-at ${{ github.event.inputs.break_threshold || '0' }}

      - name: Parsear resultado
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - << 'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          REPORT = Path("StrykerOutput/reports/mutation-report.json")
          OUT    = Path("mutation-output/latest.json")

          if not REPORT.exists():
              print(f"[ERROR] {REPORT} nao encontrado", file=sys.stderr)
              sys.exit(1)

          report = json.loads(REPORT.read_text(encoding="utf-8"))

          def status(score):
              return "green" if score >= 70 else ("yellow" if score >= 50 else "red")

          files_out = []
          for path, data in report.get("files", {}).items():
              mutants = data.get("mutants", [])
              total    = len(mutants)
              killed   = sum(1 for m in mutants if m.get("status") == "Killed")
              survived = sum(1 for m in mutants if m.get("status") == "Survived")
              timeout  = sum(1 for m in mutants if m.get("status") == "Timeout")
              no_cov   = sum(1 for m in mutants if m.get("status") == "NoCoverage")
              score    = round(killed / total * 100, 1) if total else 0.0
              files_out.append({"file": path, "total": total, "killed": killed,
                                "survived": survived, "timeout": timeout,
                                "no_coverage": no_cov, "score": score, "status": status(score)})

          # Remover arquivos sem mutantes (interfaces, commands, queries, enums)
          files_out = [f for f in files_out if f["total"] > 0]
          files_out.sort(key=lambda x: x["score"])

          # Excluir mutantes ignorados (killed=survived=timeout=no_cov=0) igual ao Stryker
          active   = [f for f in files_out if f["killed"]+f["survived"]+f["timeout"]+f["no_coverage"]>0]
          total    = sum(f["total"]       for f in active)
          killed   = sum(f["killed"]      for f in active)
          survived = sum(f["survived"]    for f in active)
          timeout  = sum(f["timeout"]     for f in active)
          no_cov   = sum(f["no_coverage"] for f in active)
          score    = round(killed / total * 100, 1) if total else 0.0

          out = {
              "run":       os.environ.get("GITHUB_RUN_NUMBER", "0"),
              "sha":       os.environ.get("GITHUB_SHA", "unknown")[:7],
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "score":     score,
              "status":    status(score),
              "thresholds": report.get("system", {}).get("thresholds", {"high": 80, "low": 70}),
              "summary": {"total": total, "killed": killed, "survived": survived,
                          "timeout": timeout, "no_coverage": no_cov},
              "files": files_out
          }

          OUT.parent.mkdir(parents=True, exist_ok=True)
          OUT.write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"[OK] Score: {score}% | Killed: {killed}/{total} | Survived: {survived}")
          PYEOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-run${{ github.run_number }}
          path: |
            StrykerOutput/reports/mutation-report.json
            mutation-output/latest.json
          retention-days: 30

      - name: Gerar index.json para Versionamento
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - << 'PYEOF'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          out = {
              "run": os.environ.get("GITHUB_RUN_NUMBER", "0"),
              "sha": os.environ.get("GITHUB_SHA", "")[:7],
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "test_type": "mutation",
              "vus": "N/A",
              "target_url": "N/A",
              "scenarios": []
          }
          Path("mutation-output").mkdir(parents=True, exist_ok=True)
          Path("mutation-output/index.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(f"[OK] index.json gerado — Run #{out['run']} | SHA: {out['sha']}")
          PYEOF

      - name: Criar pasta na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 2.25.122.11
          username: root
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: mkdir -p /var/www/html/k6/results/mutation

      - name: Copiar latest.json para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 2.25.122.11
          username: root
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "mutation-output/latest.json"
          target: "/var/www/html/k6/results/mutation/"
          strip_components: 1

      - name: Copiar index.json para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 2.25.122.11
          username: root
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "mutation-output/index.json"
          target: "/var/www/html/k6/results/"
          strip_components: 1
          overwrite: true


      - name: Append history.json — Evolução (Mutation)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
        run: |
          python3 << 'PYEOF'
          import json, os
          from datetime import datetime, timezone

          try:
              data = json.load(open('mutation-output/latest.json'))
              score = data.get('score', 0)
              killed = data.get('killed', 0)
              survived = data.get('survived', 0)
              total = data.get('total', 0)
          except Exception as e:
              print(f"⚠ mutation latest.json não disponível: {e}")
              score = killed = survived = total = 0

          entry = {
              "run":       int(os.environ.get("RUN_NUMBER", 0)),
              "sha":       os.environ.get("RUN_SHA", "")[:7],
              "date":      datetime.now(timezone.utc).strftime("%Y-%m-%d"),
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source":    "mutation",
              "mutation":  score,
              "killed":    killed,
              "survived":  survived,
              "total_mutants": total
          }
          json.dump(entry, open('history-entry-mut.json','w'))
          print(f"✅ history entry mutation: run#{entry['run']} score={score}%")
          PYEOF

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 2.25.122.11 >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            history-entry-mut.json root@2.25.122.11:/tmp/history-entry-mutation.json

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@2.25.122.11 << 'SSHEOF'
          python3 << 'PYEOF2'
          import json
          from pathlib import Path

          HISTORY = Path("/var/www/html/k6/results/history.json")
          ENTRY   = Path("/tmp/history-entry-mutation.json")

          history = json.loads(HISTORY.read_text()) if HISTORY.exists() else []
          entry   = json.loads(ENTRY.read_text())

          # Merge na entrada do mesmo run (source=sonar pode já existir)
          existing = next((i for i,e in enumerate(history) if e.get("run") == entry["run"] and e.get("source") == entry["source"]), None)
          if existing is not None:
              history[existing].update(entry)
          else:
              # Tentar mergear num run existente sem mutation
              run_entry = next((i for i,e in enumerate(history) if e.get("run") == entry["run"]), None)
              if run_entry is not None:
                  history[run_entry].update({"mutation": entry["mutation"], "killed": entry["killed"], "survived": entry["survived"], "total_mutants": entry["total_mutants"]})
              else:
                  history.append(entry)

          history = sorted(history, key=lambda x: x.get("run", 0))[-50:]
          HISTORY.parent.mkdir(parents=True, exist_ok=True)
          HISTORY.write_text(json.dumps(history, indent=2))
          print(f"✅ history.json: {len(history)} entradas")
          PYEOF2
          SSHEOF

      - name: Job Summary
        if: always()
        run: |
          LATEST="mutation-output/latest.json"
          if [ ! -f "$LATEST" ]; then
            echo "## Mutation Tests -- Relatorio nao gerado" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          python3 - << 'PYEOF'
          import json, os
          from pathlib import Path

          d     = json.loads(Path("mutation-output/latest.json").read_text())
          badge = {"green": "OK", "yellow": "AVISO", "red": "FALHA"}.get(d["status"], "?")
          run   = os.environ.get("GITHUB_RUN_NUMBER", "?")
          s     = d["summary"]

          lines = [
              f"## Mutation Tests -- Run #{run} -- {badge}",
              "",
              "| Metrica | Valor |",
              "|---------|-------|",
              f"| **Mutation Score** | **{d['score']}%** |",
              f"| Mutantes gerados | {s['total']} |",
              f"| Eliminados (killed) | {s['killed']} |",
              f"| Sobreviventes | {s['survived']} |",
              f"| Timeout | {s['timeout']} |",
              f"| Sem cobertura | {s['no_coverage']} |",
              "",
              f"Artifact: mutation-report-run{run} (30 dias)",
              "Dashboard: https://comprai.2.25.122.11.nip.io/k6",
          ]

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary_file, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print(f"[OK] Summary gerado -- Score {d['score']}%")
          PYEOF
