name: E2E Evidence Recorder

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base do frontend'
        required: false
        default: 'http://2.25.122.11:3002'
      api_url:
        description: 'URL base da API'
        required: false
        default: 'http://2.25.122.11:5020'

env:
  NODE_VERSION: '20'
  VPS_HOST: '2.25.122.11'
  VPS_USER: 'root'
  E2E_BASE_URL: ${{ github.event.inputs.base_url || 'http://2.25.122.11:3002' }}
  E2E_API_URL:  ${{ github.event.inputs.api_url  || 'http://2.25.122.11:5020' }}

jobs:

  # ─────────────────────────────────────────────
  # 1. E2E Tests com Playwright
  # ─────────────────────────────────────────────
  e2e-tests:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/e2e/package.json

      - name: Install dependencias E2E
        working-directory: apps/e2e
        run: npm install

      - name: Install Playwright Chromium
        working-directory: apps/e2e
        run: npx playwright install chromium --with-deps

      - name: Aguardar API estar saudavel
        run: |
          echo "Aguardando $E2E_API_URL/api/health/live..."
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$E2E_API_URL/api/health/live" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "API OK (tentativa $i)"
              break
            fi
            echo "Tentativa $i — status $status, aguardando 10s..."
            sleep 10
          done

      - name: Aguardar Frontend estar saudavel
        run: |
          echo "Aguardando $E2E_BASE_URL..."
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$E2E_BASE_URL" 2>/dev/null || echo "000")
            if [ "$status" = "200" ] || [ "$status" = "307" ] || [ "$status" = "302" ]; then
              echo "Frontend OK (tentativa $i, status $status)"
              break
            fi
            echo "Tentativa $i — status $status, aguardando 10s..."
            sleep 10
          done

      - name: Executar testes E2E
        working-directory: apps/e2e
        env:
          E2E_BASE_URL:      ${{ env.E2E_BASE_URL }}
          E2E_API_URL:       ${{ env.E2E_API_URL }}
          E2E_USER_EMAIL:    ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_USER_NAME:     'E2E Automation'
          CI: 'true'
        run: npx playwright test
        continue-on-error: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/playwright-results.json
            apps/e2e/test-results/
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # 2. Gerar latest.json e publicar na VPS
  # ─────────────────────────────────────────────
  publicar-e2e:
    name: 📊 Publicar E2E Dashboard
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Baixar artifact playwright-results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: e2e-download/
        continue-on-error: true

      - name: Gerar e2e-latest.json
        run: |
          python3 << 'PYEOF'
          import json, os, glob, datetime

          results_file = 'e2e-download/playwright-results.json'
          run_number   = os.environ.get('GITHUB_RUN_NUMBER', '0')
          sha          = os.environ.get('GITHUB_SHA', '')[:7]
          ts           = datetime.datetime.utcnow().isoformat() + 'Z'

          # Estrutura base
          output = {
            'run':       int(run_number),
            'sha':       sha,
            'timestamp': ts,
            'status':    'unknown',
            'summary': {
              'total':    0,
              'passed':   0,
              'failed':   0,
              'skipped':  0,
              'duration': 0,
            },
            'suites': [],
            'report_url': f'https://github.com/josehelioaraujo/comprai/actions/runs/{os.environ.get("GITHUB_RUN_ID","")}'
          }

          if os.path.exists(results_file):
            try:
              with open(results_file, encoding='utf-8') as f:
                data = json.load(f)

              total    = data.get('stats', {}).get('expected', 0)
              passed   = data.get('stats', {}).get('passed',   0)
              failed   = data.get('stats', {}).get('failed',   0) + data.get('stats', {}).get('unexpected', 0)
              skipped  = data.get('stats', {}).get('skipped',  0)
              duration = int(data.get('stats', {}).get('duration', 0) / 1000)

              output['summary'] = {
                'total':    total,
                'passed':   passed,
                'failed':   failed,
                'skipped':  skipped,
                'duration': duration,
              }
              output['status'] = 'passed' if failed == 0 else 'failed'

              # Recursivo: coleta specs de suites aninhadas (describe blocks)
              def collect_specs(suite):
                specs = []
                for spec in suite.get('specs', []):
                  spec_status = 'passed'
                  errors = []
                  for t in spec.get('tests', []):
                    t_st = t.get('status', '')
                    if t_st in ('failed', 'unexpected'):
                      spec_status = 'failed'
                    elif t_st == 'skipped' and spec_status == 'passed':
                      spec_status = 'skipped'
                    for result in t.get('results', []):
                      err = result.get('error')
                      if err and isinstance(err, dict):
                        errors.append({
                          'message': (err.get('message') or '')[:500],
                          'snippet': (err.get('snippet') or '')[:800],
                        })
                  specs.append({
                    'title':    spec.get('title', ''),
                    'status':   spec_status,
                    'duration': int(sum(t.get('duration', 0) for t in spec.get('tests', [])) / 1000),
                    'errors':   errors,
                  })
                for nested in suite.get('suites', []):
                  specs.extend(collect_specs(nested))
                return specs

              # Suites por spec file
              for suite in data.get('suites', []):
                suite_name = suite.get('title', 'unknown')
                specs = collect_specs(suite)
                output['suites'].append({
                  'file':   suite_name,
                  'specs':  specs,
                  'passed': sum(1 for s in specs if s['status'] == 'passed'),
                  'failed': sum(1 for s in specs if s['status'] == 'failed'),
                })
            except Exception as e:
              print(f'Erro ao parsear playwright-results.json: {e}')
              output['status'] = 'error'
          else:
            print('playwright-results.json nao encontrado — API/frontend pode estar down')
            output['status'] = 'no_results'

          os.makedirs('e2e-output', exist_ok=True)
          with open('e2e-output/latest.json', 'w', encoding='utf-8') as f:
            json.dump(output, f, ensure_ascii=False, indent=2)

          print(json.dumps(output, indent=2))
          PYEOF

      - name: Criar diretorio na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: mkdir -p /var/www/html/k6/results/e2e

      - name: Publicar latest.json na VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "e2e-output/latest.json"
          target: "/var/www/html/k6/results/e2e/"
          strip_components: 1
          overwrite: true
