name: E2E Evidence Recorder

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base do frontend'
        required: false
        default: 'http://2.25.122.11:3002'
      api_url:
        description: 'URL base da API'
        required: false
        default: 'http://2.25.122.11:5020'

env:
  NODE_VERSION: '20'
  VPS_HOST: '2.25.122.11'
  VPS_USER: 'root'
  E2E_BASE_URL: ${{ github.event.inputs.base_url || 'http://2.25.122.11:3002' }}
  E2E_API_URL:  ${{ github.event.inputs.api_url  || 'http://2.25.122.11:5020' }}

jobs:

  # ─────────────────────────────────────────────
  # 1. E2E Tests com Playwright
  # ─────────────────────────────────────────────
  e2e-tests:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/e2e/package.json

      - name: Install dependencias E2E
        working-directory: apps/e2e
        run: npm install

      - name: Install Playwright Chromium
        working-directory: apps/e2e
        run: npx playwright install chromium --with-deps

      - name: Aguardar API estar saudavel
        run: |
          echo "Aguardando $E2E_API_URL/api/health/live..."
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$E2E_API_URL/api/health/live" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "API OK (tentativa $i)"
              break
            fi
            echo "Tentativa $i — status $status, aguardando 10s..."
            sleep 10
          done

      - name: Aguardar Frontend estar saudavel
        run: |
          echo "Aguardando $E2E_BASE_URL..."
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$E2E_BASE_URL" 2>/dev/null || echo "000")
            if [ "$status" = "200" ] || [ "$status" = "307" ] || [ "$status" = "302" ]; then
              echo "Frontend OK (tentativa $i, status $status)"
              break
            fi
            echo "Tentativa $i — status $status, aguardando 10s..."
            sleep 10
          done

      - name: Executar testes E2E
        working-directory: apps/e2e
        env:
          E2E_BASE_URL:      ${{ env.E2E_BASE_URL }}
          E2E_API_URL:       ${{ env.E2E_API_URL }}
          E2E_USER_EMAIL:    ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_USER_NAME:     'E2E Automation'
          CI: 'true'
        run: npx playwright test
        continue-on-error: true

      - name: Debug HAR evidence
        if: always()
        run: |
          echo "=== har-evidence dir ==="
          ls -la apps/e2e/har-evidence/ 2>/dev/null || echo "AVISO: apps/e2e/har-evidence/ nao existe"
          echo "=== count .har files ==="
          find apps/e2e/har-evidence -name "*.har" 2>/dev/null | wc -l || echo "0"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/playwright-results.json
            apps/e2e/test-results/
            apps/e2e/har-evidence/
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # 2. Gerar latest.json e publicar na VPS
  # ─────────────────────────────────────────────
  publicar-e2e:
    name: 📊 Publicar E2E Dashboard
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Baixar artifact playwright-results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: e2e-download/
        continue-on-error: true

      - name: Gerar evidencias e2e
        run: |
          python3 << 'PYEOF'
          import json, os, re, shutil, zipfile, datetime, glob
          
          # ── BRT timezone (UTC-3) ──────────────────────────────────────────────────────
          ts      = datetime.datetime.utcnow() - datetime.timedelta(hours=3)
          ts_str  = ts.strftime('%d%m%Y_%H%M%S')
          ts_disp = ts.strftime('%d/%m/%Y %H:%M:%S') + ' BRT'
          
          vps_host = os.environ.get('VPS_HOST', '2.25.122.11')
          run_num  = os.environ.get('GITHUB_RUN_NUMBER', '0')
          run_id   = os.environ.get('GITHUB_RUN_ID', '')
          sha      = os.environ.get('GITHUB_SHA', '')[:7]
          
          report_zip_name = 'Report_' + ts_str + '.zip'
          video_zip_name  = 'video_'  + ts_str + '.zip'
          base_url        = 'http://' + vps_host + '/k6/results/e2e/downloads/'
          
          os.makedirs('e2e-output',   exist_ok=True)
          os.makedirs('e2e-evidence', exist_ok=True)
          
          output = {
            'run': int(run_num), 'sha': sha,
            'timestamp': ts.isoformat(),
            'status': 'unknown',
            'summary': {'total': 0, 'passed': 0, 'failed': 0, 'skipped': 0, 'duration': 0},
            'suites': [],
            'report_url': 'https://github.com/josehelioaraujo/comprai/actions/runs/' + run_id,
            'report_zip': base_url + report_zip_name,
            'videos_zip': base_url + video_zip_name,
          }
          suites_flat = []
          
          # ── HAR parsing: build map test_title -> [{request, response}] ───────────────
          har_map = {}  # normalized_key -> list of requests

          def norm_har_key(s):
            """Normalize any string to lowercase alphanumeric words for fuzzy matching."""
            return re.sub(r'\s+', ' ', re.sub(r'[^a-z0-9]', ' ', s.lower())).strip()

          har_dir = 'e2e-download/har-evidence'
          print('HAR dir exists:', os.path.isdir(har_dir))
          if os.path.isdir(har_dir):
            all_har = glob.glob(har_dir + '/**/*.har', recursive=True) + glob.glob(har_dir + '/*.har')
            print('HAR files found:', len(all_har), all_har[:5])
            for hf in all_har:
              try:
                with open(hf, encoding='utf-8') as f:
                  har = json.load(f)
                entries = har.get('log', {}).get('entries', [])
                # Build normalized key from filename (Playwright replaces special chars with -)
                base = os.path.splitext(os.path.basename(hf))[0]
                # Remove trailing browser/hash suffixes: -chromium, -firefox, -webkit, -[hash]
                base = re.sub(r'-(chromium|firefox|webkit).*$', '', base, flags=re.IGNORECASE)
                base = re.sub(r'-[a-f0-9]{6,}$', '', base)
                key = norm_har_key(base)
                reqs = []
                for entry in entries:
                  req = entry.get('request', {})
                  res = entry.get('response', {})
                  url = req.get('url', '')
                  # skip static assets
                  if re.search(r'\.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|svg|webp|map|ttf|eot)(\?|$)', url, re.IGNORECASE):
                    continue
                  # skip telemetry/analytics
                  if re.search(r'(analytics|gtag|hotjar|sentry|cdn\.|sockjs|webpack)', url, re.IGNORECASE):
                    continue
                  method = req.get('method', '')
                  status = res.get('status', 0)
                  req_body_raw = (req.get('postData', {}) or {}).get('text', '') or ''
                  res_body_raw = ''
                  res_content = res.get('content', {}) or {}
                  if res_content.get('text'):
                    res_body_raw = res_content['text']
                  # include req headers (Authorization, Content-Type)
                  req_headers = {h['name']: h['value'] for h in req.get('headers', []) if h['name'].lower() in ('content-type','authorization','accept')}
                  reqs.append({
                    'url': url, 'method': method, 'status': status,
                    'req_headers': req_headers,
                    'req_body': req_body_raw[:3000],
                    'res_body': res_body_raw[:3000],
                  })
                if reqs:
                  har_map[key] = reqs
                  print('HAR loaded:', key, '(' + str(len(reqs)) + ' reqs)')
              except Exception as ex:
                print('HAR parse error ' + hf + ': ' + str(ex))

          def get_har(title):
            tk = norm_har_key(title)
            # exact match
            if tk in har_map: return har_map[tk]
            # partial match: words overlap
            best, best_score = [], 0
            for k, v in har_map.items():
              # count common words
              tw = set(tk.split())
              kw = set(k.split())
              score = len(tw & kw) / max(len(tw | kw), 1)
              if score > best_score and score > 0.5:
                best_score = score
                best = v
            return best
          
          # ── error categorization ──────────────────────────────────────────────────────
          def categorize_error(msg, snippet=''):
            m = (msg or '').lower()
            s = (snippet or '').lower()
            combined = m + ' ' + s
            if 'timeout' in combined or 'timed out' in combined:
              return {'label': 'Timeout', 'icon': '⏱', 'color': '#f59e0b'}
            if re.search(r'(4\d\d|status 4\d\d|http 4)', combined):
              return {'label': 'Erro Cliente (4xx)', 'icon': '⚠️', 'color': '#f97316'}
            if re.search(r'(5\d\d|status 5\d\d|http 5|internal server)', combined):
              return {'label': 'Erro Servidor (5xx)', 'icon': '💥', 'color': '#ef4444'}
            if re.search(r'(network|econnrefused|enotfound|net::|failed to fetch)', combined):
              return {'label': 'Erro de Rede', 'icon': '📡', 'color': '#a78bfa'}
            if re.search(r'(expect|assert|tobevisible|tohavetext|tocontain|locator)', combined):
              return {'label': 'Asserção', 'icon': '🔴', 'color': '#ef4444'}
            if re.search(r'(ops!|algo deu errado|intent|success.*false|message.*informe|message.*erro)', combined):
              return {'label': 'Erro de Aplicação', 'icon': '🔧', 'color': '#f87171'}
            return {'label': 'Erro Geral', 'icon': '❌', 'color': '#ef4444'}
          
          # ── parse results ─────────────────────────────────────────────────────────────
          results_file = 'e2e-download/playwright-results.json'
          if os.path.exists(results_file):
            try:
              with open(results_file, encoding='utf-8') as f:
                data = json.load(f)
              total    = data.get('stats', {}).get('expected', 0)
              failed   = data.get('stats', {}).get('failed', 0) + data.get('stats', {}).get('unexpected', 0)
              skipped  = data.get('stats', {}).get('skipped', 0)
              passed   = total - failed - skipped
              duration = int(data.get('stats', {}).get('duration', 0) / 1000)
              output['summary'] = {'total': total, 'passed': passed, 'failed': failed, 'skipped': skipped, 'duration': duration}
              output['status']  = 'passed' if failed == 0 else 'failed'
          
              def collect_specs(suite):
                specs = []
                for spec in suite.get('specs', []):
                  st, errors = 'passed', []
                  # duration: sum results[].duration for each test
                  dur_ms = 0
                  for t in spec.get('tests', []):
                    ts2 = t.get('status', '')
                    if ts2 in ('failed', 'unexpected'): st = 'failed'
                    elif ts2 == 'skipped' and st == 'passed': st = 'skipped'
                    for r in t.get('results', []):
                      dur_ms += r.get('duration', 0)
                      err = r.get('error')
                      if err and isinstance(err, dict):
                        msg  = (err.get('message') or '')[:500]
                        snip = (err.get('snippet') or '')[:800]
                        cat  = categorize_error(msg, snip)
                        errors.append({'message': msg, 'snippet': snip,
                          'category': cat['label'], 'icon': cat['icon'], 'color': cat['color']})
                  # try to detect app errors from steps too
                  if not errors:
                    for t in spec.get('tests', []):
                      for r in t.get('results', []):
                        for step in r.get('steps', []):
                          stitle = step.get('title', '')
                          if re.search(r'(ops!|algo deu errado|success.*false)', stitle, re.IGNORECASE):
                            cat = categorize_error(stitle)
                            errors.append({'message': stitle[:500], 'snippet': '', 'category': cat['label'], 'icon': cat['icon'], 'color': cat['color']})
                            if st == 'passed': st = 'failed'
                  har_entries = get_har(spec.get('title', ''))
                  cat_label = errors[0]['category'] if errors else ''
                  specs.append({
                    'title': spec.get('title', ''), 'status': st,
                    'duration': round(dur_ms / 1000, 1),
                    'errors': errors,
                    'error_category': cat_label,
                    'requests': har_entries[:30],
                  })
                for nested in suite.get('suites', []):
                  specs.extend(collect_specs(nested))
                return specs
          
              for suite in data.get('suites', []):
                specs = collect_specs(suite)
                sd = {'file': suite.get('title', 'unknown'), 'specs': specs,
                  'passed': sum(1 for s in specs if s['status'] == 'passed'),
                  'failed': sum(1 for s in specs if s['status'] == 'failed')}
                output['suites'].append(sd)
                suites_flat.append(sd)
            except Exception as e:
              print('Erro: ' + str(e)); output['status'] = 'error'
          else:
            print('playwright-results.json nao encontrado'); output['status'] = 'no_results'
          
          with open('e2e-output/latest.json', 'w', encoding='utf-8') as f:
            json.dump(output, f, ensure_ascii=False, indent=2)
          print('latest.json gerado')
          
          # ── helpers ───────────────────────────────────────────────────────────────────
          def esc(s):
            return str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;')
          
          def jesc(s):
            return str(s).replace('\\','\\\\').replace("'","\\'").replace('\n','\\n').replace('\r','')
          
          sm = output['summary']
          pass_rate = round(sm['passed'] / sm['total'] * 100) if sm['total'] > 0 else 0
          st_color  = '#22c55e' if output['status'] == 'passed' else '#ef4444'
          st_label  = 'PASSOU' if output['status'] == 'passed' else 'FALHOU' if output['status'] == 'failed' else output['status'].upper()
          fail_col  = '#ef4444' if sm['failed'] > 0 else '#22c55e'
          rate_col  = '#22c55e' if pass_rate == 100 else '#f59e0b' if pass_rate >= 80 else '#ef4444'
          
          # ── report.html ───────────────────────────────────────────────────────────────
          all_specs = [(s['file'], sp) for s in suites_flat for sp in s['specs']]
          
          # Group by file for section headers with chevron
          sections_by_file = {}
          for sfile, sp in all_specs:
            sections_by_file.setdefault(sfile, []).append(sp)
          
          # build per-spec data for JS download
          specs_json_list = []
          for sfile, sp in all_specs:
            specs_json_list.append({
              'file': sfile, 'title': sp['title'], 'status': sp['status'],
              'duration': sp.get('duration', 0), 'errors': sp.get('errors', []),
              'error_category': sp.get('error_category', ''), 'requests': sp.get('requests', [])
            })
          
          rows = ''
          global_i = 0
          for sfile, specs_in_file in sections_by_file.items():
            file_sid = 'fs' + str(hash(sfile) & 0x7FFFFFFF)
            # count per-file status
            f_pass = sum(1 for s in specs_in_file if s['status'] == 'passed')
            f_fail = sum(1 for s in specs_in_file if s['status'] == 'failed')
            f_skip = sum(1 for s in specs_in_file if s['status'] == 'skipped')
            fhdr_col = '#ef4444' if f_fail > 0 else '#22c55e'
            rows += '<tr class="fhdr" onclick="tgf(\'' + file_sid + '\',this)" style="cursor:pointer;background:#1e293b;user-select:none">'
            rows += '<td colspan="6" style="padding:8px 12px;font-size:12px;font-weight:700;color:#94a3b8">'
            rows += '<span class="fchev" style="display:inline-block;transition:transform .15s;transform:rotate(90deg);margin-right:6px;color:#475569">&#8250;</span>'
            rows += esc(sfile)
            rows += ' <span style="font-weight:400;font-size:11px;color:#475569">('
            rows += '<span style="color:#22c55e">' + str(f_pass) + ' ok</span>'
            if f_fail: rows += ' · <span style="color:#ef4444">' + str(f_fail) + ' fail</span>'
            if f_skip: rows += ' · <span style="color:#f59e0b">' + str(f_skip) + ' skip</span>'
            rows += ')</span></td></tr>'
          
            for sp in specs_in_file:
              i = global_i
              global_i += 1
              c   = '#22c55e' if sp['status'] == 'passed' else '#ef4444' if sp['status'] == 'failed' else '#f59e0b'
              lbl = 'PASSOU' if sp['status'] == 'passed' else 'FALHOU' if sp['status'] == 'failed' else 'IGNORADO'
              cat_badge = ''
              if sp.get('error_category'):
                err0 = sp['errors'][0] if sp['errors'] else {}
                cat_color = err0.get('color', '#ef4444')
                cat_icon  = err0.get('icon', '❌')
                cat_badge = '<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:' + cat_color + '22;color:' + cat_color + ';margin-left:6px">' + esc(cat_icon + ' ' + sp['error_category']) + '</span>'
          
              det = ''
              if sp.get('errors'):
                for err in sp['errors']:
                  det += '<div style="margin-top:6px;padding:8px;background:#020617;border-radius:4px">'
                  det += '<div style="font-size:10px;font-weight:700;color:' + esc(err.get('color','#ef4444')) + ';margin-bottom:4px">' + esc(err.get('icon','') + ' ' + err.get('category','ERRO')) + '</div>'
                  if err.get('message'):
                    det += '<div style="font-family:monospace;font-size:11px;color:#fca5a5;white-space:pre-wrap;word-break:break-all">' + esc(err['message']) + '</div>'
                  if err.get('snippet'):
                    det += '<div style="margin-top:4px;font-family:monospace;font-size:11px;color:#64748b;white-space:pre-wrap;word-break:break-all">' + esc(err['snippet']) + '</div>'
                  det += '</div>'
              else:
                det = '<div style="color:#22c55e;font-size:12px">&#9989; Nenhum erro registrado.</div>'
          
              # Request/response section
              har_entries = sp.get('requests', [])
              if har_entries:
                det += '<div style="margin-top:10px;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">&#127760; Requisições HTTP</div>'
                for ei, entry in enumerate(har_entries[:15]):
                  sc = '#ef4444' if str(entry.get('status',0)).startswith('4') or str(entry.get('status',0)).startswith('5') else '#22c55e'
                  det += '<details style="margin-bottom:4px;background:#020617;border-radius:4px;border:1px solid #1e293b">'
                  url_full = entry.get('url','')
                  url_path = re.sub(r'^https?://[^/]+','', url_full)
                  det += '<summary style="cursor:pointer;padding:5px 8px;font-size:11px;color:#94a3b8;list-style:none;display:flex;align-items:center;gap:8px">'
                  det += '<span style="font-weight:700;font-family:monospace;min-width:36px;color:' + sc + '">' + str(entry.get('status','?')) + '</span>'
                  det += '<span style="color:#60a5fa;font-weight:700;min-width:44px">' + esc(entry.get('method','')) + '</span>'
                  det += '<span style="word-break:break-all;flex:1">' + esc(url_path[:120] or url_full[:120]) + '</span></summary>'
                  if entry.get('req_headers'):
                    det += '<div style="padding:6px 10px;border-top:1px solid #1e293b">'
                    det += '<div style="font-size:10px;color:#475569;margin-bottom:2px">REQUEST HEADERS</div>'
                    det += '<pre style="font-size:10px;color:#a5b4fc;white-space:pre-wrap;word-break:break-all;margin:0;max-height:80px;overflow:auto">' + esc(json.dumps(entry['req_headers'], indent=2, ensure_ascii=False)) + '</pre>'
                    det += '</div>'
                  if entry.get('req_body'):
                    det += '<div style="padding:6px 10px;border-top:1px solid #1e293b">'
                    det += '<div style="font-size:10px;color:#475569;margin-bottom:2px">REQUEST BODY</div>'
                    det += '<pre style="font-size:10px;color:#7dd3fc;white-space:pre-wrap;word-break:break-all;margin:0;max-height:150px;overflow:auto">' + esc(entry['req_body'][:1500]) + '</pre>'
                    det += '</div>'
                  if entry.get('res_body'):
                    det += '<div style="padding:6px 10px;border-top:1px solid #1e293b">'
                    det += '<div style="font-size:10px;color:#475569;margin-bottom:2px">RESPONSE BODY</div>'
                    det += '<pre style="font-size:10px;color:#a5f3fc;white-space:pre-wrap;word-break:break-all;margin:0;max-height:150px;overflow:auto">' + esc(entry['res_body'][:1500]) + '</pre>'
                    det += '</div>'
                  det += '</details>'
              else:
                det += '<div style="margin-top:8px;color:#475569;font-size:11px">&#128295; Nenhuma requisição HTTP capturada (HAR não disponível para este teste).</div>'
          
              # Download button data
              dl_data = json.dumps(specs_json_list[i], ensure_ascii=False)
          
              rows += '<tr class="sr frow-' + file_sid + '" onclick="tg(' + str(i) + ')" style="cursor:pointer">'
              rows += '<td style="color:#475569;font-size:11px;text-align:center">' + str(i+1).zfill(3) + '</td>'
              rows += '<td><span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;background:' + c + '22;color:' + c + '">' + lbl + '</span>' + cat_badge + '</td>'
              rows += '<td style="color:#e2e8f0">' + esc(sp['title']) + '</td>'
              rows += '<td style="color:#64748b;font-size:11px;text-align:right;font-family:monospace">' + str(sp.get('duration',0)) + 's</td>'
              rows += '<td style="color:#334155;font-size:14px;text-align:center">&#8250;</td></tr>'
              rows += '<tr id="d' + str(i) + '" class="frow-' + file_sid + '" style="display:none;background:#020617">'
              rows += '<td colspan="5" style="padding:12px 24px">' + det
              rows += '<div style="margin-top:10px"><button onclick="dlSpec(' + str(i) + ',event)" style="padding:5px 14px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#94a3b8;font-size:11px;cursor:pointer">&#11123; Baixar Detalhes</button></div>'
              rows += '</td></tr>'
          
          specs_js = json.dumps(specs_json_list, ensure_ascii=False)
          
          rh  = '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
          rh += '<title>E2E Report ' + ts_str + '</title>'
          rh += '<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:28px 24px}'
          rh += 'h1{font-size:18px;font-weight:700;margin-bottom:4px}.sub{font-size:12px;color:#64748b;margin-bottom:24px}'
          rh += '.sum{display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap}'
          rh += '.kpi{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:12px 18px;text-align:center;min-width:90px;cursor:pointer;transition:border-color .15s}'
          rh += '.kpi:hover{border-color:#3b82f6}.kpi.active{border-color:#3b82f6;box-shadow:0 0 0 2px #3b82f622}'
          rh += '.kv{font-size:22px;font-weight:700}.kl{font-size:11px;color:#64748b;margin-top:2px}'
          rh += 'table{width:100%;border-collapse:collapse}thead tr{background:#1e293b}'
          rh += 'th{padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#475569;text-align:left;border-bottom:1px solid #334155}'
          rh += 'tr.sr:hover{background:#1e293b}td{padding:9px 12px;border-bottom:1px solid #1e293b;font-size:13px;vertical-align:middle}'
          rh += 'tr.fhdr:hover{background:#243246!important}tr.sr.hidden{display:none!important}'
          rh += 'details > summary::-webkit-details-marker{display:none}'
          rh += '</style></head><body>'
          rh += '<h1>&#127916; E2E / Evidencias &#8212; Playwright</h1>'
          rh += '<div class="sub">Run #' + run_num + ' &middot; SHA ' + sha + ' &middot; ' + ts_disp + ' &middot; <span style="color:' + st_color + ';font-weight:700">' + st_label + '</span></div>'
          rh += '<div class="sum" id="kpis">'
          rh += '<div class="kpi" onclick="setFilter(\'all\')"><div class="kv" style="color:#94a3b8">' + str(sm['total']) + '</div><div class="kl">Total</div></div>'
          rh += '<div class="kpi" onclick="setFilter(\'passed\')"><div class="kv" style="color:#22c55e">' + str(sm['passed']) + '</div><div class="kl">Passou</div></div>'
          rh += '<div class="kpi" onclick="setFilter(\'failed\')"><div class="kv" style="color:' + fail_col + '">' + str(sm['failed']) + '</div><div class="kl">Falhou</div></div>'
          rh += '<div class="kpi" onclick="setFilter(\'skipped\')"><div class="kv" style="color:#f59e0b">' + str(sm['skipped']) + '</div><div class="kl">Ignorado</div></div>'
          rh += '<div class="kpi" style="cursor:default"><div class="kv" style="color:#38bdf8">' + str(sm['duration']) + 's</div><div class="kl">Dura&ccedil;&atilde;o</div></div>'
          rh += '<div class="kpi" style="cursor:default"><div class="kv" style="color:' + rate_col + '">' + str(pass_rate) + '%</div><div class="kl">Taxa OK</div></div>'
          rh += '</div>'
          rh += '<div style="margin:10px 0 16px;display:flex;gap:8px;flex-wrap:wrap">'
          rh += '<button onclick="dlTodos()" style="display:inline-flex;align-items:center;gap:6px;padding:7px 18px;background:#1e293b;border:1px solid #334155;border-radius:7px;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor=\'#22c55e\';this.style.color=\'#4ade80\'" onmouseout="this.style.borderColor=\'#334155\';this.style.color=\'#94a3b8\'">&#11123; Baixar Todos os Testes</button>'
          rh += '</div>'
          rh += '<table><thead><tr><th>#</th><th>Status</th><th>Teste</th><th>Dura&ccedil;&atilde;o</th><th></th></tr></thead><tbody id="tbody">' + rows + '</tbody></table>'
          rh += '<script>'
          rh += 'var SPECS=' + specs_js + ';'
          rh += 'var curFilter="all";'
          rh += 'function tg(i){'
          rh += '  var d=document.getElementById("d"+i);'
          rh += '  if(d){var open=d.style.display!=="none";d.style.display=open?"none":"table-row";}'
          rh += '  var rows=document.querySelectorAll("tr.sr");'
          rh += '  var chev=rows[i]?rows[i].querySelectorAll("td")[4]:null;'
          rh += '  if(chev)chev.innerHTML=d&&d.style.display!=="none"?"&#8744;":"&#8250;";'
          rh += '}'
          rh += 'function tgf(sid,hdr){'
          rh += '  var rows=document.querySelectorAll(".frow-"+sid);'
          rh += '  var chev=hdr?hdr.querySelector(".fchev"):null;'
          rh += '  var anyVisible=false;'
          rh += '  rows.forEach(function(r){if(r.style.display!=="none")anyVisible=true;});'
          rh += '  rows.forEach(function(r){r.style.display=anyVisible?"none":"";});'
          rh += '  if(chev)chev.style.transform=anyVisible?"rotate(0deg)":"rotate(90deg)";'
          rh += '}'
          rh += 'function setFilter(f){'
          rh += '  curFilter=f;'
          rh += '  document.querySelectorAll(".kpi").forEach(function(k,i){k.classList.remove("active");});'
          rh += '  var kpis=document.querySelectorAll(".kpi");'
          rh += '  var idx=["all","passed","failed","skipped"].indexOf(f);'
          rh += '  if(idx>=0&&kpis[idx])kpis[idx].classList.add("active");'
          rh += '  var rows=document.querySelectorAll("tr.sr");'
          rh += '  rows.forEach(function(r,i){'
          rh += '    var match=f==="all"||SPECS[i]&&SPECS[i].status===f;'
          rh += '    r.classList.toggle("hidden",!match);'
          rh += '    var det=document.getElementById("d"+i);'
          rh += '    if(det&&!match)det.style.display="none";'
          rh += '  });'
          rh += '}'
          rh += 'function dlSpec(i,ev){'
          rh += '  ev.stopPropagation();'
          rh += '  var s=SPECS[i];if(!s)return;'
          rh += '  var blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});'
          rh += '  var a=document.createElement("a");'
          rh += '  a.href=URL.createObjectURL(blob);'
          rh += '  a.download="teste_"+(i+1).toString().padStart(3,"0")+"_"+(s.title||"").replace(/[^a-z0-9]/gi,"_").slice(0,40)+".json";'
          rh += '  a.click();'
          rh += '}'
          rh += 'function dlTodos(){'
          rh += '  var payload={run:' + run_num + ',timestamp:"' + ts.isoformat() + '",summary:' + json.dumps(sm) + ',specs:SPECS};'
          rh += '  var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});'
          rh += '  var a=document.createElement("a");'
          rh += '  a.href=URL.createObjectURL(blob);'
          rh += '  a.download="e2e_todos_run' + run_num + '.json";'
          rh += '  a.click();'
          rh += '}'
          rh += '</script></body></html>'
          
          with open('e2e-evidence/report.html', 'w', encoding='utf-8') as f:
            f.write(rh)
          with zipfile.ZipFile('e2e-evidence/' + report_zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
            zf.write('e2e-evidence/report.html', 'report.html')
          print('Created ' + report_zip_name)
          
          # ── video player ──────────────────────────────────────────────────────────────
          def clean_name(folder):
            n = re.sub(r'-chromium.*$', '', folder, flags=re.IGNORECASE)
            n = re.sub(r'-[a-f0-9]{5,}$', '', n)
            return n.replace('-', ' ').strip()
          
          videos = []
          tr_dir = 'e2e-download/test-results'
          if os.path.isdir(tr_dir):
            for folder in sorted(os.listdir(tr_dir)):
              webm = os.path.join(tr_dir, folder, 'video.webm')
              if os.path.exists(webm):
                videos.append({'name': clean_name(folder), 'orig': webm})
          
          if videos:
            pdir = 'e2e-evidence/video_player'
            vdir = pdir + '/videos'
            os.makedirs(vdir, exist_ok=True)
            vids_js = []
            for i, v in enumerate(videos):
              fname = str(i+1).zfill(3) + '.webm'
              shutil.copy2(v['orig'], vdir + '/' + fname)
              vids_js.append({'src': 'videos/' + fname, 'name': v['name']})
          
            pl_items = '\n'.join(
              '<div class="pi" onclick="play(' + str(i) + ')" id="pi' + str(i) + '"><span class="idx">' + str(i+1).zfill(3) + '</span> ' + esc(v['name']) + '</div>'
              for i, v in enumerate(vids_js))
            n_vids    = len(vids_js)
            vids_jstr = json.dumps(vids_js, ensure_ascii=False)
          
            vh  = '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>E2E Videos ' + ts_str + '</title>'
            vh += '<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,sans-serif;display:flex;height:100vh;overflow:hidden}'
            vh += '#player{flex:1;display:flex;flex-direction:column;padding:14px;gap:8px;overflow:hidden;min-width:0}'
            vh += '#lbl{font-size:13px;color:#94a3b8;padding:6px 0;border-bottom:1px solid #1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}'
            vh += '#lbl b{color:#f1f5f9}#lbl em{color:#475569;font-style:normal;font-size:11px;margin-left:10px}'
            vh += '#vid{width:100%;border-radius:8px;background:#000;flex:1;object-fit:contain;min-height:0}'
            vh += '#playlist{width:270px;background:#1e293b;overflow-y:auto;border-left:1px solid #334155;flex-shrink:0}'
            vh += '.ph{padding:11px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#475569;border-bottom:1px solid #0f172a;position:sticky;top:0;background:#1e293b}'
            vh += '.pi{padding:9px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;color:#94a3b8;transition:background .12s;line-height:1.45}'
            vh += '.pi:hover{background:#334155;color:#e2e8f0}.pi.active{background:#1d4ed8;color:#fff}'
            vh += '.idx{font-size:10px;opacity:.45;margin-right:5px}'
            vh += '</style></head><body>'
            vh += '<div id="player"><div id="lbl">&#9654; <b id="ln">...</b><em id="prog"></em></div>'
            vh += '<video id="vid" controls></video></div>'
            vh += '<div id="playlist"><div class="ph">&#9654; ' + str(n_vids) + ' testes</div>' + pl_items + '</div>'
            vh += '<script>var V=' + vids_jstr + ',idx=0,vid=document.getElementById("vid");'
            vh += 'function play(i){if(i<0||i>=V.length)return;idx=i;vid.src=V[i].src;vid.play().catch(function(){});'
            vh += 'document.getElementById("ln").textContent=V[i].name;'
            vh += 'document.getElementById("prog").textContent=(i+1)+" / "+V.length;'
            vh += 'document.querySelectorAll(".pi").forEach(function(e,j){e.classList.toggle("active",j===i);});'
            vh += 'var a=document.getElementById("pi"+i);if(a)a.scrollIntoView({block:"nearest"});}'
            vh += 'vid.onended=function(){play(idx+1);};play(0);</script></body></html>'
          
            with open(pdir + '/index.html', 'w', encoding='utf-8') as f:
              f.write(vh)
            with zipfile.ZipFile('e2e-evidence/' + video_zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(pdir):
                for file in files:
                  fp = os.path.join(root, file)
                  zf.write(fp, os.path.relpath(fp, pdir))
            print('Created ' + video_zip_name + ' with ' + str(n_vids) + ' videos')
          else:
            print('No videos found')
          PYEOF

      - name: Criar diretorio na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: mkdir -p /var/www/html/k6/results/e2e /var/www/html/k6/results/e2e/downloads

      - name: Publicar evidencias na VPS
        uses: appleboy/scp-action@v0.1.7
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "e2e-evidence/"
          target: "/var/www/html/k6/results/e2e/downloads/"
          strip_components: 1
          overwrite: true
        continue-on-error: true

      - name: Publicar latest.json na VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "e2e-output/latest.json"
          target: "/var/www/html/k6/results/e2e/"
          strip_components: 1
          overwrite: true
