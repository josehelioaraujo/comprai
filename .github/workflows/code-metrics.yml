name: Code Metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**/*.csproj'
      - 'src/**/*.cs'

env:
  VPS_HOST: '2.25.122.11'
  VPS_USER: 'root'

jobs:
  metrics:
    name: Calcular metricas de codigo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Calcular complexidade e acoplamento
        run: |
          mkdir -p k6/results/metrics
          python3 << 'PYEOF'
          import os, re, json
          from collections import defaultdict, Counter
          import datetime

          BRANCH_KW = re.compile(
              r'\b(if|else\s+if|for|foreach|while|do|switch|case|catch|&&|\|\||when)\b'
          )
          METHOD_RE = re.compile(
              r'(?:public|private|protected|internal|static|async|virtual|override|abstract)'
              r'[\w\s<>,\[\]?]*\s+(\w+)\s*\([^)]*\)\s*(?:where[^{]*)?\{',
              re.MULTILINE
          )

          PROJECTS = {
              "SharedKernel": "src/UcpAgent.SharedKernel",
              "Domain":       "src/UcpAgent.Domain",
              "Application":  "src/UcpAgent.Application",
              "Infrastructure":"src/UcpAgent.Infrastructure",
              "Api":          "src/UcpAgent.Api",
          }

          complexity = {"projects":{}, "generated_at": datetime.datetime.utcnow().isoformat()+"Z"}

          for proj_name, proj_path in PROJECTS.items():
              if not os.path.exists(proj_path):
                  continue
              methods = []
              for root, dirs, files in os.walk(proj_path):
                  dirs[:] = [d for d in dirs if 'test' not in d.lower() and 'obj' not in d.lower()]
                  for f in files:
                      if not f.endswith('.cs'): continue
                      try:
                          src = open(os.path.join(root,f), encoding='utf-8', errors='ignore').read()
                      except: continue
                      src = re.sub(r'//.*$', '', src, flags=re.MULTILINE)
                      src = re.sub(r'/\*.*?\*/', '', src, flags=re.DOTALL)
                      for m in METHOD_RE.finditer(src):
                          mname = m.group(1)
                          if mname in ('if','for','foreach','while','switch','catch','class','namespace'):
                              continue
                          body_start = m.end()
                          depth=1; pos=body_start; body=[]
                          while pos < len(src) and depth > 0 and pos < body_start+3000:
                              c=src[pos]
                              if c=='{': depth+=1
                              elif c=='}': depth-=1
                              if depth>0: body.append(c)
                              pos+=1
                          body_str = ''.join(body)
                          branch_types = BRANCH_KW.findall(body_str)
                          cc = 1 + len(branch_types)
                          if cc < 2: continue
                          class_match = re.search(r'class\s+(\w+)', src[:m.start()])
                          class_name = class_match.group(1) if class_match else f.replace('.cs','')
                          branch_counts = dict(Counter(branch_types))
                          methods.append({
                              "name": f"{class_name}.{mname}()"[:80],
                              "complexity": cc,
                              "maintainability": max(0, 100-cc*5),
                              "branches": branch_types[:20],
                              "branch_counts": branch_counts,
                              "snippet": (lambda sig, body: (
                                  lambda lines, br_re, counter=[0]: (
                                      sig + '\n{\n' + '\n'.join(
                                          line + ('  // (' + str(counter.__setitem__(0, counter[0]+1) or counter[0]) + ')'
                                                  if br_re.search(line) else '')
                                          for line in lines
                                      ) + '\n}'
                                  )
                              )(
                                  body.split('\n'),
                                  re.compile(r'\b(if|else\s+if|for|foreach|while|do|switch|case|catch|\&\&|\|\|)\b')
                              )
                          )(
                              src[max(0, src.rfind('\n', 0, m.start())):m.end()-1].strip(),
                              body_str
                          )[:3000]
                          })
              methods.sort(key=lambda x: x["complexity"], reverse=True)
              avg = round(sum(m["complexity"] for m in methods)/len(methods),1) if methods else 0
              full_name = f"UcpAgent.{proj_name}"
              complexity["projects"][full_name] = {
                  "avg_complexity": avg,
                  "max_complexity": methods[0]["complexity"] if methods else 0,
                  "hotspots": methods[:8]
              }
              print(f"{proj_name}: avg={avg} max={methods[0]['complexity'] if methods else 0} metodos={len(methods)}")

          # Acoplamento Ca/Ce
          projects_refs = {}
          for root, dirs, files in os.walk("src"):
              for f in files:
                  if not f.endswith(".csproj"): continue
                  txt = open(os.path.join(root,f), encoding='utf-8', errors='ignore').read()
                  deps = [os.path.basename(m.group(1)).replace(".csproj","")
                          for m in re.finditer(r'<ProjectReference Include="([^"]+)"', txt)]
                  projects_refs[f.replace(".csproj","")] = deps

          ca = defaultdict(int)
          for proj, deps in projects_refs.items():
              for dep in deps: ca[dep] += 1

          coupling_data = {}
          for proj, deps in projects_refs.items():
              ce_v=len(deps); ca_v=ca.get(proj,0); total=ca_v+ce_v
              coupling_data[proj] = {"ca":ca_v,"ce":ce_v,
                  "instability":round(ce_v/total,3) if total>0 else 0.0,"deps":deps}
              print(f"{proj}: Ca={ca_v} Ce={ce_v}")

          json.dump(complexity, open("k6/results/metrics/complexity.json","w"), indent=2)
          json.dump({"projects":coupling_data,"generated_at":datetime.datetime.utcnow().isoformat()+"Z"},
              open("k6/results/metrics/coupling.json","w"), indent=2)
          print("JSONs gerados com sucesso")
          PYEOF

      - name: Criar diretorio na VPS
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "mkdir -p /var/www/html/k6/results/metrics"

      - name: Publicar complexity.json
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            k6/results/metrics/complexity.json \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/var/www/html/k6/results/metrics/complexity.json

      - name: Publicar coupling.json
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            k6/results/metrics/coupling.json \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/var/www/html/k6/results/metrics/coupling.json

      - name: Verificar arquivos na VPS
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "ls -lh /var/www/html/k6/results/metrics/ && echo OK"
