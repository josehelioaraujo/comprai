name: Code Metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**/*.csproj'
      - 'src/**/*.cs'

env:
  VPS_HOST: '2.25.122.11'
  VPS_USER: 'root'

jobs:
  metrics:
    name: Calcular metricas de codigo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restaurar dependencias
        run: dotnet restore comprai.sln

      - name: Calcular complexidade ciclomatica
        run: |
          mkdir -p /tmp/metrics
          PROJECTS=(
            "src/UcpAgent.SharedKernel/UcpAgent.SharedKernel.csproj"
            "src/UcpAgent.Domain/UcpAgent.Domain.csproj"
            "src/UcpAgent.Application/UcpAgent.Application.csproj"
            "src/UcpAgent.Infrastructure/UcpAgent.Infrastructure.csproj"
            "src/UcpAgent.Api/UcpAgent.Api.csproj"
          )
          for proj in "${PROJECTS[@]}"; do
            name=$(basename "$proj" .csproj)
            echo "Calculando: $name"
            dotnet msbuild "$proj" /t:Metrics \
              /p:MetricsOutputFile=/tmp/metrics/${name}.xml \
              /nologo /verbosity:quiet 2>/dev/null || echo "Sem metricas: $name"
          done

      - name: Gerar JSONs de complexidade e acoplamento
        run: |
          mkdir -p k6/results/metrics
          python3 << 'PYEOF'
          import os, re, json, xml.etree.ElementTree as ET
          from collections import defaultdict
          import datetime

          PROJECTS = ["UcpAgent.SharedKernel","UcpAgent.Domain","UcpAgent.Application",
                      "UcpAgent.Infrastructure","UcpAgent.Api"]

          complexity = {"projects":{}, "generated_at": datetime.datetime.utcnow().isoformat()+"Z"}
          for proj in PROJECTS:
              xml_path = f"/tmp/metrics/{proj}.xml"
              if not os.path.exists(xml_path):
                  continue
              methods = []
              for m in ET.parse(xml_path).getroot().iter("Method"):
                  cc = m.find("CyclomaticComplexity")
                  nm = m.find("Name")
                  mi = m.find("MaintainabilityIndex")
                  if cc is None or int(cc.text or 0) < 2: continue
                  methods.append({"name":(nm.text or "")[:80],"complexity":int(cc.text),
                                  "maintainability":int(mi.text) if mi is not None else 0})
              methods.sort(key=lambda x: x["complexity"], reverse=True)
              avg = round(sum(m["complexity"] for m in methods)/len(methods),1) if methods else 0
              complexity["projects"][proj] = {"avg_complexity":avg,
                  "max_complexity":methods[0]["complexity"] if methods else 0,"hotspots":methods[:8]}
              print(f"{proj}: avg={avg} max={methods[0]['complexity'] if methods else 0}")

          projects_refs = {}
          for root, dirs, files in os.walk("src"):
              for f in files:
                  if f.endswith(".csproj"):
                      txt = open(os.path.join(root,f)).read()
                      projects_refs[f.replace(".csproj","")] = [
                          os.path.basename(m.group(1)).replace(".csproj","")
                          for m in re.finditer(r'<ProjectReference Include="([^"]+)"', txt)]

          ca = defaultdict(int)
          for proj, deps in projects_refs.items():
              for dep in deps: ca[dep] += 1
          coupling_data = {}
          for proj, deps in projects_refs.items():
              ce_v = len(deps); ca_v = ca.get(proj,0); total = ca_v+ce_v
              coupling_data[proj] = {"ca":ca_v,"ce":ce_v,
                  "instability":round(ce_v/total,3) if total>0 else 0.0,"deps":deps}
              print(f"{proj}: Ca={ca_v} Ce={ce_v} I={coupling_data[proj]['instability']}")

          json.dump(complexity, open("k6/results/metrics/complexity.json","w"), indent=2)
          json.dump({"projects":coupling_data,"generated_at":datetime.datetime.utcnow().isoformat()+"Z"},
                    open("k6/results/metrics/coupling.json","w"), indent=2)
          print("JSONs gerados")
          PYEOF

      - name: Publicar JSONs na VPS via SSH nativo
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "mkdir -p /var/www/html/k6/results/metrics"
          scp k6/results/metrics/complexity.json \
              k6/results/metrics/coupling.json \
              ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/var/www/html/k6/results/metrics/
          echo "JSONs publicados com sucesso"
