      - name: Upload artefato Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-v2-report-${{ github.run_number }}
          path: |
            tests/e2e/playwright-results.json
            tests/e2e/test-results/
          retention-days: 30

      - name: Criar diretorios na VPS
        uses: appleboy/ssh-action@v1.2.0
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            mkdir -p /var/www/html/opswatch/results/e2e-v2
        continue-on-error: true

      - name: Publicar latest.json na VPS
        uses: appleboy/scp-action@v0.1.7
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "e2e-v2-output/latest.json"
          target: "/var/www/html/opswatch/results/e2e-v2/"
          strip_components: 1
          overwrite: true
        continue-on-error: true

      - name: Publicar report.html na VPS
        uses: appleboy/scp-action@v0.1.7
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "e2e-v2-output/report.html"
          target: "/var/www/html/opswatch/results/e2e-v2/"
          strip_components: 1
          overwrite: true
        continue-on-error: true

