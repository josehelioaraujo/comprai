            'function scheduleNext(){'
            'console.log("[scheduleNext] autoAdv="+autoAdv+" _scheduling="+_scheduling+" idx="+idx);'
            'if(!autoAdv||_scheduling)return;'
            'if(ALL[idx]&&ALL[idx].src){console.log("[scheduleNext] é vídeo — aguarda onended");return;}'
            'var n=nextVisible(idx);'
            'console.log("[scheduleNext] nextVisible="+n);'
            'if(n<0){console.log("[scheduleNext] fim da lista");return;}'
