            'if(el){el.classList.add("active");el.scrollIntoView({block:"nearest"});}else{console.warn("[play] pi"+i+" não encontrado no DOM");}'
            # label topo
            'var vis=ALL.filter(function(x){return !activeCat||x.cat===activeCat;});'
            'var pos=vis.findIndex(function(x){return ALL.indexOf(x)===i;})+1;'
            'document.getElementById("ln").textContent=item.name;'
            'document.getElementById("prog").textContent=pos+" / "+vis.length;'
            # exibe vídeo ou painel resultado
            'if(hasVid){'
            'console.log("[play] modo VÍDEO src="+item.src);'
            'vid.style.display="block";rp.style.display="none";novid.style.display="none";tapOv.style.display="none";'
            'console.log("[play] antes do src — offsetWidth="+vid.offsetWidth+" offsetHeight="+vid.offsetHeight);'
            'var _playIdx=idx;'
            # limpa handlers antigos e reseta estado — evita herdar play-state de vídeo anterior
            'vid.oncanplaythrough=null;vid.onloadeddata=null;'
            'if(!vid.paused){vid.pause();}vid.currentTime=0;'
            'vid.src=item.src;'
            'vid.load();'
            'console.log("[play] src="+vid.src+" networkState="+vid.networkState+" readyState="+vid.readyState);'
            # play() imediato no user-gesture context — browser aguarda buffer sem perder o gesture chain
            # evita quebra do autoplay policy no mobile (setTimeout quebraria o chain)
            'var _pp=vid.play();'
            'if(_pp!==undefined){'
            '_pp.catch(function(e){'
            'console.error("[play] erro:",e.name,e.message);'
            'if(e.name==="AbortError"){'
            # AbortError = src mudou antes de terminar (clique rápido em outro item) — ignorar
            'console.warn("[play] AbortError — src mudou, ignorando");'
            '}else if(e.name==="NotAllowedError"){'
            # NotAllowedError = autoplay bloqueado — mostra overlay tap-to-play para criar novo gesture
            'console.warn("[play] NotAllowedError — autoplay bloqueado, exibindo overlay tap-to-play");'
            'tapOv.style.display="flex";'
            '}else{'
            'console.error("[play] erro inesperado:",e.name);'
            'vid.style.display="none";novid.style.display="flex";rp.style.display="none";'
            'if(autoAdv){var n=nextVisible(idx);if(n>=0)setTimeout(function(){play(n);},200);}'
            '}'
            '});'
            '}'
            '}else{'
            'console.log("[play] modo RESULTADO status="+item.status);'
            'vid.style.display="none";vid.pause();vid.removeAttribute("src");'
            'novid.style.display="none";'
            'rp.style.display="flex";'
            'var ic=item.status==="passed"?"✅":item.status==="failed"?"❌":"⏭";'
            'var col=item.status==="passed"?"#22c55e":item.status==="failed"?"#ef4444":"#f59e0b";'
            'var lbl=item.status==="passed"?"PASSOU":item.status==="failed"?"FALHOU":"IGNORADO";'
            'document.getElementById("rp-icon").textContent=ic;'
            'document.getElementById("rp-title").textContent=item.name;'
            'var rs=document.getElementById("rp-status");'
            'rs.textContent=lbl;rs.style.background=col+"22";rs.style.color=col;'
            'scheduleNext();'
            '}}'

            # startAll: reproduz todos em sequência (API com delay, vídeo aguarda onended)
            'function startAll(btn){'
            'clearTimeout(autoTimer);autoAdv=true;'
            'btnNext.style.display="none";'
            'document.querySelectorAll(".btn").forEach(function(b){b.classList.remove("on");});'
            'btn.classList.add("on");'
            'var first=ALL.findIndex(function(x){return !activeCat||x.cat===activeCat;});'
            'play(first>=0?first:0);}'

            # start1x1: manual, botão Próximo visível
            'function start1x1(btn){'
            'clearTimeout(autoTimer);autoAdv=false;'
            'btnNext.style.display="inline-flex";'
            'document.querySelectorAll(".btn").forEach(function(b){b.classList.remove("on");});'
            'btn.classList.add("on");'
            'var first=ALL.findIndex(function(x){return !activeCat||x.cat===activeCat;});'
