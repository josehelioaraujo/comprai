name: E2E v2 — Fluxo Completo (T01-T31)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL base da API'
        required: false
        default: 'http://2.25.122.11:5020'

env:
  NODE_VERSION: '20'
  VPS_HOST:    '2.25.122.11'
  VPS_USER:    'root'
  E2E_API_URL: ${{ github.event.inputs.api_url || 'http://2.25.122.11:5020' }}

jobs:

  # ─────────────────────────────────────────────
  # E2E v2 — API flow T01-T31
  # ─────────────────────────────────────────────
  e2e-v2:
    name: 🎭 Playwright E2E v2 (T01–T31)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/e2e/package.json

      - name: Install dependencias E2E
        working-directory: tests/e2e
        run: npm install

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install chromium --with-deps

      - name: Aguardar API saudavel
        run: |
          echo "Aguardando $E2E_API_URL/health/live..."
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$E2E_API_URL/health/live" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "API OK (tentativa $i)"
              break
            fi
            echo "Tentativa $i — status $status, aguardando 10s..."
            sleep 10
          done

      - name: Executar E2E v2 (full-flow-v2.spec.ts)
        working-directory: tests/e2e
        env:
          E2E_API_URL:               ${{ env.E2E_API_URL }}
          E2E_USER_EMAIL:            ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD:         ${{ secrets.E2E_USER_PASSWORD }}
          # JSON reporter escreve o arquivo (não diretório)
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
          CI: 'true'
        run: |
          npx playwright test full-flow-v2.spec.ts \
            --reporter=json \
            --output=test-artifacts \
            --project=chromium
        continue-on-error: true

      - name: Gerar latest.json para OpsWatch
        if: always()
        env:
          GH_RUN: ${{ github.run_number }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, glob, datetime

          run_num = os.environ.get('GH_RUN', '?')
          sha     = os.environ.get('GH_SHA', '')[:7]

          # Le playwright-results.json (garante que eh arquivo, nao diretorio)
          raw_path = 'tests/e2e/playwright-results.json'
          raw = {}
          if os.path.isfile(raw_path):
            with open(raw_path) as f:
              raw = json.load(f)

          total   = raw.get('stats', {}).get('expected',   0) \
                  + raw.get('stats', {}).get('unexpected', 0) \
                  + raw.get('stats', {}).get('skipped',    0)
          passed  = raw.get('stats', {}).get('expected',   0)
          failed  = raw.get('stats', {}).get('unexpected', 0)
          skipped = raw.get('stats', {}).get('skipped',    0)
          dur_ms  = raw.get('stats', {}).get('duration',   0)
          duration = round(dur_ms / 1000)

          status = 'passed' if failed == 0 and total > 0 else \
                   'failed' if failed > 0 else 'no_results'

          # Suites
          suites = []
          for suite in raw.get('suites', []):
            file_name = suite.get('title', 'unknown')
            specs = []
            for spec in suite.get('specs', []):
              s_status  = 'passed'
              s_dur     = 0
              s_errors  = []
              for result in spec.get('tests', []):
                for attempt in result.get('results', []):
                  s_dur = round(attempt.get('duration', 0) / 1000)
                  if attempt.get('status', '') in ('failed', 'timedOut'):
                    s_status = 'failed'
                    for err in attempt.get('errors', []):
                      msg = err.get('message', '')
                      s_errors.append({ 'message': msg[:200] })
                  elif attempt.get('status', '') == 'skipped':
                    if s_status != 'failed':
                      s_status = 'skipped'
              specs.append({
                'title':    spec.get('title', ''),
                'status':   s_status,
                'duration': s_dur,
                'errors':   s_errors,
              })
            sp = sum(1 for s in specs if s['status'] == 'passed')
            sf = sum(1 for s in specs if s['status'] == 'failed')
            suites.append({
              'file':   file_name,
              'passed': sp,
              'failed': sf,
              'specs':  specs,
            })

          result = {
            'status':     status,
            'run':        run_num,
            'sha':        sha,
            'timestamp':  datetime.datetime.utcnow().isoformat() + 'Z',
            'workflow':   'e2e-v2.yml',
            'report_url': f'https://github.com/josehelioaraujo/comprai/actions/runs/',
            'summary': {
              'total':    total,
              'passed':   passed,
              'failed':   failed,
              'skipped':  skipped,
              'duration': duration,
            },
            'suites': suites,
          }

          os.makedirs('e2e-v2-output', exist_ok=True)
          with open('e2e-v2-output/latest.json', 'w') as f:
            json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"latest.json: status={status} total={total} passed={passed} failed={failed}")
          PYEOF

      - name: Upload artefato Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-v2-report-${{ github.run_number }}
          path: |
            tests/e2e/playwright-results.json
            tests/e2e/test-results/
          retention-days: 30

      - name: Criar diretorio na VPS
        uses: appleboy/ssh-action@v1.2.0
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: mkdir -p /var/www/html/opswatch/results/e2e-v2
        continue-on-error: true

      - name: Publicar latest.json na VPS
        uses: appleboy/scp-action@v0.1.7
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "e2e-v2-output/latest.json"
          target: "/var/www/html/opswatch/results/e2e-v2/"
          strip_components: 1
          overwrite: true
        continue-on-error: true
