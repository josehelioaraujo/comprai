name: E2E — Fluxo Completo (T01-T31)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL base da API'
        required: false
        default: 'http://2.25.122.11:5020'

env:
  NODE_VERSION: '20'
  VPS_HOST:    '2.25.122.11'
  VPS_DOMAIN:  'comprai.2.25.122.11.nip.io'
  VPS_USER:    'root'
  E2E_API_URL: ${{ github.event.inputs.api_url || 'http://2.25.122.11:5020' }}

jobs:

  # ─────────────────────────────────────────────
  # E2E — API flow T01-T31
  # ─────────────────────────────────────────────
  e2e-v2:
    name: 🎭 Playwright E2E (T01–T31)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/e2e/package.json

      - name: Install dependencias E2E
        working-directory: tests/e2e
        run: npm install

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json', 'tests/e2e/package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # Deps do sistema já estão no runner Ubuntu — sem necessidade de instalar no cache hit

      - name: Aguardar API saudavel
        continue-on-error: true
        run: |
          echo "Aguardando $E2E_API_URL/health/live..."
          for i in $(seq 1 6); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$E2E_API_URL/health/live" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "API OK (tentativa $i)"
              exit 0
            fi
            echo "Tentativa $i — status $status, aguardando 5s..."
            sleep 5
          done
          echo "API nao respondeu em 30s — continuando mesmo assim"

      - name: Executar E2E v2 (full-flow-v2.spec.ts)
        working-directory: tests/e2e
        env:
          E2E_API_URL:       ${{ env.E2E_API_URL }}
          E2E_USER_EMAIL:    ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          CI: 'true'
        run: |
          npx playwright test full-flow-v2.spec.ts \
            --config=playwright.config.v2.ts \
            --output=test-artifacts \
            --project=chromium
        continue-on-error: true

      - name: Exibir resultados E2E
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          path = 'tests/e2e/playwright-results.json'
          if not os.path.isfile(path):
            print("::warning::playwright-results.json NAO ENCONTRADO")
            sys.exit(0)

          with open(path) as f:
            raw = json.load(f)

          stats   = raw.get('stats', {})
          total   = stats.get('expected', 0) + stats.get('unexpected', 0) + stats.get('skipped', 0)
          passed  = stats.get('expected', 0)
          failed  = stats.get('unexpected', 0)
          skipped = stats.get('skipped', 0)
          dur_ms  = stats.get('duration', 0)

          print(f"\n{'='*60}")
          print(f"  PLAYWRIGHT E2E — RESULTADOS")
          print(f"{'='*60}")
          print(f"  Total : {total}  |  ✅ {passed}  |  ❌ {failed}  |  ⏭ {skipped}")
          print(f"  Duração: {round(dur_ms/1000)}s")
          print(f"{'='*60}\n")

          def print_specs(suite, pad='  '):
            title = suite.get('title', '')
            if title:
              print(f"{pad}📁 {title}")
            for spec in suite.get('specs', []):
              stitle = spec.get('title', '')
              ok     = True
              for result in spec.get('tests', []):
                for attempt in result.get('results', []):
                  st = attempt.get('status', '')
                  if st in ('failed', 'timedOut'):
                    ok  = False
                    dur = round(attempt.get('duration', 0) / 1000)
                    print(f"{pad}  ❌ [{dur}s] {stitle}")
                    for err in attempt.get('errors', []):
                      msg = err.get('message', '').split('\n')
                      for line in msg[:6]:
                        print(f"{pad}     {line}")
                      snip = err.get('snippet', '')
                      if snip:
                        for line in snip.split('\n')[:4]:
                          print(f"{pad}     {line}")
                  elif st == 'skipped':
                    print(f"{pad}  ⏭ [skip] {stitle}")
                    ok = None
              if ok is True:
                dur = 0
                for result in spec.get('tests', []):
                  for attempt in result.get('results', []):
                    dur = round(attempt.get('duration', 0) / 1000)
                print(f"{pad}  ✅ [{dur}s] {stitle}")
            for sub in suite.get('suites', []):
              print_specs(sub, pad + '  ')

          for suite in raw.get('suites', []):
            print_specs(suite)

          print(f"\n{'='*60}")
          if failed > 0:
            print(f"  ⛔ {failed} TESTE(S) FALHARAM")
          else:
            print(f"  ✅ TODOS OS TESTES PASSARAM")
          print(f"{'='*60}\n")
          PYEOF

      - name: Gerar latest.json para OpsWatch
        if: always()
        env:
          GH_RUN: ${{ github.run_number }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, glob, datetime, re

          run_num = os.environ.get('GH_RUN', '?')
          run_id  = os.environ.get('GH_RUN_ID', '')
          sha     = os.environ.get('GH_SHA', '')[:7]

          # Le playwright-results.json (garante que eh arquivo, nao diretorio)
          raw_path = 'tests/e2e/playwright-results.json'
          raw = {}
          if os.path.isfile(raw_path):
            with open(raw_path) as f:
              raw = json.load(f)

          total   = raw.get('stats', {}).get('expected',   0) \
                  + raw.get('stats', {}).get('unexpected', 0) \
                  + raw.get('stats', {}).get('skipped',    0)
          passed  = raw.get('stats', {}).get('expected',   0)
          failed  = raw.get('stats', {}).get('unexpected', 0)
          skipped = raw.get('stats', {}).get('skipped',    0)
          dur_ms  = raw.get('stats', {}).get('duration',   0)
          duration = round(dur_ms / 1000)

          status = 'passed' if failed == 0 and total > 0 else \
                   'failed' if failed > 0 else 'no_results'

          # Suites
          suites = []
          def collect_specs(node):
            result = []
            for spec in node.get('specs', []):
              result.append(spec)
            for sub in node.get('suites', []):
              result.extend(collect_specs(sub))
            return result

          def parse_requests_from_stdout(stdout_entries, spec_title):
            """Extrai requests do stdout Playwright para popular spec.requests no OpsWatch."""
            requests = []
            # Extrai method e URL do titulo (ex: "T01 — GET /health/live")
            tm = re.search(r'\b(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s+(/\S+)', spec_title)
            main_method = tm.group(1) if tm else 'HTTP'
            main_url    = tm.group(2) if tm else spec_title
            for entry in stdout_entries:
              text = entry.get('text', '') if isinstance(entry, dict) else str(entry)
              for line in text.splitlines():
                line = line.strip()
                if not line:
                  continue
                # Padrao principal: "[T01] /health/live → 200 ✅"  ou "[T18] Checkout → 500 | orderId: -"
                m = re.match(r'^\[T\d+\]\s+(.+?)\s*[→:]\s*(\d{3})', line)
                if m:
                  label  = m.group(1).strip()
                  status = int(m.group(2))
                  detail = re.search(r'\|\s*(.+)$', line)
                  res    = detail.group(1).strip() if detail else ''
                  url    = label if label.startswith('/') else main_url
                  requests.append({'method': main_method, 'url': url, 'status': status, 'res_body': res})
                  continue
                # Padrao sub-step: "  Search: 200 | 3 produto(s)"  ou "  AddToCart: 200"
                m2 = re.match(r'^([A-Z][A-Za-z\s]+?)\s*:\s*(\d{3})', line)
                if m2:
                  name   = m2.group(1).strip()
                  status = int(m2.group(2))
                  detail = re.search(r'\|\s*(.+)$', line)
                  res    = detail.group(1).strip() if detail else ''
                  requests.append({'method': 'HTTP', 'url': f'{main_url} ({name})', 'status': status, 'res_body': res})
            return requests

          for suite in raw.get('suites', []):
            file_name = suite.get('title', 'unknown')
            specs = []
            for spec in collect_specs(suite):
              s_status  = 'passed'
              s_dur     = 0
              s_errors  = []
              s_stdout  = []
              for result in spec.get('tests', []):
                for attempt in result.get('results', []):
                  s_dur = round(attempt.get('duration', 0) / 1000)
                  s_stdout.extend(attempt.get('stdout', []))
                  if attempt.get('status', '') in ('failed', 'timedOut'):
                    s_status = 'failed'
                    for err in attempt.get('errors', []):
                      msg   = err.get('message', '')
                      snip  = err.get('snippet', '')
                      value = err.get('value', '')
                      s_errors.append({
                        'message': msg[:2000],
                        'snippet': snip[:500] if snip else '',
                        'value':   value[:500] if value else '',
                      })
                  elif attempt.get('status', '') == 'skipped':
                    if s_status != 'failed':
                      s_status = 'skipped'
              s_requests = parse_requests_from_stdout(s_stdout, spec.get('title', ''))
              specs.append({
                'title':    spec.get('title', ''),
                'status':   s_status,
                'duration': s_dur,
                'errors':   s_errors,
                'requests': s_requests,
              })
            sp = sum(1 for s in specs if s['status'] == 'passed')
            sf = sum(1 for s in specs if s['status'] == 'failed')
            suites.append({
              'file':   file_name,
              'passed': sp,
              'failed': sf,
              'specs':  specs,
            })

          result = {
            'status':          status,
            'run':             run_num,
            'sha':             sha,
            'timestamp':       datetime.datetime.utcnow().isoformat() + 'Z',
            'workflow':        'e2e-v2.yml',
            'run_id':          run_id,
            'report_url':      f'https://github.com/josehelioaraujo/comprai/actions/runs/{run_id}',
            'summary': {
              'total':    total,
              'passed':   passed,
              'failed':   failed,
              'skipped':  skipped,
              'duration': duration,
            },
            'suites': suites,
          }

          os.makedirs('e2e-v2-output', exist_ok=True)
          with open('e2e-v2-output/latest.json', 'w') as f:
            json.dump(result, f, ensure_ascii=False, indent=2)

          print(f"latest.json: status={status} total={total} passed={passed} failed={failed} skipped={skipped}")

          # ── Debug: imprimir specs com falha no log do CI
          if failed > 0:
            print("\n── FALHAS DETALHADAS ──────────────────────────────────")
            for suite in suites:
              for spec in suite['specs']:
                if spec['status'] == 'failed':
                  print(f"\n  ❌ {spec['title']}")
                  for i, err in enumerate(spec['errors'], 1):
                    print(f"     [erro {i}] {err['message'][:400]}")
                    if err.get('snippet'):
                      print(f"     [snippet] {err['snippet'][:200]}")
            print("────────────────────────────────────────────────────────")
          PYEOF

      - name: Gerar report.html para OpsWatch
        if: always()
        env:
          GH_RUN: ${{ github.run_number }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, datetime
          import html as _html

          def esc(s):
            return _html.escape(str(s or ''))

          _ANSI_RE = re.compile(r'\x1b\[[0-9;]*[a-zA-Z]|\x1b[^[]')
          def strip_ansi(s):
            return _ANSI_RE.sub('', str(s or ''))
          def clean_err(s):
            s = strip_ansi(s)
            lines = s.split('\n')
            kept = []
            for line in lines:
              # Remove linhas de snippet de código: "  311 |  code", "> 313 |  code", "      |    ^"
              if re.match(r'^\s*>?\s*\d+\s*\|', line): continue
              if re.match(r'^\s*\|\s', line): continue
              # Remove linhas de stack trace: "    at /home/runner/...:313:31"
              if re.match(r'^\s+at\s+', line): continue
              kept.append(line)
            # Remove linhas vazias duplicadas e trailing
            result = re.sub(r'\n{3,}', '\n\n', '\n'.join(kept)).strip()
            return result[:400]

          def parse_requests_from_stdout(stdout_entries, spec_title):
            requests = []
            tm = re.search(r'\b(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s+(/\S+)', spec_title)
            main_method = tm.group(1) if tm else 'HTTP'
            main_url    = tm.group(2) if tm else spec_title
            for entry in stdout_entries:
              text = entry.get('text', '') if isinstance(entry, dict) else str(entry)
              for line in text.splitlines():
                line = line.strip()
                if not line:
                  continue
                m = re.match(r'^\[T\d+\]\s+(.+?)\s*[→:]\s*(\d{3})', line)
                if m:
                  label  = m.group(1).strip()
                  status = int(m.group(2))
                  detail = re.search(r'\|\s*(.+)$', line)
                  res    = detail.group(1).strip() if detail else ''
                  url    = label if label.startswith('/') else main_url
                  requests.append({'method': main_method, 'url': url, 'status': status, 'res_body': res})
                  continue
                m2 = re.match(r'^([A-Z][A-Za-z\s]+?)\s*:\s*(\d{3})', line)
                if m2:
                  name   = m2.group(1).strip()
                  status = int(m2.group(2))
                  detail = re.search(r'\|\s*(.+)$', line)
                  res    = detail.group(1).strip() if detail else ''
                  requests.append({'method': 'HTTP', 'url': f'{main_url} ({name})', 'status': status, 'res_body': res})
            return requests

          run_num = os.environ.get('GH_RUN', '?')
          sha     = os.environ.get('GH_SHA', '')[:7]

          raw_path = 'tests/e2e/playwright-results.json'
          raw = {}
          if os.path.isfile(raw_path):
            with open(raw_path) as f:
              raw = json.load(f)

          stats    = raw.get('stats', {})
          total    = stats.get('expected',   0) + stats.get('unexpected', 0) + stats.get('skipped', 0)
          passed   = stats.get('expected',   0)
          failed   = stats.get('unexpected', 0)
          skipped  = stats.get('skipped',    0)
          duration = round(stats.get('duration', 0) / 1000)
          pass_rate = round(passed / total * 100) if total > 0 else 0
          status   = 'passed' if failed == 0 and total > 0 else 'failed' if failed > 0 else 'no_results'
          status_label = 'PASSOU' if status == 'passed' else 'FALHOU' if status == 'failed' else 'SEM DADOS'
          status_color = '#22c55e' if status == 'passed' else '#ef4444' if status == 'failed' else '#94a3b8'
          ts = datetime.datetime.utcnow().strftime('%d/%m/%Y %H:%M:%S UTC')

          # Flat list: (suite_name, spec)
          all_specs = []
          def collect(node, suite_name=''):
            name = suite_name or node.get('title', 'unknown')
            for spec in node.get('specs', []):
              all_specs.append((name, spec))
            for sub in node.get('suites', []):
              collect(sub, name)
          for suite in raw.get('suites', []):
            collect(suite)

          def get_category(title):
            m = re.match(r'[Tt](\d+)', title)
            if not m:
              return 'Outros'
            n = int(m.group(1))
            if n <= 2:  return 'Healthcheck'
            if n <= 4:  return 'Cadastro'
            if n <= 9:  return 'Autenticação'
            if n <= 12: return 'Busca'
            if n <= 17: return 'Carrinho'
            if n <= 20: return 'Checkout'
            if n <= 23: return 'Pagamento'
            if n <= 27: return 'Pedidos'
            return 'Fluxo E2E'
          cat_counts = {}
          rows_html = ''
          for i, (suite_name, spec) in enumerate(all_specs):
            s_status  = 'passed'
            s_dur     = 0
            s_errors  = []
            s_stdout  = []
            for result in spec.get('tests', []):
              for attempt in result.get('results', []):
                s_dur = round(attempt.get('duration', 0) / 1000)
                s_stdout.extend(attempt.get('stdout', []))
                st = attempt.get('status', '')
                if st in ('failed', 'timedOut'):
                  s_status = 'failed'
                  for err in attempt.get('errors', []):
                    s_errors.append(clean_err(err.get('message', '')))
                elif st == 'skipped' and s_status != 'failed':
                  s_status = 'skipped'

            # Deduplica erros de múltiplas tentativas (retries geram repetição)
            seen_errs = set()
            deduped_errs = []
            for e in s_errors:
              if e not in seen_errs:
                seen_errs.add(e)
                deduped_errs.append(e)
            s_errors = deduped_errs

            s_cat = get_category(spec.get('title', ''))
            cat_counts[s_cat] = cat_counts.get(s_cat, 0) + 1
            s_requests = parse_requests_from_stdout(s_stdout, spec.get('title', ''))
            req_html = ''
            if s_requests:
              req_html = '<table style="margin-top:10px;border-collapse:collapse;width:100%"><thead><tr style="border-bottom:1px solid #334155">'
              req_html += '<th style="padding:4px 10px;font-size:10px;color:#475569;text-align:left">MÉTODO</th>'
              req_html += '<th style="padding:4px 10px;font-size:10px;color:#475569;text-align:left">URL / AÇÃO</th>'
              req_html += '<th style="padding:4px 10px;font-size:10px;color:#475569;text-align:center">HTTP</th>'
              req_html += '<th style="padding:4px 10px;font-size:10px;color:#475569;text-align:left">RETORNO</th>'
              req_html += '</tr></thead><tbody>'
              for req in s_requests:
                sc     = req['status']
                sc_col = '#22c55e' if sc < 300 else '#f59e0b' if sc < 400 else '#ef4444'
                rb     = esc(req['res_body'][:100]) if req.get('res_body') else '&mdash;'
                req_html += (
                  f'<tr style="border-bottom:1px solid #0f172a">'
                  f'<td style="padding:3px 10px;font-size:11px;font-family:monospace;color:#7dd3fc">{esc(req["method"])}</td>'
                  f'<td style="padding:3px 10px;font-size:11px;font-family:monospace;color:#e2e8f0;word-break:break-all">{esc(req["url"])}</td>'
                  f'<td style="padding:3px 10px;font-size:12px;font-family:monospace;color:{sc_col};text-align:center;font-weight:700">{sc}</td>'
                  f'<td style="padding:3px 10px;font-size:11px;color:#94a3b8">{rb}</td>'
                  f'</tr>'
                )
              req_html += '</tbody></table>'

            if s_status == 'passed':
              badge       = '<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;background:#22c55e22;color:#22c55e">PASSOU</span>'
              status_note = '<div style="color:#22c55e;font-size:12px;margin-bottom:6px">&#9989; Passou sem erros.</div>'
            elif s_status == 'failed':
              badge       = '<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;background:#ef444422;color:#ef4444">FALHOU</span>'
              err_parts   = ''.join(
                f'<pre style="color:#fca5a5;font-size:11px;white-space:pre-wrap;margin-top:4px;max-height:120px;overflow:auto;background:#1e293b;padding:8px;border-radius:4px">{esc(e)}</pre>'
                for e in s_errors[:2]
              )
              status_note = f'<div style="color:#ef4444;font-size:12px;margin-bottom:6px">&#10060; Falha detectada.{err_parts}</div>'
            else:
              badge       = '<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;background:#f59e0b22;color:#f59e0b">IGNORADO</span>'
              status_note = '<div style="color:#f59e0b;font-size:12px;margin-bottom:6px">&#9940; Ignorado.</div>'

            detail = status_note + req_html

            rows_html += (
              f'<tr class="sr" data-status="{s_status}" data-cat="{s_cat}" data-i="{i}" onclick="tg({i})" style="cursor:pointer">'
              f'<td style="color:#475569;font-size:11px;text-align:center">{str(i+1).zfill(3)}</td>'
              f'<td style="color:#475569;font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{esc(suite_name)}</td>'
              f'<td style="color:#e2e8f0">{esc(spec.get("title",""))}</td>'
              f'<td>{badge}</td>'
              f'<td style="color:#64748b;font-size:11px;text-align:right;font-family:monospace">{s_dur}s</td>'
              f'<td style="text-align:center"><span id="chv{i}" class="chv">&#9654;</span></td>'
              f'</tr>'
              f'<tr id="d{i}" style="display:none;background:#020617">'
              f'<td colspan="6" style="padding:12px 24px">{detail}</td>'
              f'</tr>'
            )

          cat_order  = ['Healthcheck','Cadastro','Autenticação','Busca','Carrinho','Checkout','Pagamento','Pedidos','Fluxo E2E']
          cat_colors = {'Healthcheck':'#38bdf8','Cadastro':'#06b6d4','Autenticação':'#a78bfa','Busca':'#34d399','Carrinho':'#f59e0b','Checkout':'#fb923c','Pagamento':'#22c55e','Pedidos':'#818cf8','Fluxo E2E':'#f472b6'}
          cat_cards_html = ''
          for cat in cat_order:
            cnt = cat_counts.get(cat, 0)
            if cnt == 0:
              continue
            col = cat_colors.get(cat, '#94a3b8')
            cat_cards_html += (
              f'<div class="kpi" data-cat-filter="{cat}" onclick="fltCat(\'{cat}\')" title="Filtrar: {cat}">'
              f'<div class="kv" style="color:{col}">{cnt}</div>'
              f'<div class="kl">{cat}</div>'
              f'</div>'
            )
          fail_color = '#ef4444' if failed > 0 else '#22c55e'
          ok_color   = '#22c55e' if pass_rate == 100 else '#f59e0b' if pass_rate >= 80 else '#ef4444'

          report = (
            '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">'
            '<meta name="viewport" content="width=device-width,initial-scale=1">'
            f'<title>E2E v2 / Evidencias &mdash; Run #{run_num}</title>'
            '<style>'
            '*{box-sizing:border-box;margin:0;padding:0}'
            'body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:28px 24px}'
            'h1{font-size:18px;font-weight:700;margin-bottom:4px}'
            '.sub{font-size:12px;color:#64748b;margin-bottom:24px}'
            '.sum{display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap}'
            '.kpi{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:12px 18px;text-align:center;min-width:90px;cursor:pointer;transition:border-color .15s,box-shadow .15s}'
            '.kpi:hover{border-color:#38bdf8;box-shadow:0 0 0 1px #38bdf822}'
            '.kpi.active{border-color:#38bdf8;box-shadow:0 0 0 2px #38bdf833}'
            '.kv{font-size:22px;font-weight:700}'
            '.kl{font-size:11px;color:#64748b;margin-top:2px}'
            'table{width:100%;border-collapse:collapse}'
            'thead tr{background:#1e293b}'
            'th{padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#475569;text-align:left;border-bottom:1px solid #334155}'
            'tr.sr:hover{background:#1e293b}'
            'td{padding:9px 12px;border-bottom:1px solid #1e293b;font-size:13px;vertical-align:middle}'
            '.chv{display:inline-block;font-size:11px;transition:transform .2s;color:#475569;line-height:1}'
            '.chv.open{transform:rotate(90deg)}'
            '</style></head><body>'
            '<h1>&#127381; E2E v2 / Evidencias &mdash; Playwright</h1>'
            f'<div class="sub">Run #{run_num} &middot; SHA {sha} &middot; {ts} &middot; '
            f'<span style="color:{status_color};font-weight:700">{status_label}</span></div>'
            f'<button onclick="dlEv()" style="margin-bottom:20px;display:inline-flex;align-items:center;gap:6px;padding:7px 16px;background:#1e293b;border:1px solid #334155;border-radius:7px;font-size:12px;font-weight:600;color:#94a3b8;cursor:pointer" onmouseover="this.style.borderColor=\'#22c55e\';this.style.color=\'#4ade80\'" onmouseout="this.style.borderColor=\'#334155\';this.style.color=\'#94a3b8\'">&#11123; Baixar Evid&ecirc;ncias (HTML)</button>'
            '<div class="sum">'
            f'<div class="kpi" data-filter="all" onclick="flt(\'all\')" title="Exibir todos"><div class="kv" style="color:#94a3b8">{total}</div><div class="kl">Total</div></div>'
            f'<div class="kpi" data-filter="passed" onclick="flt(\'passed\')" title="Filtrar aprovados"><div class="kv" style="color:#22c55e">{passed}</div><div class="kl">Passou</div></div>'
            f'<div class="kpi" data-filter="failed" onclick="flt(\'failed\')" title="Filtrar falhos"><div class="kv" style="color:{fail_color}">{failed}</div><div class="kl">Falhou</div></div>'
            f'<div class="kpi" data-filter="skipped" onclick="flt(\'skipped\')" title="Filtrar ignorados"><div class="kv" style="color:#f59e0b">{skipped}</div><div class="kl">Ignorado</div></div>'
            f'<div class="kpi" title="Duração total da suite"><div class="kv" style="color:#38bdf8">{duration}s</div><div class="kl">Dura&ccedil;&atilde;o</div></div>'
            f'<div class="kpi" title="Taxa de sucesso"><div class="kv" style="color:{ok_color}">{pass_rate}%</div><div class="kl">Taxa OK</div></div>'
            '</div>'
            f'<div class="sum" style="margin-bottom:20px">{cat_cards_html}</div>'
            '<table><thead><tr><th>#</th><th>Arquivo</th><th>Teste</th><th>Status</th><th>Dur.</th><th></th></tr></thead>'
            f'<tbody>{rows_html}</tbody></table>'
            '<script>'
            'function tg(i){'
            'var d=document.getElementById("d"+i);'
            'var c=document.getElementById("chv"+i);'
            'if(!d)return;'
            'var open=d.style.display==="none";'
            'd.style.display=open?"table-row":"none";'
            'if(c)c.classList.toggle("open",open);'
            '}'
            f'function dlEv(){{var b=new Blob([document.documentElement.outerHTML],{{type:"text/html"}});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="evidencias-run-{run_num}.html";a.click();}}'
            'var _st="all",_cat="all";'
            'function applyFilters(){'
            'document.querySelectorAll("tr.sr").forEach(function(tr){'
            'var show=(_st==="all"||tr.getAttribute("data-status")===_st)&&(_cat==="all"||tr.getAttribute("data-cat")===_cat);'
            'tr.style.display=show?"":"none";'
            'if(!show){'
            'var di=tr.getAttribute("data-i");'
            'var det=document.getElementById("d"+di);if(det)det.style.display="none";'
            'var chv=document.getElementById("chv"+di);if(chv)chv.classList.remove("open");'
            '}'
            '});'
            'document.querySelectorAll(".kpi[data-filter]").forEach(function(k){'
            'k.classList.toggle("active",k.getAttribute("data-filter")===_st);'
            '});'
            'document.querySelectorAll(".kpi[data-cat-filter]").forEach(function(k){'
            'k.classList.toggle("active",k.getAttribute("data-cat-filter")===_cat);'
            '});'
            '}'
            'function flt(st){_st=st;applyFilters();}'
            'function fltCat(cat){_cat=cat;applyFilters();}'
            '</script>'
            '</body></html>'
          )

          os.makedirs('e2e-v2-output', exist_ok=True)
          with open('e2e-v2-output/report.html', 'w', encoding='utf-8') as f:
            f.write(report)
          print(f"report.html gerado: {len(all_specs)} specs, status={status}")
          PYEOF

      # ── Testes Visuais — gera vídeos de demonstração para o OpsWatch ─────────

      - name: Verificar Frontend disponivel (port 3002 — frontend/web)
        id: check-frontend
        if: always()
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://$VPS_HOST:3002" 2>/dev/null || echo "000")
          if [ "$status" != "000" ] && [ "$status" != "502" ] && [ "$status" != "503" ]; then
            echo "FRONTEND_UP=true" >> $GITHUB_OUTPUT
            echo "Frontend web disponivel — status $status"
          else
            echo "FRONTEND_UP=false" >> $GITHUB_OUTPUT
            echo "::warning::Frontend web (port 3002) nao respondeu (status $status) — testes visuais ignorados"
          fi
        continue-on-error: true

      - name: Executar testes visuais (full-flow-visual.spec.ts)
        if: always() && steps.check-frontend.outputs.FRONTEND_UP == 'true'
        working-directory: tests/e2e
        env:
          E2E_BASE_URL:      http://${{ env.VPS_HOST }}:3002
          E2E_API_URL:       ${{ env.E2E_API_URL }}
          E2E_USER_EMAIL:    ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          CI: 'true'
        run: |
          npx playwright test full-flow-visual.spec.ts \
            --config=playwright.config.visual.ts \
            --project=chromium
        continue-on-error: true

      # Vídeos ficam apenas como GitHub artifact (upload-artifact acima)
      # Não são enviados à VPS — VPS serve somente o dashboard e apps

      - name: Gerar player HTML e ZIP de videos
        if: always()
        env:
          VPS_HOST:   ${{ env.VPS_HOST }}
          VPS_DOMAIN: ${{ env.VPS_DOMAIN }}
          GH_RUN:     ${{ github.run_number }}
        run: |
          python3 - <<'PYEOF'
          import os, json, glob, re, shutil, zipfile
          from datetime import datetime

          vps_domain = os.environ.get('VPS_DOMAIN', 'comprai.2.25.122.11.nip.io')
          folder     = 'videos_latest'   # nome fixo — cada run sobrescreve
          base_url   = f'https://{vps_domain}/opswatch/results/e2e-v2/downloads/'

          webm_files = sorted(glob.glob('tests/e2e/test-results-visual/**/video.webm', recursive=True))

          os.makedirs('e2e-v2-output', exist_ok=True)

          # --- LOG: diagnóstico ---
          print(f"[VIDEO] Buscando .webm em tests/e2e/test-results-visual/")
          visual_dir = 'tests/e2e/test-results-visual'
          if os.path.isdir(visual_dir):
            all_files = []
            for root, dirs, files in os.walk(visual_dir):
              for f in files:
                all_files.append(os.path.join(root, f))
            print(f"[VIDEO] Arquivos encontrados em test-results-visual: {len(all_files)}")
            for f in all_files[:20]:
              print(f"[VIDEO]   {f}")
          else:
            print(f"[VIDEO] AVISO: diretorio {visual_dir} nao existe — testes visuais nao geraram resultados")
          print(f"[VIDEO] .webm encontrados: {len(webm_files)}")
          for w in webm_files:
            print(f"[VIDEO]   {w}")
          # --- fim LOG ---

          if not webm_files:
            print("[VIDEO] Nenhum video encontrado — testes visuais nao rodaram ou frontend estava fora.")
            with open('e2e-v2-output/videos_info.json', 'w') as f:
              json.dump({}, f)
            exit(0)

          player_dir = f'e2e-v2-output/downloads/{folder}'
          os.makedirs(f'{player_dir}/videos', exist_ok=True)

          playlist = []
          for i, webm_path in enumerate(webm_files, 1):
            parent = os.path.basename(os.path.dirname(webm_path))
            name = re.sub(r'-[0-9a-f]{5,}(-\d+)?$', '', parent)
            name = re.sub(r'-chromium$', '', name)
            name = name.replace('-', ' ').strip()
            if not name:
              name = f'Cena {i:02d}'
            out_name = f'{i:03d}.webm'
            shutil.copy2(webm_path, f'{player_dir}/videos/{out_name}')
            playlist.append({'src': f'videos/{out_name}', 'name': name})
            print(f'  [{i:03d}] {name}')

          n = len(playlist)
          # Categorias de cenas visuais (por número da cena)
          VISUAL_CAT_MAP = {
            '01': 'Autenticação', '02': 'IA / Chat',  '03': 'Busca',
            '04': 'Carrinho',     '05': 'Checkout',    '06': 'Pagamento',
            '07': 'Pedidos',      '08': 'Conta',
          }
          def get_visual_cat(name):
            m = re.search(r'\b(0[1-8])\b', name)
            return VISUAL_CAT_MAP.get(m.group(1), 'Outros') if m else 'Outros'

          # Categorias de testes de API (T01-T31) — mesma lógica do report
          def get_api_cat(title):
            m2 = re.match(r'[Tt](\d+)', title)
            if not m2: return 'Outros'
            n2 = int(m2.group(1))
            if n2 <= 2:  return 'Healthcheck'
            if n2 <= 4:  return 'Cadastro'
            if n2 <= 9:  return 'Autenticação'
            if n2 <= 12: return 'Busca'
            if n2 <= 17: return 'Carrinho'
            if n2 <= 20: return 'Checkout'
            if n2 <= 23: return 'Pagamento'
            if n2 <= 27: return 'Pedidos'
            return 'Fluxo E2E'

          # Carrega resultados dos testes de API
          api_tests = []
          def _collect_api_specs(node):
            """Coleta specs recursivamente (suites aninhadas via test.describe)."""
            specs = []
            for spec in node.get('specs', []):
              specs.append(spec)
            for sub in node.get('suites', []):
              specs.extend(_collect_api_specs(sub))
            return specs

          def _spec_status(spec):
            """Lê status real do spec a partir de tests[].results[].status."""
            for result in spec.get('tests', []):
              for attempt in result.get('results', []):
                st = attempt.get('status', '')
                if st in ('failed', 'timedOut'):
                  return 'failed'
                if st == 'skipped':
                  return 'skipped'
                if st in ('passed', 'expected'):
                  return 'passed'
            return 'unknown'

          try:
            with open('tests/e2e/playwright-results.json', 'r') as f:
              pr = json.load(f)
            for suite in pr.get('suites', []):
              for spec in _collect_api_specs(suite):
                api_tests.append({
                  'title':  spec.get('title', ''),
                  'status': _spec_status(spec),
                })
            print(f'[VIDEO] API tests carregados: {len(api_tests)}')
          except Exception as e:
            print(f'[VIDEO] Aviso: playwright-results.json nao disponivel: {e}')

          # ── Array unificado ALL[] — API tests (sem vídeo) + visuais (com vídeo) ─────
          ALL = []  # {name, src|None, status, cat, hasVideo}

          # 1. Testes de API (T01–T31) — sem vídeo
          for t in api_tests:
            ALL.append({
              'name':     t['title'],
              'src':      None,
              'status':   t['status'],
              'cat':      get_api_cat(t['title']),
              'hasVideo': False,
            })

          # 2. Cenas visuais — com vídeo
          for item in playlist:
            ALL.append({
              'name':     item['name'],
              'src':      item['src'],
              'status':   'visual',
              'cat':      get_visual_cat(item['name']),
              'hasVideo': True,
            })

          ALL_json    = json.dumps(ALL, ensure_ascii=False)
          api_count   = len(api_tests)
          total_items = len(ALL)
          header_lbl  = f'{api_count} API + {n} visuais' if api_tests else f'{n} cenas'

          # ── Cards de categoria no topo (filtro por categoria) ─────────────────────
          CAT_ORDER  = ['Healthcheck','Cadastro','Autenticação','Busca','Carrinho','Checkout','Pagamento','Pedidos','Fluxo E2E','Autenticação','IA / Chat','Outros']
          CAT_COLORS = {
            'Healthcheck':'#38bdf8','Cadastro':'#06b6d4','Autenticação':'#a78bfa',
            'Busca':'#34d399','Carrinho':'#f59e0b','Checkout':'#fb923c',
            'Pagamento':'#22c55e','Pedidos':'#818cf8','Fluxo E2E':'#f472b6',
            'IA / Chat':'#e879f9','Outros':'#94a3b8',
          }
          cat_counts = {}
          for item in ALL:
            cat_counts[item['cat']] = cat_counts.get(item['cat'], 0) + 1

          cat_cards_html = '<div id="cat-cards" style="display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid #0f172a;background:#162032;flex-shrink:0">'
          # Card "Todos"
          cat_cards_html += f'<div class="ccard active" onclick="filterCat(null,this)" id="ccard-all" title="Todos" style="--cc:#94a3b8">Todos <span class="cc-cnt">{total_items}</span></div>'
          seen_cats = []
          for item in ALL:
            if item['cat'] not in seen_cats:
              seen_cats.append(item['cat'])
          for cat in seen_cats:
            col   = CAT_COLORS.get(cat, '#94a3b8')
            cnt   = cat_counts.get(cat, 0)
            cid   = 'ccard-' + re.sub(r'[^a-z0-9]', '', cat.lower())
            cat_cards_html += f'<div class="ccard" onclick="filterCat(\'{cat}\',this)" id="{cid}" title="Filtrar: {cat}" style="--cc:{col}">{cat} <span class="cc-cnt">{cnt}</span></div>'
          cat_cards_html += '</div>'

          # ── Sidebar: itens agrupados por categoria ────────────────────────────────
          items_html = ''
          # Seção API
          if api_tests:
            api_by_cat = {}; api_cat_order = []
            for gi, item in enumerate(ALL):
              if item['hasVideo']: continue
              cat = item['cat']
              if cat not in api_by_cat:
                api_by_cat[cat] = []; api_cat_order.append(cat)
              api_by_cat[cat].append((gi, item))
            items_html += '<div class="ph">&#128203; Testes de API</div>\n'
            for ci, cat in enumerate(api_cat_order):
              col = CAT_COLORS.get(cat, '#94a3b8')
              items_html += f'<div class="ph-cat" onclick="toggleCat(this)" data-cat="ac{ci}"><span class="ch">&#9660;</span><span style="color:{col}">{cat}</span></div>\n'
              items_html += f'<div class="cat-items" id="ac{ci}">\n'
              for gi, item in api_by_cat[cat]:
                st  = item['status']
                ic  = '✅' if st == 'passed' else '❌' if st == 'failed' else '⏭'
                col2 = '#22c55e' if st == 'passed' else '#ef4444' if st == 'failed' else '#f59e0b'
                items_html += (
                  f'<div class="pi api-item" data-cat="{item["cat"]}" onclick="play({gi})" id="pi{gi}">'
                  f'<span style="font-size:11px">{ic}</span>'
                  f'<span class="pn" style="color:{col2}">{item["name"]}</span>'
                  f'</div>\n'
                )
              items_html += '</div>\n'

          # Seção Visual
          vis_by_cat = {}; vis_cat_order2 = []
          for gi, item in enumerate(ALL):
            if not item['hasVideo']: continue
            cat = item['cat']
            if cat not in vis_by_cat:
              vis_by_cat[cat] = []; vis_cat_order2.append(cat)
            vis_by_cat[cat].append((gi, item))
          if vis_by_cat:
            items_html += '<div class="ph">&#127916; Cenas Visuais</div>\n'
            for ci, cat in enumerate(vis_cat_order2):
              col = CAT_COLORS.get(cat, '#94a3b8')
              items_html += f'<div class="ph-cat" onclick="toggleCat(this)" data-cat="vc{ci}"><span class="ch">&#9660;</span><span style="color:{col}">{cat}</span></div>\n'
              items_html += f'<div class="cat-items" id="vc{ci}">\n'
              for gi, item in vis_by_cat[cat]:
                local_idx = gi - api_count
                items_html += (
                  f'<div class="pi" data-cat="{item["cat"]}" onclick="play({gi})" id="pi{gi}">'
                  f'<span class="pn"><span class="idx">{local_idx+1:03d}</span> {item["name"]}</span>'
                  f'<a class="dl" href="{item["src"]}" download onclick="event.stopPropagation()">&#11123;</a>'
                  f'</div>\n'
                )
              items_html += '</div>\n'

          player_html = (
            '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">'
            '<meta name="viewport" content="width=device-width,initial-scale=1">'
            '<title>E2E Videos</title>'
            '<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,sans-serif;display:flex;height:100vh;overflow:hidden}'
            '#player{flex:1;display:flex;flex-direction:column;padding:14px;gap:8px;overflow:hidden;min-width:0}'
            '#controls{display:flex;gap:8px;align-items:center;flex-shrink:0;padding-bottom:6px;border-bottom:1px solid #1e293b}'
            '.btn{padding:5px 13px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit}'
            '.btn:hover{background:#334155;color:#e2e8f0}.btn.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}'
            '#lbl{font-size:13px;color:#94a3b8;padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}'
            '#lbl b{color:#f1f5f9}#lbl em{color:#475569;font-style:normal;font-size:11px;margin-left:10px}'
            '#stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}'
            '#vid{flex:1;min-height:0;width:100%;border-radius:8px;background:#000;object-fit:contain;display:none}'
            '#result-panel{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:14px;border-radius:8px;background:#0c1525;border:1px solid #1e293b;padding:24px}'
            '#result-panel .rp-icon{font-size:48px}'
            '#result-panel .rp-title{font-size:15px;font-weight:700;color:#e2e8f0}'
            '#result-panel .rp-status{font-size:12px;padding:4px 14px;border-radius:20px;font-weight:600}'
            '#novid{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#475569;font-size:14px;border-radius:8px;background:#0f172a;border:1px dashed #334155}'
            '#playlist{width:310px;background:#1e293b;overflow-y:auto;border-left:1px solid #334155;flex-shrink:0;display:flex;flex-direction:column}'
            '.ccard{padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.1);font-size:10px;font-weight:600;cursor:pointer;color:#94a3b8;transition:all .15s;white-space:nowrap}'
            '.ccard:hover{border-color:var(--cc);color:var(--cc)}'
            '.ccard.active{background:var(--cc);border-color:var(--cc);color:#0f172a}'
            '.cc-cnt{font-size:9px;opacity:.7}'
            '.ph{padding:9px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#475569;border-bottom:1px solid #0f172a;position:sticky;top:0;background:#1e293b;z-index:2}'
            '.ph-cat{padding:6px 12px;font-size:10px;font-weight:600;letter-spacing:.04em;color:#64748b;background:#172033;border-bottom:1px solid #0f172a;cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none;transition:background .12s}'
            '.ph-cat:hover{background:#1e2d44;color:#94a3b8}'
            '.ch{font-size:9px;transition:transform .2s;display:inline-block;width:10px;text-align:center;flex-shrink:0}'
            '.ph-cat.collapsed .ch{transform:rotate(-90deg)}'
            '.cat-items{display:block}.cat-items.hidden{display:none}'
            '.pi{padding:8px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;color:#94a3b8;transition:background .12s;display:flex;align-items:center;gap:6px}'
            '.pi:hover{background:#334155;color:#e2e8f0}.pi.active{background:#1d4ed8;color:#fff !important}'
            '.pi.active .pn{color:#fff !important}'
            '.pn{flex:1;line-height:1.35}.idx{font-size:10px;opacity:.45;margin-right:4px}'
            '.dl{padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.06);color:#475569;text-decoration:none;font-size:11px;transition:all .12s;flex-shrink:0;line-height:1.6}'
            '.dl:hover{background:#334155;color:#94a3b8}'
            '@media(max-width:640px){body{flex-direction:column}#playlist{width:100%;height:45vh;max-height:45vh;border-left:none;border-top:1px solid #334155;flex-shrink:0}#player{flex:none;height:55vh}}'
            '</style></head><body>'
            '<div id="player">'
            '<div id="controls">'
            '<button class="btn" id="btnAll" onclick="startAll(this)">&#9654; Todos</button>'
            '<button class="btn" id="btn1x1" onclick="start1x1(this)">&#9654; Um por um</button>'
            '<button class="btn" id="btnNext" onclick="playNext()" style="display:none">&#9654;&#9654; Pr&#243;ximo</button>'
            '</div>'
            '<div id="lbl">&#9654; <b id="ln">Selecione um item</b><em id="prog"></em></div>'
            '<div id="stage">'
            '<video id="vid" controls></video>'
            '<div id="tap-overlay" onclick="tapPlay()" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.72);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;z-index:10">'
            '<div style="width:72px;height:72px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:32px">&#9654;</div>'
            '<span style="color:#e2e8f0;font-size:14px;font-weight:600">Toque para assistir</span>'
            '</div>'
