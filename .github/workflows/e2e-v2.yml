            # filterCat: filtra sidebar por categoria
            'function filterCat(cat,el){'
            'activeCat=cat;'
            'document.querySelectorAll(".ccard").forEach(function(c){c.classList.remove("active");});'
            'el.classList.add("active");'
            'document.querySelectorAll(".pi").forEach(function(r){'
            'var show=!cat||r.getAttribute("data-cat")===cat;'
            'r.style.display=show?"":"none";});'
            # só interrompe e salta para primeiro se não estiver em modo Todos
            'if(!autoAdv){'
            'clearTimeout(autoTimer);'
            'var first=ALL.findIndex(function(x){return !cat||x.cat===cat;});'
            'if(first>=0)play(first);}}'

            # onended: vídeo terminou → avança para próximo
            'vid.onended=function(){'
            'console.log("[onended] idx="+idx+" autoAdv="+autoAdv+" src="+vid.src);'
            'if(!autoAdv)return;'
            'var n=nextVisible(idx);'
            'console.log("[onended] nextVisible="+n);'
            'if(n>=0){tapOv.style.display="none";play(n);}' # direto — sem setTimeout para preservar user gesture chain no mobile
            '};'
            'vid.onerror=function(e){'
            # ignora erros quando não há src real (API test, estado limpo)
            'var s=vid.getAttribute("src");'
            'if(!s||s===""||vid.src===window.location.href){console.log("[onerror] ignorado — sem src real");return;}'
            'console.error("[onerror] idx="+idx+" src="+vid.src,e);'
            'vid.style.display="none";novid.style.display="flex";rp.style.display="none";'
            'if(autoAdv){var n=nextVisible(idx);if(n>=0)play(n);}'
            '};'
            'vid.oncanplay=function(){console.log("[oncanplay] src="+vid.src+" dur="+vid.duration+" w="+vid.offsetWidth+" h="+vid.offsetHeight+" paused="+vid.paused);};'
            'vid.onplay=function(){console.log("[onplay] src="+vid.src+" currentTime="+vid.currentTime);};'
            'vid.onpause=function(){console.log("[onpause] src="+vid.src+" currentTime="+vid.currentTime+" ended="+vid.ended);};'
            'vid.ontimeupdate=function(){if(vid.duration&&vid.currentTime>vid.duration-0.5)console.log("[timeupdate] perto do fim: "+vid.currentTime+"/"+vid.duration);};'
            'vid.onstalled=function(){console.warn("[onstalled] src="+vid.src);};'

            # init: seleciona primeiro visual automaticamente
            'console.log("[init] ALL.length="+ALL.length+" ALL[0]=",ALL[0]);'
            'var firstVis=ALL.findIndex(function(x){return !!(x.src);});'
            'console.log("[init] firstVis="+firstVis+" (sem autoplay no init)");'
            '</script></body></html>'
          )

          with open(f'{player_dir}/index.html', 'w', encoding='utf-8') as f:
            f.write(player_html)
          print(f'index.html gerado: {api_count} API + {n} cenas visuais')

          zip_name = 'videos_latest.zip'
          zip_path = f'e2e-v2-output/downloads/{zip_name}'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
            for root, dirs, files in os.walk(player_dir):
              for file in files:
                fp  = os.path.join(root, file)
                arc = os.path.relpath(fp, f'e2e-v2-output/downloads')
                zf.write(fp, arc)
          print(f'ZIP criado: {zip_name}')

          info = {
            'videos_zip':    base_url + zip_name,
            'videos_player': base_url + folder + '/index.html',
            'videos_folder': folder,
            'videos_count':  n,
          }
          with open('e2e-v2-output/videos_info.json', 'w') as f:
            json.dump(info, f)
          print(f'videos_info.json gravado: {info["videos_player"]}')
          PYEOF
        continue-on-error: true

      - name: Patch latest.json com URLs de video
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os

          info_path   = 'e2e-v2-output/videos_info.json'
          latest_path = 'e2e-v2-output/latest.json'

          print(f"[PATCH] info_path={info_path} exists={os.path.isfile(info_path)}")
          print(f"[PATCH] latest_path={latest_path} exists={os.path.isfile(latest_path)}")
          if not os.path.isfile(info_path) or not os.path.isfile(latest_path):
            print("[PATCH] videos_info.json ou latest.json nao encontrado — patch ignorado")
            exit(0)

          with open(info_path) as f:
            info = json.load(f)
          print(f"[PATCH] videos_info.json conteudo: {info}")

          if not info:
            print("[PATCH] Sem videos — latest.json nao alterado (videos_player/zip nao serao definidos)")
            exit(0)

          with open(latest_path) as f:
            latest = json.load(f)

          latest['videos_zip']    = info.get('videos_zip')
          latest['videos_player'] = info.get('videos_player')
          latest['videos_count']  = info.get('videos_count', 0)

          with open(latest_path, 'w') as f:
            json.dump(latest, f, ensure_ascii=False, indent=2)

          print(f"latest.json patchado: videos_player={latest['videos_player']}")
          PYEOF
        continue-on-error: true

      # ── Artefatos e publicação na VPS ─────────────────────────────────────

      - name: Upload artefato Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-v2-report-${{ github.run_number }}
          path: |
            tests/e2e/playwright-results.json
            tests/e2e/test-results/
            tests/e2e/test-results-visual/
          retention-days: 30

      - name: Criar diretorios na VPS
        uses: appleboy/ssh-action@v1.2.0
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            mkdir -p /var/www/html/opswatch/results/e2e-v2
            mkdir -p /var/www/html/opswatch/results/e2e-v2/downloads
            # Garante MIME type correto para .webm (necessário para reprodução no browser)
            if ! grep -q "video/webm" /etc/nginx/mime.types 2>/dev/null; then
              sed -i '/video\/mp4/a\    video/webm                            webm;' /etc/nginx/mime.types
              nginx -t && systemctl reload nginx || true
            fi
        continue-on-error: true

      - name: Publicar latest.json na VPS
        uses: appleboy/scp-action@v0.1.7
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "e2e-v2-output/latest.json"
          target: "/var/www/html/opswatch/results/e2e-v2/"
          strip_components: 1
          overwrite: true
        continue-on-error: true

      - name: Publicar report.html na VPS
        uses: appleboy/scp-action@v0.1.7
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "e2e-v2-output/report.html"
          target: "/var/www/html/opswatch/results/e2e-v2/"
          strip_components: 1
          overwrite: true
        continue-on-error: true

      - name: Verificar downloads antes do SCP
        if: always()
        run: |
          echo "[SCP-VIDEO] Verificando e2e-v2-output/downloads/"
          if [ -d "e2e-v2-output/downloads" ]; then
            echo "[SCP-VIDEO] Diretorio existe. Conteudo:"
            find e2e-v2-output/downloads -type f | head -30
          else
            echo "[SCP-VIDEO] AVISO: e2e-v2-output/downloads NAO EXISTE — nenhum video foi gerado nesta run."
          fi
        continue-on-error: true

      - name: Publicar videos na VPS
        uses: appleboy/scp-action@v0.1.7
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          source: "e2e-v2-output/downloads"
          target: "/var/www/html/opswatch/results/e2e-v2/"
          strip_components: 1
          overwrite: true
        continue-on-error: true

      - name: Corrigir permissoes e verificar videos na VPS
        uses: appleboy/ssh-action@v1.2.0
        if: always()
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_HOSTINGER_SSH_KEY }}
          script: |
            set -x
            echo "[VPS] === corrigir permissoes ==="
            ls -la /var/www/html/opswatch/results/e2e-v2/ 2>&1 | head -10 || true
            ls -la /var/www/html/opswatch/results/e2e-v2/downloads/ 2>&1 | head -10 || true
            chmod -R a+rX /var/www/html/opswatch/results/e2e-v2/downloads/ || true
            find /var/www/html/opswatch/results/e2e-v2/downloads -name "index.html" 2>&1 | head -5 || true
            echo "[VPS] === garantir MIME type video/webm no nginx ==="
            if ! grep -q 'video/webm' /etc/nginx/mime.types 2>/dev/null; then
              sed -i '/video\/mp4/a\    video\/webm                           webm;' /etc/nginx/mime.types 2>/dev/null || true
              nginx -s reload 2>/dev/null || true
              echo "[VPS] MIME webm adicionado e nginx recarregado"
            else
              echo "[VPS] MIME webm ja configurado"
            fi
            echo "[VPS] curl test index.html:"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost/opswatch/results/e2e-v2/downloads/videos_latest/index.html 2>&1 || echo "curl falhou"
            echo "[VPS] curl test video sample:"
            curl -s -o /dev/null -w "HTTP %{http_code} CT:%{content_type}\n" http://localhost/opswatch/results/e2e-v2/downloads/videos_latest/videos/001.webm 2>&1 || echo "video curl falhou"
        continue-on-error: true

