name: K6 Stress Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Tipo de teste'
        required: true
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - soak
        default: smoke
      target_url:
        description: 'URL alvo (default: VPS de produção)'
        required: false
        default: 'http://2.25.122.11:5020'
      vus:
        description: 'Número de VUs (override — deixe vazio para usar o padrão do script)'
        required: false
        default: ''
      duration:
        description: 'Duração (ex: 5m, 30m — override — deixe vazio para usar o padrão do script)'
        required: false
        default: ''

concurrency:
  group: stress-tests
  cancel-in-progress: false

jobs:
  k6-test:
    name: K6 — ${{ github.event.inputs.test_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache K6
        id: cache-k6
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/k6
          key: k6-v0.53.0-linux-amd64

      - name: Instalar K6
        if: steps.cache-k6.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/grafana/k6/releases/download/v0.53.0/k6-v0.53.0-linux-amd64.tar.gz \
            -O /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-v0.53.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Criar diretório de resultados
        run: mkdir -p k6/results

      - name: Executar K6 — ${{ github.event.inputs.test_type }}
        id: k6run
        continue-on-error: true
        env:
          TARGET_URL:        ${{ github.event.inputs.target_url }}
          VUS_OVERRIDE:      ${{ github.event.inputs.vus }}
          PEAK_VUS:          ${{ github.event.inputs.vus }}
          DURATION_OVERRIDE: ${{ github.event.inputs.duration }}
        run: |
          k6 run \
            --out json=k6/results/raw.json \
            k6/scripts/${{ github.event.inputs.test_type }}.js

      - name: Gerar dashboard HTML
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, re, os, sys
          from pathlib import Path
          from collections import defaultdict

          TEST_TYPE   = os.environ.get('TEST_TYPE', '')
          TARGET_URL  = os.environ.get('TARGET_URL', '')
          RUN_NUMBER  = os.environ.get('RUN_NUMBER', '')
          RUN_DATE    = os.environ.get('RUN_DATE', '')

          summary_path  = Path('k6/results/summary.json')
          raw_path      = Path('k6/results/raw.json')
          template_path = Path('k6/dashboard/index.html')
          output_path   = Path('k6/results/dashboard.html')

          if not template_path.exists():
              print('Template não encontrado; abortando geração do dashboard.')
              sys.exit(0)

          kpis = {}
          thresholds = []

          if summary_path.exists():
              try:
                  s = json.loads(summary_path.read_text())
                  dur = s.get('metrics', {}).get('http_req_duration', {})
                  vals = dur.get('values', {})
                  kpis['p50']            = round(vals.get('med',   0), 2)
                  kpis['p95']            = round(vals.get('p(95)', 0), 2)
                  kpis['p99']            = round(vals.get('p(99)', 0), 2)
                  kpis['avg']            = round(vals.get('avg',   0), 2)
                  reqs = s.get('metrics', {}).get('http_reqs', {}).get('values', {})
                  kpis['rps']            = round(reqs.get('rate', 0), 2)
                  kpis['total_requests'] = int(reqs.get('count', 0))
                  errs = s.get('metrics', {}).get('http_req_failed', {}).get('values', {})
                  kpis['error_rate']     = round(errs.get('rate', 0), 4)
                  for metric_name, metric_data in s.get('metrics', {}).items():
                      for cond, passed in metric_data.get('thresholds', {}).items():
                          actual = None
                          mv = metric_data.get('values', {})
                          m = re.match(r'p\((\d+)\)', cond.split('<')[0].split('>')[0].strip())
                          if m:
                              actual = round(mv.get(f'p({m.group(1)})', 0), 2)
                          elif 'rate' in cond:
                              actual = round(mv.get('rate', 0), 4)
                          elif 'avg' in cond:
                              actual = round(mv.get('avg', 0), 2)
                          ok = passed if isinstance(passed, bool) else passed.get('ok', False)
                          thresholds.append({'metric': metric_name,'condition': cond,'actual': actual,'passed': ok})
              except Exception as e:
                  print(f'Aviso: falha ao processar summary.json: {e}')

          ts_rt  = defaultdict(list)
          ts_vus = {}
          ts_rps = defaultdict(int)

          if raw_path.exists():
              try:
                  with raw_path.open() as f:
                      for line in f:
                          line = line.strip()
                          if not line: continue
                          try: obj = json.loads(line)
                          except json.JSONDecodeError: continue
                          if obj.get('type') != 'Point': continue
                          data   = obj.get('data', {})
                          metric = obj.get('metric', '')
                          t_str  = data.get('time', '')
                          val    = data.get('value')
                          if not t_str or val is None: continue
                          try:
                              from datetime import datetime, timezone
                              dt = datetime.fromisoformat(t_str.replace('Z', '+00:00'))
                              ts_key = int(dt.timestamp())
                          except Exception: continue
                          if metric == 'http_req_duration': ts_rt[ts_key].append(val)
                          elif metric == 'vus': ts_vus[ts_key] = val
                          elif metric == 'http_reqs': ts_rps[ts_key] += 1
              except Exception as e:
                  print(f'Aviso: falha ao processar raw.json: {e}')

          all_keys = sorted(set(list(ts_rt.keys()) + list(ts_vus.keys()) + list(ts_rps.keys())))
          MAX_POINTS = 300
          if len(all_keys) > MAX_POINTS:
              step = len(all_keys) // MAX_POINTS
              all_keys = all_keys[::step]
          if all_keys:
              t0 = all_keys[0]
              labels = [str(k - t0) + 's' for k in all_keys]
              p95_series = [round(sorted(ts_rt.get(k, [0]))[int(len(ts_rt.get(k, [0])) * 0.95)] if ts_rt.get(k) else 0, 2) for k in all_keys]
              avg_series = [round(sum(ts_rt.get(k, [0])) / max(len(ts_rt.get(k, [0])), 1), 2) for k in all_keys]
              vus_series = [ts_vus.get(k, 0) for k in all_keys]
              rps_series = [ts_rps.get(k, 0) for k in all_keys]
          else:
              labels = []
              p95_series = avg_series = vus_series = rps_series = []

          dashboard_data = {
              'meta': {'test_type': TEST_TYPE,'target_url': TARGET_URL,'run_number': RUN_NUMBER,'run_date': RUN_DATE},
              'kpis': kpis,
              'thresholds': thresholds,
              'timeseries': {'labels': labels,'p95': p95_series,'avg': avg_series,'vus': vus_series,'rps': rps_series}
          }
          template = template_path.read_text(encoding='utf-8')
          data_json = json.dumps(dashboard_data, ensure_ascii=False)
          result = template.replace('__DASHBOARD_DATA__', data_json)
          output_path.write_text(result, encoding='utf-8')
          print(f'Dashboard gerado em {output_path}')
          PYEOF
        env:
          TEST_TYPE:  ${{ github.event.inputs.test_type }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_DATE:   ${{ github.event.repository.updated_at || 'N/A' }}

      - name: Publicar resumo no Job Summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path

          summary_path = Path('k6/results/summary.json')
          test_type    = os.environ.get('TEST_TYPE', '?')
          target_url   = os.environ.get('TARGET_URL', '?')
          run_number   = os.environ.get('RUN_NUMBER', '?')
          vus_input    = os.environ.get('VUS_INPUT', '').strip()
          dur_input    = os.environ.get('DURATION_INPUT', '').strip()

          default_vus = {'smoke': '3', 'load': '100', 'stress': '400', 'spike': '200', 'soak': '50'}
          vus_display = vus_input if vus_input else f'{default_vus.get(test_type, "?")} (padrão)'
          dur_display = dur_input if dur_input else 'padrão do script'

          summary_md  = f'## 📊 Resultado {test_type.upper()} Test — Run #{run_number}\n\n'
          summary_md += '| Parâmetro | Valor |\n|-----------|-------|\n'
          summary_md += f'| Tipo | `{test_type}` |\n'
          summary_md += f'| URL alvo | `{target_url}` |\n'
          summary_md += f'| VUs pico | `{vus_display}` |\n'
          summary_md += f'| Duração | `{dur_display}` |\n\n'

          if summary_path.exists():
              try:
                  s = json.loads(summary_path.read_text())
                  dur  = s.get('metrics', {}).get('http_req_duration', {}).get('values', {})
                  reqs = s.get('metrics', {}).get('http_reqs',         {}).get('values', {})
                  errs = s.get('metrics', {}).get('http_req_failed',   {}).get('values', {})
                  p50 = dur.get('med', 0); p95 = dur.get('p(95)', 0); p99 = dur.get('p(99)', 0); avg = dur.get('avg', 0)
                  rps = reqs.get('rate', 0); tot = int(reqs.get('count', 0)); err = errs.get('rate', 0) * 100
                  summary_md += ('### Métricas\n\n| Métrica | Valor |\n|---------|-------|\n'
                      f'| p50     | {p50:.1f} ms |\n'
                      f'| p95     | {p95:.1f} ms |\n'
                      f'| p99     | {p99:.1f} ms |\n'
                      f'| avg     | {avg:.1f} ms |\n'
                      f'| Req/s   | {rps:.2f} |\n'
                      f'| Total   | {tot:,} |\n'
                      f'| Erro %  | {err:.2f}% |\n\n')
                  thresholds_rows = []
                  for mn, md in s.get('metrics', {}).items():
                      for cond, passed in md.get('thresholds', {}).items():
                          ok = passed if isinstance(passed, bool) else passed.get('ok', False)
                          icon = '✅' if ok else '❌'
                          thresholds_rows.append(f'| {mn} | `{cond}` | {icon} |')
                  if thresholds_rows:
                      summary_md += '### Thresholds\n\n| Métrica | Condição | Status |\n|---------|---------|--------|\n'
                      summary_md += '\n'.join(thresholds_rows) + '\n'
              except Exception as e:
                  summary_md += f'> ⚠️ Falha ao processar resultados: {e}\n'
          else:
              summary_md += '> ⚠️ `summary.json` não encontrado — K6 pode ter falhado antes de gerar resultados.\n'

          artifact_name = f'k6-{test_type}-run{run_number}'
          summary_md += (f'\n---\n### 📊 Como ver o dashboard completo\n\n'
              f'1. Role até o final desta página — seção **Artifacts**\n'
              f'2. Clique em **`{artifact_name}`** para baixar o zip\n'
              f'3. Extraia e abra **`dashboard.html`** no browser\n\n'
              f'> Os gráficos mostram latência p95/avg, VUs e Req/s ao longo do tempo.\n')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary_md)
          PYEOF
        env:
          TEST_TYPE:      ${{ github.event.inputs.test_type }}
          TARGET_URL:     ${{ github.event.inputs.target_url }}
          RUN_NUMBER:     ${{ github.run_number }}
          VUS_INPUT:      ${{ github.event.inputs.vus }}
          DURATION_INPUT: ${{ github.event.inputs.duration }}

      - name: Upload artefatos K6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ github.event.inputs.test_type }}-run${{ github.run_number }}
          path: k6/results/
          retention-days: 30

      - name: Falhar se K6 reprovou
        if: steps.k6run.outcome == 'failure'
        run: |
          echo "::error::K6 falhou — algum threshold foi violado ou o teste terminou com erro."
          exit 1
