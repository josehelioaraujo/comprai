name: Stress Test - k6
run-name: Resultado Stress Test — ${{ github.event.inputs.test_type }}

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Tipo de teste'
        required: true
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - soak
          - all
        default: smoke
      target_url:
        description: 'URL alvo (default: VPS de produÃ§Ã£o)'
        required: false
        default: 'http://2.25.122.11:5020'
      vus:
        description: 'NÃºmero de VUs (override â deixe vazio para usar o padrÃ£o do script)'
        required: false
        default: ''
      duration:
        description: 'DuraÃ§Ã£o (ex: 5m, 30m â override â deixe vazio para usar o padrÃ£o do script)'
        required: false
        default: ''

concurrency:
  group: stress-tests
  cancel-in-progress: false

jobs:
  k6-test:
    name: Resultados Stress Test â ${{ github.event.inputs.test_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache K6
        id: cache-k6
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/k6
          key: k6-v0.53.0-linux-amd64

      - name: Instalar K6
        if: steps.cache-k6.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/grafana/k6/releases/download/v0.53.0/k6-v0.53.0-linux-amd64.tar.gz \
            -O /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-v0.53.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Criar diretÃ³rios de resultados
        run: mkdir -p k6/results/smoke k6/results/load k6/results/stress k6/results/spike k6/results/soak

      - name: "ðµ Smoke â ramp 3 VUs / 40s"
        id: smoke_run
        if: github.event.inputs.test_type == 'smoke' || github.event.inputs.test_type == 'all'
        continue-on-error: true
        env:
          TARGET_URL:        ${{ github.event.inputs.target_url }}
          VUS_OVERRIDE:      ${{ github.event.inputs.vus }}
          DURATION_OVERRIDE: ${{ github.event.inputs.duration }}
          RESULTS_DIR:       k6/results/smoke
        run: |
          k6 run --out json=k6/results/smoke/raw.json k6/scripts/smoke.js

      - name: "ð¢ Load â ramp 100 VUs / ~3min"
        id: load_run
        if: github.event.inputs.test_type == 'load' || github.event.inputs.test_type == 'all'
        continue-on-error: true
        env:
          TARGET_URL:        ${{ github.event.inputs.target_url }}
          VUS_OVERRIDE:      ${{ github.event.inputs.vus }}
          DURATION_OVERRIDE: ${{ github.event.inputs.duration }}
          RESULTS_DIR:       k6/results/load
        run: |
          k6 run --out json=k6/results/load/raw.json k6/scripts/load.js

      - name: "ð¡ Stress â ramp 400 VUs / ~8.5min"
        id: stress_run
        if: github.event.inputs.test_type == 'stress' || github.event.inputs.test_type == 'all'
        continue-on-error: true
        env:
          TARGET_URL:        ${{ github.event.inputs.target_url }}
          VUS_OVERRIDE:      ${{ github.event.inputs.vus }}
          PEAK_VUS:          ${{ github.event.inputs.vus }}
          DURATION_OVERRIDE: ${{ github.event.inputs.duration }}
          RESULTS_DIR:       k6/results/stress
        run: |
          k6 run --out json=k6/results/stress/raw.json k6/scripts/stress.js

      - name: "ð´ Spike â 200 VUs / ~80s"
        id: spike_run
        if: github.event.inputs.test_type == 'spike' || github.event.inputs.test_type == 'all'
        continue-on-error: true
        env:
          TARGET_URL:        ${{ github.event.inputs.target_url }}
          VUS_OVERRIDE:      ${{ github.event.inputs.vus }}
          DURATION_OVERRIDE: ${{ github.event.inputs.duration }}
          RESULTS_DIR:       k6/results/spike
        run: |
          k6 run --out json=k6/results/spike/raw.json k6/scripts/spike.js

      - name: "ð£ Soak â 50 VUs / ~4min"
        id: soak_run
        if: github.event.inputs.test_type == 'soak' || github.event.inputs.test_type == 'all'
        continue-on-error: true
        env:
          TARGET_URL:        ${{ github.event.inputs.target_url }}
          VUS_OVERRIDE:      ${{ github.event.inputs.vus }}
          DURATION_OVERRIDE: ${{ github.event.inputs.duration }}
          RESULTS_DIR:       k6/results/soak
        run: |
          k6 run --out json=k6/results/soak/raw.json k6/scripts/soak.js

      - name: Gerar dashboard HTML
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, re, os, sys
          from pathlib import Path
          from collections import defaultdict

          TEST_TYPE  = os.environ.get('TEST_TYPE', '')
          TARGET_URL = os.environ.get('TARGET_URL', '')
          RUN_NUMBER = os.environ.get('RUN_NUMBER', '')
          RUN_DATE  = os.environ.get('RUN_DATE', '')

          template_path = Path('k6/dashboard/index.html')
          if not template_path.exists():
              print('Template nÃ£o encontrado; abortando geraÃ§Ã£o do dashboard.')
              sys.exit(0)

          types_to_run = ['smoke', 'load', 'stress', 'spike', 'soak'] if TEST_TYPE == 'all' else [TEST_TYPE]

          for t in types_to_run:
              summary_path = Path(f'k6/results/{t}/summary.json')
              raw_path     = Path(f'k6/results/{t}/raw.json')
              output_path  = Path(f'k6/results/{t}/dashboard.html')
              kpis = {}
              thresholds = []
              if summary_path.exists():
                  try:
                      s = json.loads(summary_path.read_text())
                      dur  = s.get('metrics', {}).get('http_req_duration', {})
                      vals = dur.get('values', {})
                      kpis['p50']            = round(vals.get('med',   0), 2)
                      kpis['p95']            = round(vals.get('p(95)', 0), 2)
                      kpis['p99']            = round(vals.get('p(99)', 0), 2)
                      kpis['avg']            = round(vals.get('avg',   0), 2)
                      reqs = s.get('metrics', {}).get('http_reqs', {}).get('values', {})
                      kpis['rps']            = round(reqs.get('rate', 0), 2)
                      kpis['total_requests'] = int(reqs.get('count', 0))
                      errs = s.get('metrics', {}).get('http_req_failed', {}).get('values', {})
                      kpis['error_rate']     = round(errs.get('rate', 0), 4)
                      for metric_name, metric_data in s.get('metrics', {}).items():
                          for cond, passed in metric_data.get('thresholds', {}).items():
                              actual = None
                              mv = metric_data.get('values', {})
                              m = re.match(r'p\((\d+)\)', cond.split('<')[0].split('>')[0].strip())
                              if m:
                                  actual = round(mv.get(f'p({m.group(1)})', 0), 2)
                              elif 'rate' in cond:
                                  actual = round(mv.get('rate', 0), 4)
                              elif 'avg' in cond:
                                  actual = round(mv.get('avg', 0), 2)
                              ok = passed if isinstance(passed, bool) else passed.get('ok', False)
                              thresholds.append({'metric': metric_name, 'condition': cond, 'actual': actual, 'passed': ok})
                  except Exception as e:
                      print(f'Aviso [{t}]: falha ao processar summary.json: {e}')
              ts_rt  = defaultdict(list)
              ts_vus = {}
              ts_rps = defaultdict(int)
              if raw_path.exists():
                  try:
                      with raw_path.open() as f:
                          for line in f:
                              line = line.strip()
                              if not line: continue
                              try: obj = json.loads(line)
                              except json.JSONDecodeError: continue
                              if obj.get('type') != 'Point': continue
                              data   = obj.get('data', {})
                              metric = obj.get('metric', '')
                              t_str  = data.get('time', '')
                              val    = data.get('value')
                              if not t_str or val is None: continue
                              try:
                                  from datetime import datetime, timezone
                                  dt = datetime.fromisoformat(t_str.replace('Z', '+00:00'))
                                  ts_key = int(dt.timestamp())
                              except Exception: continue
                              if metric == 'http_req_duration': ts_rt[ts_key].append(val)
                              elif metric == 'vus': ts_vus[ts_key] = val
                              elif metric == 'http_reqs': ts_rps[ts_key] += 1
                  except Exception as e:
                      print(f'Aviso [{t}]: falha ao processar raw.json: {e}')
              all_keys = sorted(set(list(ts_rt.keys()) + list(ts_vus.keys()) + list(ts_rps.keys())))
              if len(all_keys) > 300:
                  step = len(all_keys) // 300; all_keys = all_keys[::step]
              if all_keys:
                  t0 = all_keys[0]
                  labels     = [str(k - t0) + 's' for k in all_keys]
                  p95_series = [round(sorted(ts_rt.get(k,[0]))[int(len(ts_rt.get(k,[0]))*0.95)] if ts_rt.get(k) else 0,2) for k in all_keys]
                  avg_series = [round(sum(ts_rt.get(k,[0]))/max(len(ts_rt.get(k,[0])),1),2) for k in all_keys]
                  vus_series = [ts_vus.get(k,0) for k in all_keys]
                  rps_series = [ts_rps.get(k,0) for k in all_keys]
              else:
                  labels = []; p95_series = avg_series = vus_series = rps_series = []
              dashboard_data = {'meta': {'test_type': t, 'target_url': TARGET_URL, 'run_number': RUN_NUMBER, 'run_date': RUN_DATE},'kpis': kpis,'thresholds': thresholds,'timeseries': {'labels': labels,'p95': p95_series,'avg': avg_series,'vus': vus_series,'rps': rps_series}}
              template = template_path.read_text(encoding='utf-8')
              result   = template.replace('__DASHBOARD_DATA__', json.dumps(dashboard_data, ensure_ascii=False))
              output_path.write_text(result, encoding='utf-8')
              print(f'Dashboard [{t}] gerado em {output_path}')
          PYEOF
        env:
          TEST_TYPE:  ${{ github.event.inputs.test_type }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_DATE:   ${{ github.event.repository.updated_at || 'N/A' }}

      - name: Publicar resumo no Job Summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path
          TEST_TYPE  = os.environ.get('TEST_TYPE', '?')
          TARGET_URL = os.environ.get('TARGET_URL', '?')
          RUN_NUMBER = os.environ.get('RUN_NUMBER', '?')
          VUS_INPUT  = os.environ.get('VUS_INPUT', '').strip()
          DUR_INPUT  = os.environ.get('DURATION_INPUT', '').strip()
          default_vus = {'smoke': '3', 'load': '100', 'stress': '400', 'spike': '200', 'soak': '50', 'all': 'padrÃ£o'}
          vus_display = VUS_INPUT if VUS_INPUT else f'{default_vus.get(TEST_TYPE, "?")} (padrÃ£o)'
          dur_display = DUR_INPUT if DUR_INPUT else 'padrÃ£o do script'
          TYPE_LABELS = {'smoke':'ðµ Smoke','load':'ð¢ Load','stress':'ð¡ Stress','spike':'ð´ Spike','soak':'ð£ Soak','all':'ðµð¢ð¡ð´ð£ All'}
          type_label = TYPE_LABELS.get(TEST_TYPE, TEST_TYPE.upper())
          out = f'## ð Resultado Stress Test â {type_label} â Run #{RUN_NUMBER}\n\n'
          out += '| ParÃ¢metro | Valor |\n|-----------|-------|\n'
          out += f'| Tipo | `{TEST_TYPE}` |\n'
          out += f'| URL alvo | `{TARGET_URL}` |\n'
          out += f'| VUs pico | `{vus_display}` |\n'
          out += f'| DuraÃ§Ã£o | `{dur_display}` |\n\n'
          types_to_report = ['smoke', 'load', 'stress', 'spike', 'soak'] if TEST_TYPE == 'all' else [TEST_TYPE]
          if TEST_TYPE == 'all':
              out += '### Resultados por Tipo\n\n'
              out += '| Tipo | p50 (ms) | p95 (ms) | p99 (ms) | Req/s | Total | Erro % | Status |\n|------|----------|----------|----------|-------|-------|--------|--------|\n'
              for t in types_to_report:
                  sp = Path(f'k6/results/{t}/summary.json')
                  emoji = {'smoke':'ðµ','load':'ð¢','stress':'ð¡','spike':'ð´','soak':'ð£'}.get(t,'')
                  if sp.exists():
                      try:
                          s=json.loads(sp.read_text())
                          dur=s.get('metrics',{}).get('http_req_duration',{}).get('values',{})
                          reqs=s.get('metrics',{}).get('http_reqs',{}).get('values',{})
                          errs=s.get('metrics',{}).get('http_req_failed',{}).get('values',{})
                          all_ok=all((v if isinstance(v,bool) else v.get('ok',False)) for md in s.get('metrics',{}).values() for v in md.get('thresholds',{}).values())
                          status='â' if all_ok else 'â'
                          out+=f"| {emoji} {t} | {dur.get('med',0):.1f} | {dur.get('p(95)',0):.1f} | {dur.get('p(99)',0):.1f} | {reqs.get('rate',0):.2f} | {int(reqs.get('count',0)):,} | {errs.get('rate',0)*100:.2f}% | {status} |\n"
                      except: out+=f"| {emoji} {t} | â | â | â | â | â | â | â ï¸ |\n"
                  else: out+=f"| {emoji} {t} | â | â | â | â | â | â | â­ï¸ |\n"
              out+='\n'
          else:
              sp=Path(f'k6/results/{TEST_TYPE}/summary.json')
              if sp.exists():
                  try:
                      s=json.loads(sp.read_text())
                      dur=s.get('metrics',{}).get('http_req_duration',{}).get('values',{})
                      reqs=s.get('metrics',{}).get('http_reqs',{}).get('values',{})
                      errs=s.get('metrics',{}).get('http_req_failed',{}).get('values',{})
                      out+=('### MÃ©tricas\n\n| MÃ©trica | Valor |\n|---------|-------|\n'
                          f'| p50 | {dur.get("med",0):.1f} ms |\n| p95 | {dur.get("p(95)",0):.1f} ms |\n| p99 | {dur.get("p(99)",0):.1f} ms |\n| avg | {dur.get("avg",0):.1f} ms |\n| Req/s | {reqs.get("rate",0):.2f} |\n| Total | {int(reqs.get("count",0)):,} |\n| Erro % | {errs.get("rate",0)*100:.2f}% |\n\n')
                      rows=[]
                      for mn,md in s.get('metrics',{}).items():
                          for cond,passed in md.get('thresholds',{}).items():
                              ok=passed if isinstance(passed,bool) else passed.get('ok',False)
                              rows.append(f'| {mn} | `{cond}` | {"â" if ok else "â"} |')
                      if rows: out+='### Thresholds\n\n| MÃ©trica | CondiÃ§Ã£o | Status |\n|---------|---------|--------|\n'+'\n'.join(rows)+'\n'
                  except Exception as e: out+=f'> â ï¸ Falha: {e}\n'
              else: out+='> â ï¸ `summary.json` nÃ£o encontrado.\n'
          artifact_name=f'k6-{TEST_TYPE}-run-{RUN_NUMBER}'
          out+=('\n---\n### ð Como ver o dashboard completo\n\n1. Role atÃ© o final â seÃ§Ã£o **Artifacts**\n2. Clique em **`'+artifact_name+'`** para baixar o zip\n3. Extraia e abra **`dashboard.html`** no browser\n\n> Os grÃ¡ficos mostram latÃªncia p95/avg, VUs e Req/s ao longo do tempo.\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(out)
          PYEOF
        env:
          TEST_TYPE:      ${{ github.event.inputs.test_type }}
          TARGET_URL:     ${{ github.event.inputs.target_url }}
          RUN_NUMBER:     ${{ github.run_number }}
          VUS_INPUT:      ${{ github.event.inputs.vus }}
          DURATION_INPUT: ${{ github.event.inputs.duration }}

      - name: Upload artefatos K6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ github.event.inputs.test_type }}-run-${{ github.run_number }}
          path: k6/results/
          retention-days: 30

      - name: Falhar se K6 reprovou
        if: |
          always() && (
            steps.smoke_run.outcome  == 'failure' ||
            steps.load_run.outcome   == 'failure' ||
            steps.stress_run.outcome == 'failure' ||
            steps.spike_run.outcome  == 'failure' ||
            steps.soak_run.outcome   == 'failure'
          )
        run: |
          echo "::error::K6 falhou â algum threshold foi violado ou o teste terminou com erro."
          exit 1
