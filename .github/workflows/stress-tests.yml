name: K6 Stress Tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Tipo de teste a executar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - load
          - stress
          - spike
          - soak

jobs:
  stress-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test: ${{ fromJson(github.event.inputs.test_type == 'all' || github.event_name == 'schedule' ? '["smoke", "load", "stress", "spike", "soak"]' : format('["{0}"]', github.event.inputs.test_type)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6-stable-debian.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run ${{ matrix.test }} test
        run: |
          cd k6
          k6 run scripts/${{ matrix.test }}.js --out json=results/${{ matrix.test }}.json

      - name: Upload results as artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: k6-results-${{ matrix.test }}
          path: k6/results/${{ matrix.test }}.json

  publicar-pages:
    needs: stress-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all results
        uses: actions/download-artifact@v3
        with:
          path: k6/results/

      - name: Setup SSH para VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_HOSTINGER_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 2.25.122.11 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy de resultados para VPS via Git
        run: |
          echo "🚀 Fazendo deploy dos resultados via git clone/pull na VPS..."
          
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@2.25.122.11 << 'EOF'
            set -e
            
            REPO_DIR="/home/projetos/comprai"
            
            echo "📍 Acessando repositório..."
            mkdir -p "$REPO_DIR"
            cd "$REPO_DIR"
            
            # Se repositório existe, fazer pull
            if [ -d ".git" ]; then
              echo "📍 Atualizando repositório existente..."
              git pull origin main --depth=1 || git fetch origin main && git reset --hard origin/main
            else
              echo "📍 Clonando repositório..."
              git clone https://${{ secrets.GH_PAT }}@github.com/josehelioaraujo/comprai.git . --depth=1
            fi
            
            echo "✅ Repositório atualizado!"
            echo "📄 Arquivos em k6/results/:"
            ls -lh k6/results/ 2>/dev/null | head -10 || echo "Nenhum arquivo"
            
            if [ -f "k6/results/index.json" ]; then
              echo "📋 Conteúdo do index.json:"
              cat k6/results/index.json
            fi
          EOF
          
      - name: Resumo do Deploy
        if: always()
        run: |
          echo "✨ Deploy concluído!"
          echo "📊 Dashboard: https://comprai.2.25.122.11.nip.io/k6/dashboard/"
