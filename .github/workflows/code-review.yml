name: Code Review — AI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar diff do PR
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- 'src/**/*.cs' 'tests/**/*.cs' \
            | head -c 7000 > /tmp/pr_diff.txt
          echo "Linhas no diff: $(wc -l < /tmp/pr_diff.txt)"

      - name: Verificar API Key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY nao configurado. Va em Settings > Secrets > Actions e adicione o secret."
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "API Key encontrada"
            echo "skip=false" >> $GITHUB_ENV
          fi

      - name: Executar code review via Claude API
        if: env.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request, sys

          diff = open('/tmp/pr_diff.txt', encoding='utf-8', errors='ignore').read()
          if not diff.strip():
              print("Sem diff de .cs para revisar")
              open('/tmp/review.json','w').write('{"skip": true}')
              sys.exit(0)

          pr_title = os.environ.get('PR_TITLE', '')
          pr_branch = os.environ.get('PR_BRANCH', '')
          api_key   = os.environ.get('ANTHROPIC_API_KEY', '')

          system = (
              "Voce e um especialista em .NET/C# revisando Pull Requests. "
              "Responda sempre em PT-BR, de forma objetiva e construtiva. "
              "Contexto: Vertical Slice + Hexagonal + Plugin Pattern, "
              ".NET 10, MediatR, xUnit, cobertura maior que 90 porcento."
          )

          user_msg = (
              "PR: " + pr_title + "\n"
              "Branch: " + pr_branch + "\n\n"
              "Diff (arquivos .cs):\n```diff\n" + diff + "\n```\n\n"
              "Faca uma revisao objetiva em PT-BR com esta estrutura:\n\n"
              "## Resumo\nUma ou duas frases sobre o que o PR faz.\n\n"
              "## Pontos Positivos\nMaximo 3 itens.\n\n"
              "## Problemas Encontrados\n"
              "- **[CRITICO/IMPORTANTE/SUGESTAO]** Descricao + sugestao de correcao\n\n"
              "## Checklist\n"
              "- [ ] Segue arquitetura Vertical Slice / Hexagonal?\n"
              "- [ ] Tem testes para a logica de negocio?\n"
              "- [ ] Nomes seguem convencao do projeto?\n"
              "- [ ] Sem dependencias desnecessarias entre camadas?\n"
              "- [ ] Tratamento de erros adequado?\n\n"
              "## Veredicto\n"
              "**APROVADO** / **APROVADO COM RESSALVAS** / **SOLICITAR MUDANCAS**"
          )

          body = json.dumps({
              "model": "claude-sonnet-4-6",
              "max_tokens": 1500,
              "system": system,
              "messages": [{"role": "user", "content": user_msg}]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as r:
                  resp = json.loads(r.read())
              review_text = resp["content"][0]["text"]
              print("Review gerado com sucesso")
              open('/tmp/review.json','w').write(
                  json.dumps({"text": review_text, "skip": False})
              )
          except urllib.error.HTTPError as e:
              err = e.read().decode()
              print("Erro HTTP " + str(e.code) + ": " + err[:300])
              sys.exit(1)
          PYEOF

      - name: Postar review no PR
        if: env.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request

          if not os.path.exists('/tmp/review.json'):
              print("Sem review para postar")
              exit(0)

          review = json.load(open('/tmp/review.json'))
          if review.get('skip'):
              print("Review ignorado")
              exit(0)

          comment = (
              "## Code Review — Claude AI\n\n"
              + review["text"]
              + "\n\n---\n*Revisao automatica via Claude AI. Valide com o time antes de mergear.*"
          )

          payload = json.dumps({"body": comment}).encode()
          url = (
              "https://api.github.com/repos/"
              + os.environ["REPO"]
              + "/issues/"
              + os.environ["PR_NUMBER"]
              + "/comments"
          )

          req = urllib.request.Request(
              url, data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github.v3+json"
              },
              method="POST"
          )
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())
              print("Comentario postado: " + result["html_url"])
          PYEOF
