name: Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar diff e chamar Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Diff
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- 'src/**/*.cs' 'tests/**/*.cs' | head -c 6000)
          if [ -z "$DIFF" ]; then
            echo "Sem diff .cs para revisar"
            exit 0
          fi

          # 2. Montar prompt e payload com jq
          SYSTEM="Voce e especialista em .NET/C# revisando PRs. Responda em PT-BR. Contexto: Vertical Slice, Hexagonal, Plugin Pattern, .NET 10, MediatR, xUnit."
          USER_MSG="PR: ${PR_TITLE}\nBranch: ${PR_BRANCH}\n\nDiff:\n\`\`\`diff\n${DIFF}\n\`\`\`\n\nEstrutura:\n## Resumo\n## Pontos Positivos\n## Problemas - [CRITICO/IMPORTANTE/SUGESTAO] descricao\n## Checklist\n- [ ] Arquitetura Vertical Slice/Hexagonal?\n- [ ] Testes unitarios?\n- [ ] Convencao de nomes?\n- [ ] Dependencias entre camadas?\n## Veredicto: APROVADO / APROVADO COM RESSALVAS / SOLICITAR MUDANCAS"

          PAYLOAD=$(jq -n \
            --arg model "llama-3.3-70b-versatile" \
            --arg sys "$SYSTEM" \
            --arg usr "$USER_MSG" \
            '{model: $model, max_tokens: 1500, messages: [{role:"system",content:$sys},{role:"user",content:$usr}]}')

          # 3. Chamar Groq
          HTTP=$(curl -s -o /tmp/groq.json -w "%{http_code}" \
            -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "User-Agent: curl/7.88.1" \
            -d "$PAYLOAD")

          echo "Groq HTTP: $HTTP"
          if [ "$HTTP" != "200" ]; then
            cat /tmp/groq.json
            exit 1
          fi

          REVIEW=$(jq -r '.choices[0].message.content' /tmp/groq.json)
          echo "Review gerado: ${#REVIEW} chars"

          # 4. Postar comentario no PR
          COMMENT=$(jq -n --arg body "## Code Review — AI (Groq / Llama 3.3 70B)\n\n${REVIEW}\n\n---\n*Revisao automatica. Valide antes de mergear.*" '{body: $body}')
          curl -s -X POST \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$COMMENT" | jq -r '.html_url // "Erro ao postar"'
