name: Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir modelo disponivel e revisar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Diff
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- 'src/**/*.cs' 'tests/**/*.cs' | head -c 6000)
          if [ -z "$DIFF" ]; then
            echo "Sem diff .cs"
            exit 0
          fi

          # 2. Listar modelos disponiveis e escolher o melhor
          MODELS_JSON=$(curl -s "https://api.groq.com/openai/v1/models" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "User-Agent: curl/7.88.1")
          echo "Modelos disponiveis:"
          echo "$MODELS_JSON" | jq -r '.data[].id' 2>/dev/null || echo "$MODELS_JSON"

          # Preferencia: 70b > 8b > qualquer outro
          MODEL=$(echo "$MODELS_JSON" | jq -r '
            .data[].id |
            select(test("gpt-oss-120b|llama.*70b|mixtral|qwen.*27b|qwen.*32|llama.*versatile"; "i"))
          ' 2>/dev/null | head -1)

          if [ -z "$MODEL" ]; then
            MODEL=$(echo "$MODELS_JSON" | jq -r '.data[0].id' 2>/dev/null)
          fi

          if [ -z "$MODEL" ]; then
            MODEL="llama-3.1-8b-instant"
          fi

          echo "Usando modelo: $MODEL"

          # 3. Montar payload
          PAYLOAD=$(jq -n \
            --arg model "$MODEL" \
            --arg sys "Voce e especialista em .NET/C# revisando PRs. Responda em PT-BR. Contexto: Vertical Slice, Hexagonal, Plugin Pattern, .NET 10, MediatR, xUnit." \
            --arg usr "PR: ${PR_TITLE}\nBranch: ${PR_BRANCH}\n\nDiff (.cs):\n\`\`\`diff\n${DIFF}\n\`\`\`\n\nRevisao:\n## Resumo\n## Pontos Positivos\n## Problemas\n- [CRITICO/IMPORTANTE/SUGESTAO] descricao + correcao\n## Checklist\n- [ ] Arquitetura Vertical Slice/Hexagonal?\n- [ ] Testes unitarios?\n- [ ] Convencao de nomes?\n- [ ] Dependencias entre camadas?\n## Veredicto: APROVADO / APROVADO COM RESSALVAS / SOLICITAR MUDANCAS" \
            '{model: $model, max_tokens: 1500, messages: [{role:"system",content:$sys},{role:"user",content:$usr}]}')

          # 4. Chamar Groq
          HTTP=$(curl -s -o /tmp/groq.json -w "%{http_code}" \
            -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "User-Agent: curl/7.88.1" \
            -d "$PAYLOAD")

          echo "Groq HTTP: $HTTP"
          if [ "$HTTP" != "200" ]; then
            cat /tmp/groq.json
            exit 1
          fi

          REVIEW=$(jq -r '.choices[0].message.content' /tmp/groq.json)
          echo "Review: ${#REVIEW} chars"

          # 5. Postar no PR
          COMMENT=$(jq -n \
            --arg body "## Code Review — AI (Groq / ${MODEL})\n\n${REVIEW}\n\n---\n*Revisao automatica. Valide antes de mergear.*" \
            '{body: $body}')
          curl -s -X POST \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$COMMENT" | jq -r '.html_url // "Erro ao postar"'
