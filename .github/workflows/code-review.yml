name: Code Review — AI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar diff do PR
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- 'src/**/*.cs' 'tests/**/*.cs' \
            | head -c 7000 > /tmp/pr_diff.txt
          echo "Linhas no diff: $(wc -l < /tmp/pr_diff.txt)"

      - name: Executar code review via Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          DIFF=$(cat /tmp/pr_diff.txt)
          if [ -z "$DIFF" ]; then
            echo "Sem diff de .cs para revisar"
            echo '{"skip": true}' > /tmp/review.json
            exit 0
          fi

          # Montar payload JSON via Python (seguro para caracteres especiais)
          python3 - << 'INNEREOF'
          import os, json, sys
          diff      = open('/tmp/pr_diff.txt', encoding='utf-8', errors='ignore').read()
          pr_title  = os.environ.get('PR_TITLE', '')
          pr_branch = os.environ.get('PR_BRANCH', '')
          system_msg = (
              "Voce e um especialista em .NET/C# revisando Pull Requests. "
              "Responda sempre em PT-BR, objetivamente. "
              "Contexto: Vertical Slice + Hexagonal + Plugin Pattern, .NET 10, MediatR, xUnit."
          )
          user_msg = (
              "PR: " + pr_title + "
Branch: " + pr_branch + "

"
              "Diff:
```diff
" + diff + "
```

"
              "Estrutura da revisao:
"
              "## Resumo
## Pontos Positivos
"
              "## Problemas Encontrados
- **[CRITICO/IMPORTANTE/SUGESTAO]** descricao + correcao
"
              "## Checklist
"
              "- [ ] Arquitetura Vertical Slice / Hexagonal?
"
              "- [ ] Testes unitarios?
- [ ] Convencao de nomes?
"
              "- [ ] Sem dependencias entre camadas?
- [ ] Tratamento de erros?
"
              "## Veredicto
**APROVADO** / **APROVADO COM RESSALVAS** / **SOLICITAR MUDANCAS**"
          )
          payload = {"model": "llama-3.3-70b-versatile", "max_tokens": 1500,
              "messages": [{"role": "system", "content": system_msg},
                           {"role": "user",   "content": user_msg}]}
          open('/tmp/payload.json','w').write(json.dumps(payload))
          print("Payload gerado")
          INNEREOF

          # Chamar Groq via curl (evita bloqueio Cloudflare)
          HTTP_CODE=$(curl -s -o /tmp/groq_response.json -w "%{http_code}"             -X POST "https://api.groq.com/openai/v1/chat/completions"             -H "Content-Type: application/json"             -H "Authorization: Bearer $GROQ_API_KEY"             -H "User-Agent: curl/7.88.1"             -d @/tmp/payload.json)

          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Erro Groq:"
            cat /tmp/groq_response.json
            exit 1
          fi

          # Extrair review e salvar
          python3 -c "
          import json
          resp = json.load(open('/tmp/groq_response.json'))
          text = resp['choices'][0]['message']['content']
          open('/tmp/review.json','w').write(json.dumps({'text': text, 'skip': False}))
          print('Review gerado com sucesso (' + str(len(text)) + ' chars)')
          "

      - name: Postar review no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request

          if not os.path.exists('/tmp/review.json'):
              print("Sem review para postar")
              exit(0)

          review = json.load(open('/tmp/review.json'))
          if review.get('skip'):
              print("Review ignorado")
              exit(0)

          comment = (
              "## Code Review — AI (Groq / Llama 3.3 70B)\n\n"
              + review["text"]
              + "\n\n---\n*Revisao automatica. Valide com o time antes de mergear.*"
          )

          payload = json.dumps({"body": comment}).encode()
          url = (
              "https://api.github.com/repos/"
              + os.environ["REPO"]
              + "/issues/"
              + os.environ["PR_NUMBER"]
              + "/comments"
          )

          req = urllib.request.Request(
              url, data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github.v3+json"
              },
              method="POST"
          )
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())
              print("Comentario postado: " + result["html_url"])
          PYEOF
