name: Code Review — AI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar diff do PR
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- 'src/**/*.cs' 'tests/**/*.cs' \
            > /tmp/pr_diff.txt
          echo "Linhas no diff: $(wc -l < /tmp/pr_diff.txt)"
          # Limitar a 8000 chars para nao estourar contexto
          head -c 8000 /tmp/pr_diff.txt > /tmp/pr_diff_trimmed.txt

      - name: Executar code review via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request

          diff = open('/tmp/pr_diff_trimmed.txt', encoding='utf-8', errors='ignore').read()
          if not diff.strip():
              print("Sem diff de .cs para revisar")
              open('/tmp/review.json','w').write('{"skip": true}')
              exit(0)

          pr_title = os.environ.get('PR_TITLE', '')
          pr_branch = os.environ.get('PR_BRANCH', '')

          prompt = f"""Voce e um especialista em .NET/C# fazendo code review de um Pull Request.

PR: {pr_title}
Branch: {pr_branch}

Contexto do projeto:
- Arquitetura: Vertical Slice + Hexagonal + Plugin Pattern
- Runtime: .NET 10, Minimal API, MediatR
- Padrao de nomenclatura: Handlers em Application, Ports em Domain, Adapters em Infrastructure
- Testes: xUnit, cobertura > 90%, mutation testing com Stryker

Diff do PR (apenas arquivos .cs):
```diff
{diff[:7000]}
```

Faca uma revisao de codigo objetiva em PT-BR. Estruture assim:

## Resumo
Uma ou duas frases sobre o que o PR faz.

## Pontos Positivos
Maximo 3 itens concisos.

## Problemas Encontrados
Para cada problema:
- **[CRITICO/IMPORTANTE/SUGESTAO]** Descricao clara do problema
- Arquivo e linha aproximada se possivel
- Sugestao de correcao

## Checklist de Qualidade
- [ ] Segue arquitetura Vertical Slice / Hexagonal?
- [ ] Tem testes unitarios para a logica de negocio?
- [ ] Nomes de classes/metodos seguem convencao do projeto?
- [ ] Sem dependencias desnecessarias entre camadas?
- [ ] Tratamento de erros adequado?

## Veredicto
**APROVADO** / **APROVADO COM RESSALVAS** / **SOLICITAR MUDANCAS**
"""

          body = {
              "model": "claude-sonnet-4-6",
              "max_tokens": 1500,
              "messages": [{"role": "user", "content": prompt}]
          }

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps(body).encode(),
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01"
              },
              method="POST"
          )

          with urllib.request.urlopen(req) as r:
              resp = json.loads(r.read())

          review_text = resp["content"][0]["text"]
          print("Review gerado com sucesso")
          open('/tmp/review.json','w').write(json.dumps({"text": review_text, "skip": False}))
          PYEOF

      - name: Postar review no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request

          review = json.load(open('/tmp/review.json'))
          if review.get('skip'):
              print("Sem arquivos .cs para revisar — pulando")
              exit(0)

          body = "## 🤖 Code Review — Claude AI\n\n" + review["text"]
          body += "\n\n---\n*Revisao automatica gerada por Claude AI. Sempre valide com o time.*"

          payload = json.dumps({"body": body}).encode()
          url = f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments"

          req = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github.v3+json"
              },
              method="POST"
          )
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())
              print(f"Comentario postado: {result['html_url']}")
          PYEOF
