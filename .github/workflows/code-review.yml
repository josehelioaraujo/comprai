name: Code Review — AI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar diff do PR
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- 'src/**/*.cs' 'tests/**/*.cs' \
            | head -c 7000 > /tmp/pr_diff.txt
          echo "Linhas no diff: $(wc -l < /tmp/pr_diff.txt)"

      - name: Executar code review via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request

          diff = open('/tmp/pr_diff.txt', encoding='utf-8', errors='ignore').read()
          if not diff.strip():
              print("Sem diff de .cs para revisar")
              open('/tmp/review.json','w').write('{"skip": true}')
              exit(0)

          pr_title = os.environ.get('PR_TITLE', '')
          pr_branch = os.environ.get('PR_BRANCH', '')

          system = (
              "Voce e um especialista em .NET/C# revisando Pull Requests. "
              "Responda sempre em PT-BR, de forma objetiva e construtiva. "
              "Contexto: projeto com Vertical Slice + Hexagonal + Plugin Pattern, "
              ".NET 10, MediatR, xUnit, cobertura > 90%."
          )

          user_msg = (
              "PR: " + pr_title + "\n"
              "Branch: " + pr_branch + "\n\n"
              "Diff (arquivos .cs):\n```diff\n" + diff + "\n```\n\n"
              "Faca uma revisao objetiva estruturada assim:\n\n"
              "## Resumo\nUma ou duas frases sobre o que o PR faz.\n\n"
              "## Pontos Positivos\nMaximo 3 itens concisos.\n\n"
              "## Problemas Encontrados\n"
              "Para cada problema:\n"
              "- **[CRITICO/IMPORTANTE/SUGESTAO]** Descricao clara\n"
              "- Arquivo e linha aproximada se possivel\n"
              "- Sugestao de correcao\n\n"
              "## Checklist de Qualidade\n"
              "- [ ] Segue arquitetura Vertical Slice / Hexagonal?\n"
              "- [ ] Tem testes unitarios para a logica de negocio?\n"
              "- [ ] Nomes seguem convencao do projeto?\n"
              "- [ ] Sem dependencias desnecessarias entre camadas?\n"
              "- [ ] Tratamento de erros adequado?\n\n"
              "## Veredicto\n"
              "**APROVADO** / **APROVADO COM RESSALVAS** / **SOLICITAR MUDANCAS**"
          )

          body = {
              "model": "claude-sonnet-4-6",
              "max_tokens": 1500,
              "system": system,
              "messages": [{"role": "user", "content": user_msg}]
          }

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps(body).encode(),
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01"
              },
              method="POST"
          )

          with urllib.request.urlopen(req) as r:
              resp = json.loads(r.read())

          review_text = resp["content"][0]["text"]
          print("Review gerado:")
          print(review_text[:200])
          open('/tmp/review.json','w').write(
              json.dumps({"text": review_text, "skip": False})
          )
          PYEOF

      - name: Postar review no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request

          review = json.load(open('/tmp/review.json'))
          if review.get('skip'):
              print("Nenhum arquivo .cs para revisar — pulando")
              exit(0)

          comment = (
              "## Code Review automatico — Claude AI\n\n"
              + review["text"]
              + "\n\n---\n*Revisao gerada automaticamente. Valide com o time antes de mergear.*"
          )

          payload = json.dumps({"body": comment}).encode()
          url = (
              "https://api.github.com/repos/"
              + os.environ["REPO"]
              + "/issues/"
              + os.environ["PR_NUMBER"]
              + "/comments"
          )

          req = urllib.request.Request(
              url, data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github.v3+json"
              },
              method="POST"
          )
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())
              print("Comentario postado: " + result["html_url"])
          PYEOF
