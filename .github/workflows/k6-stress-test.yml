name: K6 Stress Test
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
jobs:
  stress-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run K6 Stress Test
        run: |
          sudo apt-get update && sudo apt-get install -y k6
          k6 run seu-script.js --summary-export=summary.json
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
      - name: Format Results
        run: python3 .github/scripts/format-k6-results.py
      - name: Upload to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          scp k6-result-$(date +%Y-%m-%dT%H:%M:%SZ).json ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/app/wwwroot/k6/results/
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
      - name: Cleanup
        run: rm -f ~/.ssh/id_rsa