name: Linear — Backfill Retroativo (V052–V073)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "sim" para confirmar a execução (operação única)'
        required: true
        default: ''

jobs:
  backfill:
    name: Populate Linear workspace
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'sim' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --save-dev \
            @linear/sdk@7.0.0 \
            tsx@4.19.1 \
            typescript@5.5.4

      - name: Diagnostics
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          echo "=== DIAGNOSTICS ==="
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          KEY_LEN=${#LINEAR_API_KEY}
          echo "LINEAR_API_KEY length: ${KEY_LEN}"
          if [ $KEY_LEN -gt 0 ]; then
            echo "API key prefix: ${LINEAR_API_KEY:0:8}..."
          else
            echo "ERROR: LINEAR_API_KEY is EMPTY"
            exit 1
          fi
          HTTP=$(curl -s -o /tmp/linear_response.json -w "%{http_code}" \
            -H "Authorization: ${LINEAR_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ viewer { id name } }"}' \
            https://api.linear.app/graphql)
          echo "Linear API HTTP status: ${HTTP}"
          echo "Linear API response: $(cat /tmp/linear_response.json)"

      - name: Run backfill
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set +e
          npx tsx scripts/linear-populate.ts backfill 2>&1 | tee /tmp/backfill.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== BACKFILL EXIT CODE: ${EXIT_CODE} ==="
          exit $EXIT_CODE

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-logs
          path: /tmp/backfill.log
          retention-days: 3

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Linear Backfill concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Criados no workspace **Helioandrade**:" >> $GITHUB_STEP_SUMMARY
          echo "- 📁 Projeto: **Comprai Platform**" >> $GITHUB_STEP_SUMMARY
          echo "- 🏷️ Labels: fix · feat · chore · infra · test · security · e2e" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Cycles: V052 → V073" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ V052–V072: **Done**" >> $GITHUB_STEP_SUMMARY
          echo "- 🚧 V073: **In Progress**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Abrir Linear](https://linear.app/helioandrade/project/comprai-platform)" >> $GITHUB_STEP_SUMMARY
