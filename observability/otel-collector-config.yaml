receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

exporters:
  datadog:
    api:
      site: datadoghq.com
      key: ${DD_API_KEY}

  otlp/newrelic:
    endpoint: otlp.nr-data.net:4317
    headers:
      api-key: ${NEW_RELIC_LICENSE_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog, otlp/newrelic]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog, otlp/newrelic]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog, otlp/newrelic]
