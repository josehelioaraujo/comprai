receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 256

  resource:
    attributes:
      - action: upsert
        key: service.name
        value: comprai-api

exporters:
  # ── Datadog ────────────────────────────────────────────────────────────────
  datadog:
    api:
      site: datadoghq.com
      key: ${DD_API_KEY}

  # ── New Relic (traces + metrics + logs) ────────────────────────────────────
  otlphttp/newrelic:
    endpoint: https://otlp.nr-data.net:4318
    headers:
      api-key: ${NEW_RELIC_LICENSE_KEY}
    tls:
      insecure: false

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [datadog, otlphttp/newrelic]

    metrics:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [datadog, otlphttp/newrelic]

    # Loki removido — exporter não disponível nessa versão do collector-contrib
    # Logs chegam no Loki via Promtail (Docker log driver)
    logs:
      receivers:  [otlp]
      processors: [resource, batch]
      exporters:  [datadog, otlphttp/newrelic]
